// --- Products View (DataTable CRUD + QR) ---
function ProductsView({ user, role, setActiveMenu }) {
  const nav = useAppNav();
  const [qSearch, setQSearch] = useState('');
  const catOpts = useCategoryOpts();
  const [showModal, setShowModal] = useState(false);
  /* open-create:products */
  useEffect(() => {
    if (nav && nav.consumeCreate && nav.consumeCreate('products')) {
      setEditingId(null); setShowModal(true);
    }
  }, []);

  const [editingId, setEditingId] = useState(null);
  const [qrProductId, setQrProductId] = useState(null);
  const [viewProd, setViewProd] = useState(null);
  const [printAll, setPrintAll] = useState(false);
  const [printRows, setPrintRows] = useState([]);
  const [showReorderReport, setShowReorderReport] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  useEffect(() => {
    const fn = (e) => { if (!e.detail || e.detail.tableId === 'productsTable') setReloadKey(k => k + 1); };
    window.addEventListener('erp-data-changed', fn);
    return () => window.removeEventListener('erp-data-changed', fn);
  }, []);
  const [filters, setFilters] = useState({ category: '', lowStock: '', status: '' });
  const [load, setLoad] = useState('');
  const tableInstanceRef = useRef(null);
  useDtLiveSearch(tableInstanceRef, qSearch);
  const searchFnRef = useRef(null); // our own global-search predicate - removed by identity, never blind-pop another view's

  const { loading, data, err } = useFetch(() => Promise.all([fbGetProducts(), fbGetStockMovements()]), [reloadKey]);
  const products = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const movements = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);

  const tableData = useMemo(() => products.map(p => Object.assign({}, p, { qtyOnHand: computeQtyOnHand(p.id, movements) })), [products, movements]);
  const byId = useMemo(() => products.reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const openEdit = useCallback((id) => { setEditingId(id); setShowModal(true); }, []);

  useEffect(() => {
    if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load products' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(tableData).draw(false);
    } else {
      table = $('#productsTable').DataTable({
        data: tableData,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (Number(d.qtyOnHand) <= Number(d.reorderLevel || 0)) $(row).addClass('row-warn'); }, // low stock
        columns: [
          { data: 'imageUrl', title: '', orderable: false, render: (d, t) => t === 'display' ? (d ? `<img class="prod-thumb" src="${esc(d)}" onerror="this.style.visibility='hidden'">` : `<span class="prod-thumb empty"><i class="fas fa-box"></i></span>`) : '' },
          { data: 'name', title: 'Emri', render: (d, t, row) => t === 'display' ? esc(d) + (row.brand ? `<div class="cell-sub">${esc(row.brand)}</div>` : '') : d },
          { data: 'sku', title: 'SKU', render: (d, t) => t === 'display' ? '<code>' + esc(d) + '</code>' : d },
          { data: 'barcode', title: 'Barkodi', render: (d, t) => t === 'display' ? (d ? '<code>' + esc(d) + '</code>' : '<span style="color:#bbb">—</span>') : (d || '') },
          { data: 'category', title: 'Kategoria', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'price', title: 'Çmimi', render: (d, t) => t === 'display' ? money(d) : d },
          { data: null, title: 'Njësitë', render: (d, t, row) => t === 'display' ? esc(formatUnitStructure(row)) : formatUnitStructure(row) },
          { data: 'qtyOnHand', title: 'Gjendje', render: (d, t, row) => t === 'display' ? (Number(d) <= Number(row.reorderLevel || 0) ? '<span class="status-badge status-inactive">' + esc(formatQtyWithUnits(d, row)) + '</span>' : esc(formatQtyWithUnits(d, row))) : d },
          { data: 'reorderLevel', title: 'Nivel furnizimi' },
          { data: 'status', title: 'Statusi', render: (d, t) => t === 'display' ? (d === 'discontinued' ? '<span class="status-badge status-inactive">Ndërprerë</span>' : '<span class="status-badge status-active">Aktiv</span>') : (d || 'active') },
          { data: null, title: 'Veprime', orderable: false, render: () => `<button class="product-action-btn" data-action="view" title="Shiko"><i class="fas fa-eye"></i> Shiko</button><button class="product-action-btn edit" data-action="edit" title="Ndrysho"><i class="fas fa-pen"></i> Ndrysho</button><button class="product-action-btn qr" data-action="qr" title="QR"><i class="fas fa-qrcode"></i> QR</button>` + (role === 'Admin' ? `<button class="product-action-btn delete" data-action="delete" title="Fshi"><i class="fas fa-trash"></i> Fshi</button>` : '') }
        ],
        pageLength: 80,
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: erpDtButtons('Artikujt'),
        order: [[1, 'asc']]
      });
      tableInstanceRef.current = table;
    }
    $('#productsTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      let tr = $(this).closest('tr');
      if (tr.hasClass('child')) tr = tr.prev();
      const rowData = table.row(tr).data();
      if (!rowData || !rowData.id) return;
      const id = rowData.id;
      const action = $(this).data('action');
      if (action === 'view') setViewProd(byId[id] || rowData);
      else if (action === 'edit') openEdit(id);
      else if (action === 'qr') setQrProductId(id);
      else if (action === 'delete') handleDelete(byId[id] || rowData);
    });
  }, [loading, tableData, role]);

  useEffect(() => () => {
    const ext = $.fn.dataTable.ext.search;
    const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1); // stop the filter leaking into other views' tables
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  const applyFilters = () => {
    if (!tableInstanceRef.current) return;
    const dt = tableInstanceRef.current;
    const ext = $.fn.dataTable.ext.search;
    const prev = ext.indexOf(searchFnRef.current); if (prev !== -1) ext.splice(prev, 1); // replace our own predicate only
    const fn = (settings, dataRow, dataIndex) => {
      const p = tableData[dataIndex];
      if (!p) return true;
      if (filters.category && p.category !== filters.category) return false;
      if (filters.lowStock === '1' && !(Number(p.qtyOnHand) <= Number(p.reorderLevel || 0))) return false;
      if (filters.status && (p.status || 'active') !== filters.status) return false;
      return true;
    };
    searchFnRef.current = fn; ext.push(fn);
    dt.draw();
  };

  const clearFilters = () => {
    setFilters({ category: '', lowStock: '', status: '' });
    const ext = $.fn.dataTable.ext.search;
    const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1);
    searchFnRef.current = null;
    if (tableInstanceRef.current) tableInstanceRef.current.draw();
  };

  useEffect(() => { if (tableInstanceRef.current && tableData.length > 0) applyFilters(); }, [filters, tableData]);

  const isFiltered = !!(filters.category || filters.lowStock || filters.status);
  const reorderRows = useMemo(() => tableData.filter(p => Number(p.qtyOnHand) <= Number(p.reorderLevel || 0)), [tableData]);
  const stockValue = useMemo(() => tableData.reduce((s, p) => s + Number(p.qtyOnHand || 0) * (Number(p.cost) || 0), 0), [tableData]);

  const handlePrintLabels = () => {
    const dt = tableInstanceRef.current;
    setPrintRows(dt ? dt.rows({ search: 'applied' }).data().toArray() : tableData);
    setPrintAll(true);
  };

  const handleSave = async (formData) => {
    setLoad(editingId ? 'Updating product...' : 'Saving product...');
    const result = editingId ? await fbUpdateProduct(editingId, formData, user) : await fbAddProduct(formData, user);
    setLoad('');
    if (result.success) {
      setShowModal(false); setEditingId(null);
      Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
      reload();
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: result.message });
    }
  };

  const handleDelete = (product) => {
    Swal.fire({ icon: 'warning', title: 'Delete?', text: 'This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
      if (!result.isConfirmed) return;
      setLoad('Deleting product...');
      const r = await fbDeleteProduct(product.id, product.name, user);
      setLoad('');
      if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
      else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
    });
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-boxes-stacked"></i> Produktet</h2>
        <div style={{ display: 'flex', gap: '10px' }}>
          <RefreshBtn onClick={reload} />
          <button className="btn btn-secondary" onClick={() => setShowReorderReport(true)} disabled={reorderRows.length === 0}><i className="fas fa-triangle-exclamation"></i> Printo Kërkesë Furnizimi</button>
          <button className="btn btn-secondary" onClick={handlePrintLabels} disabled={products.length === 0}><i className="fas fa-print"></i> {isFiltered ? 'Printo etiketat e filtruara' : 'Printo të gjitha etiketat QR'}</button>
          <button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> I ri</button>
        </div>
      </div>
      {!loading && (
        <div className="filters-section">
          <div className="filters-header">
            <h3><i className="fas fa-filter"></i> Filtrat & Kërkimi</h3>
            <button className="btn btn-secondary btn-sm" onClick={() => { clearFilters(); setQSearch(''); }}><i className="fas fa-times-circle"></i> Pastro të gjitha</button>
          </div>
          <div className="o-cp-tools" style={{ paddingLeft: 0, paddingRight: 0, borderBottom: 'none' }}>
            <OdooSearchFacets
              value={qSearch}
              onChange={setQSearch}
              placeholder="Kërko artikull… emër, SKU, barkod, kategori…"
              facets={[
                filters.category ? { id: 'cat', label: 'Kategoria', value: filters.category } : null,
                filters.lowStock ? { id: 'low', label: 'Stoku', value: 'I ulët' } : null,
                filters.status ? { id: 'st', label: 'Statusi', value: filters.status } : null,
                qSearch ? { id: 'q', label: 'Kërkim', value: qSearch } : null
              ].filter(Boolean)}
              onRemoveFacet={(f) => {
                if (f.id === 'cat') setFilters(x => ({ ...x, category: '' }));
                if (f.id === 'low') setFilters(x => ({ ...x, lowStock: '' }));
                if (f.id === 'st') setFilters(x => ({ ...x, status: '' }));
                if (f.id === 'q') setQSearch('');
              }}
              filterChips={[
                { id: 'low', label: 'Stok i ulët', active: !!filters.lowStock },
                { id: 'active', label: 'Aktivë', active: filters.status === 'active' },
                { id: 'discontinued', label: 'Ndërprerë', active: filters.status === 'discontinued' }
              ]}
              onToggleChip={(c) => {
                if (c.id === 'low') setFilters(x => ({ ...x, lowStock: x.lowStock ? '' : '1' }));
                else if (c.id === 'active') setFilters(x => ({ ...x, status: x.status === 'active' ? '' : 'active' }));
                else if (c.id === 'discontinued') setFilters(x => ({ ...x, status: x.status === 'discontinued' ? '' : 'discontinued' }));
              }}
            />
          </div>
          <div className="filters-grid">
            <SearchableDropdown label="Kategoria" icon="fas fa-tag" options={catOpts} value={filters.category} onChange={(val) => setFilters(f => ({ ...f, category: val }))} placeholder="All Categories" />
            <SearchableDropdown label="Stock Status" icon="fas fa-triangle-exclamation" options={LOW_STOCK_OPTS} value={filters.lowStock} onChange={(val) => setFilters(f => ({ ...f, lowStock: val }))} placeholder="All Stock Levels" />
            <SearchableDropdown label="Statusi" icon="fas fa-toggle-on" options={PRODUCT_STATUS_FILTER} value={filters.status} onChange={(val) => setFilters(f => ({ ...f, status: val }))} placeholder="All Statuses" />
          </div>
        </div>
      )}
      {loading && <TableSkeleton rows={8} columns={7} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <table id="productsTable" className="display" style={{ width: '100%' }}></table>
        {products.length > 0 && <FilteredSummaryBar tableRef={tableInstanceRef} deps={[tableData, filters, qSearch]} itemsBuilder={(rows) => [
          { label: 'Të filtruar', value: rows.length },
          { label: 'Vlera stokut (filtruar)', value: money(rows.reduce((s, r) => s + (Number(r.price || 0) * Number(r.qtyOnHand || 0)), 0)) },
          { label: 'Stok i ulët', value: rows.filter(r => Number(r.qtyOnHand) <= Number(r.reorderLevel || 0)).length }
        ]} />}
      </div>
      {showModal && <ProductModal product={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
      {viewProd && <ProductHubModal product={viewProd} onClose={() => setViewProd(null)} />}
      {qrProductId && <QRModal product={byId[qrProductId]} onClose={() => setQrProductId(null)} />}
      {printAll && <PrintAllLabels products={printRows} onDone={() => setPrintAll(false)} />}
      {showReorderReport && <ReorderReportPrint rows={reorderRows} onDone={() => setShowReorderReport(false)} />}
    </div>
  );
}

// --- Stock Movement Modal (Stock In / Stock Out - same modal, fixed type prop) ---
function StockMovementModal({ type, products, movements, onClose, onSave }) {
  const nav = useAppNav();
  const [productId, setProductId] = useState('');
  const [qty, setQty] = useState('');
  const [unitKey, setUnitKey] = useState('base');
  const [reason, setReason] = useState(type === 'out' ? 'Damage' : 'Purchase');
  const [reference, setReference] = useState('');
  const [unitCost, setUnitCost] = useState('');
  const [updateCost, setUpdateCost] = useState(true);
  const [supplier, setSupplier] = useState('');
  const [batchNo, setBatchNo] = useState('');
  const [expiryDate, setExpiryDate] = useState('');
  const [location, setLocation] = useState('');
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);

  const isOut = type === 'out';
  const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
  const selectedProduct = (products || []).find(p => p.id === productId);
  const unitOpts = useMemo(() => selectedProduct ? getProductUnitOptions(selectedProduct) : [{ value: 'base', label: 'copë (bazë)' }], [selectedProduct]);
  const selectedUnit = selectedProduct ? getProductUnit(selectedProduct, unitKey) : unitOpts[0];
  const baseQty = selectedProduct ? toBaseQty(selectedProduct, qty, unitKey) : Number(qty) || 0;
  const onHand = useMemo(() => productId ? computeQtyOnHand(productId, movements) : 0, [productId, movements]);

  // prefill cost + location from the product when picked (for IN)
  useEffect(() => { setUnitKey('base'); if (selectedProduct && !isOut) { setUnitCost(c => c || (selectedProduct.cost ?? '')); setLocation(l => l || (selectedProduct.location || '')); } }, [productId]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    const q = Number(qty);
    if (!productId) return Swal.fire({ icon: 'warning', title: 'Pick a Product', text: 'Select a product first' });
    if (!Number.isFinite(q) || q <= 0) return Swal.fire({ icon: 'warning', title: 'Sasi e pasaktë', text: 'Sasia duhet të jetë më e madhe se 0.' });
    if (baseQty <= 0) return Swal.fire({ icon: 'warning', title: 'Sasi e pasaktë', text: 'Konvertimi në njësinë bazë duhet të jetë më i madh se 0.' });
    if (isOut && baseQty > onHand) {
      const confirm = await Swal.fire({
        icon: 'warning', title: 'Qty On Hand Warning',
        text: `Gjendje aktuale: ${formatQtyWithUnits(onHand, selectedProduct)}. Kjo dalje do ta çojë gjendjen në ${formatQtyWithUnits(onHand - baseQty, selectedProduct)}. Të vazhdoj?`,
        showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Continue', cancelButtonText: 'Cancel'
      });
      if (!confirm.isConfirmed) return;
    }
    setSaving(true);
    const move = { productId, type, qty: baseQty, enteredQty: q, unitKey, unitName: selectedUnit.name, unitMultiplier: selectedUnit.multiplier, reason, reference: reference.trim() || null, location: location.trim() || null, notes: notes.trim() || null };
    if (!isOut) { move.enteredUnitCost = Number(unitCost) || 0; move.unitCost = selectedUnit.multiplier > 0 ? round2((Number(unitCost) || 0) / selectedUnit.multiplier) : (Number(unitCost) || 0); move.supplier = supplier.trim() || null; move.batchNo = batchNo.trim() || null; move.expiryDate = expiryDate || null; move.updateCost = updateCost && Number(unitCost) > 0; }
    await onSave(move, selectedProduct?.name || 'Unknown Product');
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className={`fas ${isOut ? 'fa-arrow-up' : 'fa-arrow-down'}`}></i> {isOut ? 'Dalje stoku' : 'Hyrje stoku'}</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <form onSubmit={handleSubmit}>
            <div className="form-grid">
              <SearchableDropdown label="Artikulli" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Kërko artikull me emër/kod..." required={true}
                creatable={true} createLabel="Shto artikull: {q}" onCreate={async (q) => {
                  try { localStorage.setItem('erp_new_product_name', q); } catch (e) {}
                  nav.go('products', 'products');
                  return false;
                }} />
              <div className="form-group"><label>Sasia *</label><input type="number" min="0" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} required /></div>
              <SearchableDropdown label="Njësia" icon="fas fa-scale-balanced" options={unitOpts} value={unitKey} onChange={setUnitKey} placeholder="Zgjidh njësinë..." required={true} />
            </div>
            {productId && <p className="stock-onhand-hint">Gjendje: <strong>{formatQtyWithUnits(onHand, selectedProduct)}</strong>{Number(qty) > 0 ? ` • Regjistrohet: ${formatQtyWithUnits(baseQty, selectedProduct)}${!isOut ? ` → ${formatQtyWithUnits(onHand + baseQty, selectedProduct)}` : ''}` : ''}</p>}
            <div className="form-grid">
              <SearchableDropdown label="Arsyeja" icon="fas fa-clipboard-list" options={isOut ? REASON_OUT_OPTS : REASON_IN_OPTS} value={reason} onChange={setReason} placeholder="Zgjidh arsyen..." required={true} />
              <div className="form-group"><label>Referencë</label><input type="text" value={reference} onChange={(e) => setReference(e.target.value)} placeholder="Faturë / dokument / shitje" /></div>
              {!isOut && <div className="form-group"><label>Kosto / njësi e zgjedhur</label><input type="number" min="0" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} /></div>}
              {!isOut && <div className="form-group"><label>Furnitori</label><input type="text" value={supplier} onChange={(e) => setSupplier(e.target.value)} /></div>}
              {!isOut && <div className="form-group"><label>Partia / Lot No</label><input type="text" value={batchNo} onChange={(e) => setBatchNo(e.target.value)} /></div>}
              {!isOut && <div className="form-group"><label><i className="fas fa-calendar-xmark"></i> Data skadencës</label><input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} /></div>}
              <div className="form-group"><label><i className="fas fa-location-dot"></i> Vendndodhja / Rafti</label><input type="text" value={location} onChange={(e) => setLocation(e.target.value)} /></div>
            </div>
            {!isOut && <div className="form-group"><label className="stock-cost-check"><input type="checkbox" checked={updateCost} onChange={(e) => setUpdateCost(e.target.checked)} /> Përditëso koston e artikullit me këtë kosto bazë</label></div>}
            <div className="form-group"><label>Shënime</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)}></textarea></div>
            <div className="form-actions">
              <button type="submit" className={`btn ${isOut ? 'btn-danger' : 'btn-success'}`} disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> {isOut ? 'Regjistro daljen' : 'Regjistro hyrjen'}</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

function BulkStockInModal({ products, onClose, onSave }) {
  const [lines, setLines] = useState([]);
  const [productId, setProductId] = useState('');
  const [qty, setQty] = useState('');
  const [unitKey, setUnitKey] = useState('base');
  const [unitCost, setUnitCost] = useState('');
  const [supplier, setSupplier] = useState('');
  const [reason, setReason] = useState('Dorëzim furnitori');
  const [reference, setReference] = useState('');
  const [saving, setSaving] = useState(false);

  const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
  const byId = useMemo(() => (products || []).reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const selectedProduct = productId ? byId[productId] : null;
  const unitOpts = useMemo(() => selectedProduct ? getProductUnitOptions(selectedProduct) : [{ value: 'base', label: 'copë (bazë)', name: 'copë', multiplier: 1 }], [selectedProduct]);
  const selectedUnit = selectedProduct ? getProductUnit(selectedProduct, unitKey) : unitOpts[0];
  const baseQtyPreview = selectedProduct ? toBaseQty(selectedProduct, qty, unitKey) : 0;
  const totalBaseQty = useMemo(() => lines.reduce((s, l) => s + Number(l.qty || 0), 0), [lines]);
  const totalValue = useMemo(() => lines.reduce((s, l) => s + Number(l.lineTotal || 0), 0), [lines]);

  useEffect(() => { setUnitKey('base'); setUnitCost(''); }, [productId]);

  const addLine = () => {
    const q = Number(qty);
    const c = Number(unitCost) || 0;
    if (!productId) return Swal.fire({ icon: 'warning', title: 'Zgjidh artikullin', text: 'Zgjidh artikullin para se të shtosh rreshtin.' });
    if (!Number.isFinite(q) || q <= 0) return Swal.fire({ icon: 'warning', title: 'Sasi e pasaktë', text: 'Sasia duhet të jetë më e madhe se 0.' });
    const product = byId[productId];
    const unit = getProductUnit(product, unitKey);
    const baseQty = toBaseQty(product, q, unit.value);
    const baseUnitCost = unit.multiplier > 0 ? round2(c / unit.multiplier) : c;
    const lineTotal = round2(q * c);
    setLines(prev => {
      const key = productId + '|' + unit.value;
      const existing = prev.find(l => l.key === key);
      if (existing) return prev.map(l => l.key === key ? {
        ...l,
        enteredQty: round2(Number(l.enteredQty || 0) + q),
        qty: round2(Number(l.qty || 0) + baseQty),
        enteredUnitCost: c || l.enteredUnitCost,
        unitCost: baseUnitCost || l.unitCost,
        lineTotal: round2(Number(l.lineTotal || 0) + lineTotal)
      } : l);
      return [...prev, { key, productId, name: product.name, sku: product.sku, enteredQty: q, qty: baseQty, unitKey: unit.value, unitName: unit.name, unitMultiplier: unit.multiplier, enteredUnitCost: c, unitCost: baseUnitCost, lineTotal }];
    });
    setProductId(''); setQty(''); setUnitKey('base'); setUnitCost('');
  };

  const removeLine = (key) => setLines(prev => prev.filter(l => l.key !== key));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!lines.length) return Swal.fire({ icon: 'warning', title: 'Nuk ka artikuj', text: 'Shto të paktën një rresht.' });
    if (!reason.trim()) return Swal.fire({ icon: 'warning', title: 'Arsye e detyrueshme', text: 'Vendos arsyen e hyrjes së stokut.' });
    setSaving(true);
    const batchLines = lines.map(l => ({ ...l, reason: reason.trim(), reference: reference.trim() || null, supplier: supplier.trim() || null }));
    await onSave(batchLines);
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-truck-ramp-box"></i> Hyrje stoku në masë</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <div className="pos-disc-row" style={{ gridTemplateColumns: '2fr .8fr .9fr .9fr auto', alignItems: 'end' }}>
            <SearchableDropdown label="Artikulli" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Kërko artikull me emër/kod..." />
            <div className="form-group"><label>Sasia</label><input type="number" min="0" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} /></div>
            <SearchableDropdown label="Njësia" icon="fas fa-scale-balanced" options={unitOpts} value={unitKey} onChange={setUnitKey} placeholder="Zgjidh njësinë..." />
            <div className="form-group"><label>Kosto / njësi</label><input type="number" min="0" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} /></div>
            <div className="form-group"><label>&nbsp;</label><button type="button" className="btn btn-secondary" onClick={addLine}><i className="fas fa-plus"></i> Shto</button></div>
          </div>
          {selectedProduct && Number(qty) > 0 && <p className="stock-onhand-hint">Konvertim: <strong>{Number(qty)} {selectedUnit.name}</strong> = <strong>{formatQtyWithUnits(baseQtyPreview, selectedProduct)}</strong></p>}
          {lines.length > 0 && (
            <div className="about-table-wrapper" style={{ marginTop: 12, marginBottom: 20 }}>
              <table className="about-roles-table">
                <thead><tr><th>Artikulli</th><th>Sasia</th><th>Njësia</th><th>Në stok</th><th>Kosto/njësi</th><th>Vlera</th><th></th></tr></thead>
                <tbody>
                  {lines.map(l => <tr key={l.key}><td>{l.name}<div className="cell-sub">{l.sku}</div></td><td>{l.enteredQty}</td><td>{l.unitName}</td><td>{formatQtyWithUnits(l.qty, byId[l.productId])}</td><td>{money(l.enteredUnitCost)}</td><td>{money(l.lineTotal)}</td><td><button type="button" className="action-icon delete-icon" onClick={() => removeLine(l.key)}><i className="fas fa-times"></i></button></td></tr>)}
                </tbody>
              </table>
            </div>
          )}
          <form onSubmit={handleSubmit}>
            <div className="form-grid">
              <div className="form-group"><label>Arsye *</label><input type="text" value={reason} onChange={(e) => setReason(e.target.value)} required /></div>
              <div className="form-group"><label>Referencë</label><input type="text" value={reference} onChange={(e) => setReference(e.target.value)} placeholder="Nr fature / dokumenti" /></div>
              <div className="form-group"><label>Furnitori</label><input type="text" value={supplier} onChange={(e) => setSupplier(e.target.value)} /></div>
            </div>
            {lines.length > 0 && <p className="stock-onhand-hint">Totali në njësi bazë: <strong>{totalBaseQty}</strong> • Vlera: <strong>{money(totalValue)}</strong></p>}
            <div className="form-actions">
              <button type="submit" className="btn btn-success" disabled={saving || lines.length === 0}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> Regjistro hyrjen</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// --- Stocktake / Adjustment - enter the counted qty, we post the correcting in/out movement ---
function StockAdjustModal({ products, movements, onClose, onSave }) {
  const [productId, setProductId] = useState('');
  const [counted, setCounted] = useState('');
  const [unitKey, setUnitKey] = useState('base');
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);
  const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
  const selected = (products || []).find(p => p.id === productId);
  const unitOpts = useMemo(() => selected ? getProductUnitOptions(selected) : [{ value: 'base', label: 'copë (bazë)', name: 'copë', multiplier: 1 }], [selected]);
  const selectedUnit = selected ? getProductUnit(selected, unitKey) : unitOpts[0];
  const onHand = useMemo(() => productId ? computeQtyOnHand(productId, movements) : 0, [productId, movements]);
  const countedBase = selected ? toBaseQty(selected, counted, unitKey) : Number(counted) || 0;
  const diff = counted === '' ? 0 : round2(countedBase - onHand);
  useEffect(() => { setUnitKey('base'); setCounted(''); }, [productId]);

  const submit = async (e) => {
    e.preventDefault();
    if (!productId) return Swal.fire({ icon: 'warning', title: 'Zgjidh artikullin' });
    if (counted === '' || Number(counted) < 0) return Swal.fire({ icon: 'warning', title: 'Vendos sasinë e numëruar' });
    if (diff === 0) return Swal.fire({ icon: 'info', title: 'Pa ndryshim', text: 'Sasia e numëruar përputhet me gjendjen në sistem.' });
    setSaving(true);
    await onSave({ productId, type: diff > 0 ? 'in' : 'out', qty: Math.abs(diff), enteredQty: Math.abs(Number(counted) || 0), unitKey, unitName: selectedUnit.name, unitMultiplier: selectedUnit.multiplier, reason: 'Adjustment', reference: 'Inventarizim', notes: notes.trim() || `Numëruar ${counted} ${selectedUnit.name} = ${formatQtyWithUnits(countedBase, selected)}, ishte ${formatQtyWithUnits(onHand, selected)}` }, selected?.name || 'Artikull i panjohur');
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-scale-balanced"></i> Inventarizim / Rregullim</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <form onSubmit={submit}>
            <SearchableDropdown label="Artikulli" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Kërko artikull..." required={true}
                creatable={true} createLabel="Shto artikull: {q}" onCreate={async (q) => {
                  try { localStorage.setItem('erp_new_product_name', q); } catch (e) {}
                  nav.go('products', 'products');
                  return false;
                }} />
            {productId && <p className="stock-onhand-hint">Gjendja në sistem: <strong>{formatQtyWithUnits(onHand, selected)}</strong></p>}
            <div className="form-grid">
              <div className="form-group"><label>Sasia e numëruar *</label><input type="number" min="0" step="0.01" value={counted} onChange={(e) => setCounted(e.target.value)} required /></div>
              <SearchableDropdown label="Njësia" icon="fas fa-scale-balanced" options={unitOpts} value={unitKey} onChange={setUnitKey} placeholder="Zgjidh njësinë..." required={true} />
              <div className="form-group"><label>Rregullimi në stok</label><input type="text" value={productId && counted !== '' ? (diff > 0 ? '+' + formatQtyWithUnits(diff, selected) + ' (Hyrje)' : diff < 0 ? '-' + formatQtyWithUnits(Math.abs(diff), selected) + ' (Dalje)' : 'Pa ndryshim') : '-'} disabled /></div>
            </div>
            {productId && counted !== '' && <p className="stock-onhand-hint">Numëruar: <strong>{counted} {selectedUnit.name}</strong> = <strong>{formatQtyWithUnits(countedBase, selected)}</strong></p>}
            <div className="form-group"><label>Shënime</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Arsyeja e diferencës"></textarea></div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke postuar...</> : <><i className="fas fa-save"></i> Posto rregullimin</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

function StockView({ user, role, setActiveMenu }) {
  const nav = useAppNav();
  /* open-create:stock */
  useEffect(() => {
    if (nav && nav.consumeCreate && nav.consumeCreate('stock')) {
      setModalType('in');
    }
  }, []);

  const [qSearch, setQSearch] = useState('');
  const [modalType, setModalType] = useState(null);
  const [showBulkIn, setShowBulkIn] = useState(false);
  const [showAdjust, setShowAdjust] = useState(false);
  const [printMove, setPrintMove] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  useEffect(() => {
    const fn = () => setReloadKey(k => k + 1);
    window.addEventListener('erp-data-changed', fn);
    return () => window.removeEventListener('erp-data-changed', fn);
  }, []);
  const [load, setLoad] = useState('');
  const tableInstanceRef = useRef(null);
  useDtLiveSearch(tableInstanceRef, qSearch);

  const { loading, data, err } = useFetch(() => Promise.all([fbGetStockMovements(), fbGetProducts()]), [reloadKey]);
  const movements = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const products = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);

  const productMap = useMemo(() => products.reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const byId = useMemo(() => movements.reduce((m, mv) => (m[mv.id] = mv, m), {}), [movements]);
  // running per-product balance: cumulate oldest→newest, tag each row with the balance right after it
  const tableData = useMemo(() => {
    const sorted = [...movements].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    const run = {};
    return sorted.map(m => {
      run[m.productId] = (run[m.productId] || 0) + (m.type === 'in' ? m.qty : -m.qty);
      return Object.assign({}, m, { productName: productMap[m.productId]?.name || 'Unknown Product', balance: run[m.productId] });
    });
  }, [movements, productMap]);

  useEffect(() => {
    if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load stock movements' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(tableData).draw(false);
    } else {
      table = $('#stockTable').DataTable({
        data: tableData,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        columns: [
          { data: 'productName', title: 'Artikulli', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'type', title: 'Tipi', render: (d, t) => t === 'display' ? `<span class="status-badge ${d === 'in' ? 'status-active' : 'status-inactive'}">${stockTypeText(d)}</span>` : d },
          { data: null, title: 'Sasia', render: (d, t, row) => t === 'display' ? esc(displayEnteredQty(row, productMap[row.productId])) : (row.enteredQty != null ? row.enteredQty : row.qty) },
          { data: 'unitName', title: 'Njësia', defaultContent: 'copë', render: (d, t, row) => t === 'display' ? esc(d || unitBaseName(productMap[row.productId])) : (d || 'copë') },
          { data: 'qty', title: 'Në njësi bazë', render: (d, t, row) => t === 'display' ? esc(formatQtyWithUnits(d, productMap[row.productId])) : d },
          { data: 'unitCost', title: 'Kosto bazë', defaultContent: '-', render: (d, t) => t === 'display' ? (d ? money(d) : '-') : (d || 0) },
          { data: 'reason', title: 'Arsyeja', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'reference', title: 'Referencë', defaultContent: '-', render: (d, t, row) => t === 'display' ? (d ? docLinkHtml('openref', row.id, d) : '-') : (d || '') },
          { data: 'balance', title: 'Balanca', render: (d, t, row) => t === 'display' ? `<strong>${esc(formatQtyWithUnits(d, productMap[row.productId]))}</strong>` : d },
          { data: 'performedBy', title: 'Përdoruesi', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'createdAt', title: 'Data/Ora', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },

        ],

        buttons: erpDtButtons('Hyrje_Dalje_Stoku'),
        order: [[10, 'desc']]
      });
      tableInstanceRef.current = table;
    }
    $('#stockTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      const rowData = getDtRowData(table, this);
      if (!rowData || !rowData.id) return;
      const act = $(this).data('action');
      if (act === 'printdoc') { const mv = byId[rowData.id] || rowData; openMovementDocument(mv, productMap[mv.productId], true); return; }
      if (act === 'openref') {
        const mv = byId[rowData.id] || rowData;
        const ref = String(mv.reference || '');
        if (!ref) return;
        const reason = String(mv.reason || '');
        if (reason === 'Sale') {
          fbGetSales().then(res => {
            const sale = (res && res.success ? res.data : []).find(x => x.id === ref || x.invoiceNo === ref);

          openWarehouseReceiptInDocument(ref, false);
        } else {
          Swal.fire({ icon: 'info', title: 'Referenca', text: ref });
        }
        return;
      }
      if (act === 'delete') handleDelete(byId[rowData.id] || rowData);
    });

  useEffect(() => () => {
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  const handleSave = async (moveData, productName) => {
    const { updateCost, ...move } = moveData; // updateCost is a UI flag, not stored on the ledger row
    setLoad(move.type === 'in' ? 'Recording Stock In...' : 'Recording Stock Out...');
    const result = await fbAddStockMovement(move, productName, user);
    if (result.success && updateCost && move.unitCost) await fbUpdateProduct(move.productId, { cost: Number(move.unitCost) }, user);
    setLoad('');
    if (result.success) {
      setModalType(null); setShowAdjust(false);
      Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
      reload();
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: result.message });
    }
  };

  const handleDelete = (mv) => {
    const productName = productMap[mv.productId]?.name || mv.productId;
    Swal.fire({ icon: 'warning', title: 'Delete Stock Entry?', text: 'This retroactively changes historical Qty On Hand. This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {

      setLoad('Deleting stock entry...');

  return (

      {load && <TopLoadingBar />}

          <button className="btn btn-success" disabled={loading} onClick={() => setModalType('in')}><i className="fas fa-arrow-down"></i> Stock In</button>
          <button className="btn btn-danger" disabled={loading} onClick={() => setModalType('out')}><i className="fas fa-arrow-up"></i> Stock Out</button>
          <button className="btn btn-secondary" disabled={loading} onClick={() => setShowBulkIn(true)}><i className="fas fa-truck-ramp-box"></i> Bulk Receive</button>
          <button className="btn btn-secondary" disabled={loading} onClick={() => setShowAdjust(true)}><i className="fas fa-scale-balanced"></i> Stocktake</button>
        </div>
      </div>
      {loading && <TableSkeleton rows={8} columns={10} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <div className="module-toolbar">
          <GoogleSearchBox value={qSearch} onChange={setQSearch} placeholder="Kërko lëvizje stoku… artikull, arsye, referencë, përdorues…" />
        </div>
        <table id="stockTable" className="display" style={{ width: '100%' }}></table>
        <FilteredSummaryBar tableRef={tableInstanceRef} deps={[tableData, qSearch]} itemsBuilder={(rows) => [
          { label: 'Lëvizje (filtruar)', value: rows.length },
          { label: 'Hyrje', value: rows.filter(r => r.type === 'in').length },
          { label: 'Dalje', value: rows.filter(r => r.type === 'out').length }
        ]} />
      </div>
      {modalType && <StockMovementModal type={modalType} products={products} movements={movements} onClose={() => setModalType(null)} onSave={handleSave} />}
      {showBulkIn && <BulkStockInModal products={products} onClose={() => setShowBulkIn(false)} onSave={handleBulkSave} />}
      {showAdjust && <StockAdjustModal products={products} movements={movements} onClose={() => setShowAdjust(false)} onSave={handleSave} />}
      {printMove && (
        <div className="modal-overlay" onClick={() => setPrintMove(null)}>

}

              {whOpts.map(w => <option key={w} value={w}>{w}</option>)}

          </div>
          <div className="pos-cart-cell" data-label="Sasia">
            <div className="pos-qty-ctrl">
              <button type="button" onClick={() => onDec(it.productId)}><i className="fas fa-minus"></i></button>
              <input className="pos-paid-input" type="text" inputMode="decimal" value={paidDisplay} onFocus={(e) => e.target.select()} onChange={(e) => onQtyChange && onQtyChange(it.productId, e.target.value.replace(',', '.'))} />

// --- Camera scan modal (secondary path, feeds the same resolve function as manual input) ---
function CameraScanModal({ onDetected, onClose }) {
  // html5-qrcode's stop() throws SYNCHRONOUSLY (not a rejected promise) once the scanner
  // is already stopped - a .catch() after it doesn't help. runningRef gates every stop()
  // call so the decode callback and the unmount cleanup can never both call it.
  const scannerRef = useRef(null);
  const runningRef = useRef(false);

  useEffect(() => {
    let cancelled = false;
    const qr = new Html5Qrcode('pos-qr-reader');
    scannerRef.current = qr;

    const safeStop = () => {
      if (!runningRef.current) return;
      runningRef.current = false;
      try { qr.stop().then(() => qr.clear()).catch(() => {}); } catch (e) { /* already stopped */ }
    };

    qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (decodedText) => {
      if (cancelled) return;
      cancelled = true;
      safeStop();
      onDetected(decodedText);
    }, () => {}).then(() => {
      runningRef.current = true;
      if (cancelled) safeStop(); // modal was closed while the camera was still starting up
    }).catch((err) => {
      Swal.fire({ icon: 'error', title: 'Camera Error', text: 'Could not start camera: ' + (err && err.message ? err.message : err) });
      onClose();
    });
    return () => {
      cancelled = true;
      safeStop();
    };
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: '480px' }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-camera"></i> Scan with Camera</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <div className="pos-camera-frame"><div id="pos-qr-reader"></div></div>
          <p style={{ textAlign: 'center', color: '#888', fontSize: 13, marginTop: 12 }}>Point the camera at the product's QR code or barcode</p>
        </div>
      </div>
    </div>
  );
}

// --- Fiscal invoice print models: thermal, A4, and warehouse FD ---

function fmtLek(n) {
  return Number(n || 0).toLocaleString('sq-AL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtQty(n) {
  const x = Number(n || 0);
  return Number.isInteger(x) ? String(x) : x.toLocaleString('sq-AL', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
}
function saleBuyerName(sale) {
  return (sale && (sale.customerName || sale.buyerName)) || 'Klient pa emër';
}
function saleBuyerAddress(sale) {
  return (sale && (sale.customerAddress || sale.buyerAddress || sale.address)) || '';
}
function saleBuyerNipt(sale) {
  return (sale && (sale.customerNipt || sale.buyerNipt || sale.nipt)) || '';
}
function salePaymentLabel(sale) {
  const m = (sale && sale.paymentMethod) || 'Para';
  if (/cash|para|kartëmonedha/i.test(m)) return 'Para';
  if (/credit|kredi/i.test(m)) return 'Kredi';
  return m;
}
function saleInvoiceTypeLabel(sale) {
  const m = salePaymentLabel(sale);
  if (m === 'Kredi') return 'Faturë pa para';
  return 'Faturë me para';
}
function saleNslf(sale) {
  return (sale && (sale.nslf || sale.NSLF)) || fiscalCode('NSLF', (sale && (sale.id || sale.invoiceNo)) || '');
}
function saleNivf(sale) {
  return (sale && (sale.nivf || sale.NIVF)) || fiscalCode('NIVF', (sale && (sale.invoiceNo || sale.id)) || '');
}
function saleOperatorCode(sale) {
  return (sale && (sale.operatorCode || sale.cashierCode)) || 'tg763eq754';
}
function saleBusinessUnitCode(sale) {
  return (sale && (sale.businessUnitCode || sale.tcrCode)) || 'at011nm634';
}
function salePosName(sale) {
  return (sale && (sale.posName || sale.cashier)) || ('Cash ' + (businessName() || 'POS'));
}
function saleTaxBreakdown(sale) {
  const map = {};
  (sale.items || []).forEach(function(it) {
    const rate = Number(it.taxRate != null ? it.taxRate : (CFG.taxRate || 0)) || 0;
    const key = String(rate);
    if (!map[key]) map[key] = { rate: rate, net: 0, tax: 0 };
    map[key].net += Number(it.lineNet || 0);
    map[key].tax += Number(it.lineTax || 0);
  });
  const rows = Object.keys(map).map(function(k) {
    return { rate: map[k].rate, net: round2(map[k].net), tax: round2(map[k].tax) };
  });
  if (!rows.length) {
    rows.push({ rate: Number(CFG.taxRate || 20), net: round2(sale.subtotal || 0), tax: round2(sale.tax || 0) });
  }
  return rows;
}

function ThermalSlip({ sale }) {
  if (!sale) return null;
  const items = sale.items || [];
  const taxRows = saleTaxBreakdown(sale);
  const mainTax = taxRows[0] || { rate: 20, net: sale.subtotal || 0, tax: sale.tax || 0 };
  return (
    <div className="thermal-slip-print">
      <div className="ts-copy">KOPJE FATURE</div>
      <div className="ts-fiscal">Faturë Tatimore</div>
      <div className="ts-business">{businessName()}</div>
      {businessAddress() ? <div className="ts-address">{businessAddress()}</div> : null}
      <div className="ts-customer">{saleBuyerName(sale)}</div>
      {saleBuyerAddress(sale) ? <div className="ts-address">{saleBuyerAddress(sale)}</div> : null}
      <div className="ts-rule"></div>
      <div className="ts-field"><b>NIPT:</b><span>{businessNipt() || '—'}</span></div>
      <div className="ts-field"><b>Data/Ora:</b><span>{formatDateForDisplay(sale.createdAt || nowIso())}</span></div>
      <div className="ts-field"><b>Fatura Nr:</b><span>{saleDocNo(sale)}</span></div>
      <div className="ts-field"><b>Kodi i Operatorit:</b><span>{saleOperatorCode(sale)}</span></div>
      <div className="ts-field"><b>Njësia e biznesit:</b><span>{saleBusinessUnitCode(sale)}</span></div>
      <div className="ts-field"><b>POS:</b><span>{salePosName(sale)}</span></div>
      <div className="ts-field"><b>Mënyrat e pagesës:</b><span>{salePaymentLabel(sale)}</span></div>
      <div className="ts-rule"></div>
      {items.map((it, i) => {
        const qty = Number(it.displayQty != null ? it.displayQty : it.qty) || 0;
        const free = Number(it.freeDisplayQty || 0) || 0;
        const price = Number(it.unitSalePrice != null ? it.unitSalePrice : it.price) || 0;
        const line = Number(it.lineTotal != null ? it.lineTotal : (it.lineNet || 0) + (it.lineTax || 0)) || 0;
        return (
          <div key={i}>
            <div className="ts-line-name">{it.name}</div>
            <div className="ts-line-calc">
              <span>{fmtQty(qty)}{free > 0 ? ' + ' + fmtQty(free) + ' falas' : ''} {it.unitName || 'copë'} X {fmtLek(price)}</span>
              <span>{fmtLek(line)}</span>
            </div>
          </div>
        );
      })}
      <div className="ts-rule"></div>
      <div className="ts-total-fiscal"><span>TOTAL LEK</span><span>{fmtLek(sale.total || 0)}</span></div>
      <div className="ts-field"><b>{salePaymentLabel(sale)}</b><span>{fmtLek(sale.total || 0)}</span></div>
      <div className="ts-rule"></div>
      <div className="ts-tax-row"><b>Pa TVSH {fmtLek(mainTax.rate)}%</b><span>{fmtLek(sale.subtotal || mainTax.net || 0)}</span></div>
      <div className="ts-tax-row"><b>TVSH {fmtLek(mainTax.rate)}%</b><span>{fmtLek(sale.tax || mainTax.tax || 0)}</span></div>
      <div className="ts-rule"></div>
      <div className="ts-nslf">
        <div>NSLF: {saleNslf(sale)}</div>
        <div>NIVF: {saleNivf(sale)}</div>
      </div>
      <div className="ts-footer-note">{CFG.receiptFooter || 'Faleminderit!'}</div>
    </div>
  );
}

          <div className="form-actions" style={{ marginTop:12 }}><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Mbyll</button></div>
        </div>
      </div>
    </div>
  );
}

            <button type="button" className={'btn ' + (docMode==='a4'?'btn-primary':'btn-secondary')} onClick={() => setDocMode('a4')}><i className="fas fa-file-invoice"></i> A4</button>
            <button type="button" className={'btn ' + (docMode==='warehouse'?'btn-primary':'btn-secondary')} onClick={() => setDocMode('warehouse')}><i className="fas fa-warehouse"></i> Fletë Dalje</button>
            <button type="button" className="btn btn-preview" onClick={() => openSaleDocument(sale, docMode, false)}><i className="fas fa-eye"></i> Preview</button>
            <button type="button" className="btn btn-primary" onClick={() => openSaleDocument(sale, docMode, true)}><i className="fas fa-print"></i> Printo</button>
            <button type="button" className="btn btn-pdf" onClick={() => exportSalePdf(sale)}><i className="fas fa-file-pdf"></i> PDF</button>
            <button type="button" className="btn btn-excel" onClick={() => exportSaleXlsx(sale)}><i className="fas fa-file-excel"></i> Excel</button>
          </div>
          <div style={{ background:'#f5f5f5', padding:12, borderRadius:6, overflow:'auto', maxHeight:'60vh' }}>
            {docMode === 'thermal' && <div style={{ background:'#fff', margin:'0 auto' }}><ThermalSlip sale={sale} /></div>}
            {docMode === 'a4' && <div style={{ background:'#fff', margin:'0 auto', transform:'scale(0.72)', transformOrigin:'top center' }}><A4InvoicePrint sale={sale} /></div>}
            {docMode === 'warehouse' && <div style={{ background:'#fff', margin:'0 auto' }}><FleteDaljeSalePrint sale={sale} /></div>}
          </div>
          <div className="form-actions" style={{ marginTop:12 }}>
            <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Mbyll</button>
          </div>

  );
}

// --- POS / QR Sales View ---
function POSView({ user, role, setActiveMenu }) {
  const nav = useAppNav();
  const payOpts = usePaymentOpts();
  const { refreshConfig } = useConfig();
  const [cart, setCart] = useState([]);
  const [scanValue, setScanValue] = useState('');
  const [showCamera, setShowCamera] = useState(false);
  const [completedSale, setCompletedSale] = useState(null);
  const [load, setLoad] = useState('');
  const [reloadKey, setReloadKey] = useState(0);
  const [customerId, setCustomerId] = useState('');
  const [discountType, setDiscountType] = useState('flat');
  const [discountValue, setDiscountValue] = useState('');
  const [paymentMethod, setPaymentMethod] = useState('Cash');
  const [selectedWarehouse, setSelectedWarehouse] = useState('Magazina Kryesore');
  const [tendered, setTendered] = useState('');
  const [held, setHeld] = useState(() => { try { return JSON.parse(localStorage.getItem('pos_held') || '[]'); } catch (e) { return []; } });
  const scanRef = useRef(null);

  const { loading: loadingProducts, data: productsData } = useFetch(() => fbGetProducts(), []);
  const products = useMemo(() => (productsData && productsData.success ? productsData.data : []), [productsData]);
  const prodById = useMemo(() => products.reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const codeIndex = useMemo(() => buildCodeIndex(products), [products]);
  const { data: custData } = useFetch(() => fbGetCustomers(), []);
  const customers = useMemo(() => (custData && custData.success ? custData.data : []), [custData]);
  const customerOpts = useMemo(() => customers.map(c => ({ value: c.id, label: c.name + (c.phone ? ' · ' + c.phone : '') })), [customers]);
  const { loading: loadingMovements, data: movementsData } = useFetch(() => fbGetStockMovements(), [reloadKey]);
  const movements = useMemo(() => (movementsData && movementsData.success ? movementsData.data : []), [movementsData]);
  // gate scanning until both loads land - scanning against a still-empty movements array
  // would make computeQtyOnHand read 0 and falsely reject the very first scan as out-of-stock
  const catalogReady = !loadingProducts && !loadingMovements;
  const productSuggestions = useMemo(() => {
    const q = String(scanValue || '').trim().toLowerCase();
    if (!q || !catalogReady) return [];
    return products.filter(p => [p.name, p.sku, p.barcode].some(v => String(v || '').toLowerCase().includes(q))).slice(0, 12);
  }, [scanValue, products, catalogReady]);

  // Mos e kthe fokusin te kërkimi sa herë ndryshon shporta.
  // Më parë çdo ndryshim i sasisë rifokusonte input-in “Artikulli”, prandaj në telefon
  // dukej sikur nuk shkruaje dot te kolona Sasia/Falas/Çmimi/Vlera.
  useEffect(() => {
    if (!catalogReady || completedSale || showCamera || !scanRef.current) return;
    const active = document.activeElement;
    const userIsEditing = active && active.closest && active.closest('.pos-cart-list, .pos-summary, .modal');
    if (userIsEditing) return;
    scanRef.current.focus();
  }, [catalogReady, completedSale, showCamera]);

  const capacityCheck = useCallback((productId, name, nextQty) => {
    const onHand = computeQtyOnHand(productId, movements);
    if (nextQty > onHand) {
      Swal.fire({ icon: 'warning', title: 'Not enough stock', text: `Only ${onHand} unit(s) of ${name} in stock.` });
      return false;
    }
    return true;
  }, [movements]);

  const addToCart = useCallback((product, qtyToAdd = 1, unitKey = 'base') => {
    setCart(prev => {
      const unit = getProductUnit(product, unitKey);
      const addDisplay = Number(qtyToAdd) || 1;
      const existing = prev.find(l => l.productId === product.id);
      if (existing) {
        const mult = Number(existing.unitMultiplier || unit.multiplier || 1);
        const paidDisplay = round2(Number(existing.displayQty || 0) + addDisplay);
        const freeDisplay = Number(existing.freeDisplayQty || 0);
        const paidQty = round2(paidDisplay * mult);
        const freeQty = round2(freeDisplay * mult);
        const totalQty = round2(paidQty + freeQty);
        if (!capacityCheck(product.id, product.name, totalQty)) return prev;
        return prev.map(l => { if (l.productId !== product.id) return l; const taxable = l.taxEnabled !== false; const keepPrice = !!l.priceEdited; const nextUnitPrice = keepPrice ? Number(l.unitSalePrice || 0) : autoUnitNetPrice(product, l.unitKey || unit.value, taxable); return { ...l, price: round2(nextUnitPrice / mult), unitSalePrice: round2(nextUnitPrice), displayQty: paidDisplay, paidQty, freeDisplayQty: freeDisplay, freeQty, qty: totalQty, taxEnabled: taxable, warehouse: l.warehouse || product.location || product.warehouse || 'Magazina Kryesore' }; });
      }
      const paidQty = round2(addDisplay * unit.multiplier);
      if (!capacityCheck(product.id, product.name, paidQty)) return prev;
      const taxable = true; const netUnitPrice = autoUnitNetPrice(product, unit.value, taxable); return [...prev, { productId: product.id, name: product.name, sku: product.sku, price: round2(netUnitPrice / unit.multiplier), unitSalePrice: netUnitPrice, qty: paidQty, paidQty, freeQty: 0, displayQty: addDisplay, freeDisplayQty: 0, unitKey: unit.value, unitName: unit.name, unitMultiplier: unit.multiplier, taxEnabled: taxable, warehouse: product.location || product.warehouse || 'Magazina Kryesore' }];
    });
  }, [capacityCheck]);

  const pickProductFromSearch = useCallback((product) => {
    if (!product) return;
    addToCart(product, 1, 'base');
    setScanValue('');
    setTimeout(() => scanRef.current && scanRef.current.focus(), 0);
  }, [addToCart]);

  const resolveAndAddToCart = useCallback(async (rawCode) => {
    const code = String(rawCode || '').trim();
    if (!code) return;
    if (!catalogReady) { Swal.fire({ icon: 'warning', title: 'Still Loading', text: 'Catalog is still loading, try again in a moment.' }); return; }
    const local = codeIndex.get(code.toLowerCase()); // instant - no network round-trip per scan
    if (local) { addToCart(local, 1); return; }
    const q = code.toLowerCase();
    const fuzzy = products.find(p => [p.name, p.sku, p.barcode].some(v => String(v || '').toLowerCase().includes(q)));
    if (fuzzy) { addToCart(fuzzy, 1); return; }
    const res = await fbFindProductByCode(code); // miss: product may be newer than our cached catalog
    if (!res.success) { Swal.fire({ icon: 'error', title: 'Nuk u gjet', text: res.message || `Nuk ka artikull për "${code}"` }); return; }
    addToCart(res.data, 1);
  }, [addToCart, catalogReady, codeIndex, products]);

  const handleScanSubmit = (e) => {
    e.preventDefault();
    const code = scanValue;
    setScanValue('');
    resolveAndAddToCart(code);
  };

  const handleDetected = (decodedText) => { setShowCamera(false); resolveAndAddToCart(decodedText); };

  const applyLineQuantities = (productId, paidDisplayValue, freeDisplayValue, nextUnitKey) => {
    setCart(prev => {
      const line = prev.find(l => l.productId === productId);
      if (!line) return prev;
      const product = prodById[productId];
      const unit = getProductUnit(product, nextUnitKey || line.unitKey || 'base');
      const paidDisplay = Math.max(0, Number(paidDisplayValue) || 0);
      const freeDisplay = Math.max(0, Number(freeDisplayValue) || 0);
      const paidQty = round2(paidDisplay * unit.multiplier);
      const freeQty = round2(freeDisplay * unit.multiplier);
      const totalQty = round2(paidQty + freeQty);
      if (totalQty <= 0) return prev.filter(l => l.productId !== productId);
      if (!capacityCheck(productId, line.name, totalQty)) return prev;
      return prev.map(l => { if (l.productId !== productId) return l; const sameUnit = (l.unitKey || 'base') === unit.value; const taxable = l.taxEnabled !== false; const keepPrice = sameUnit && !!l.priceEdited; const netUnitPrice = keepPrice ? Number(l.unitSalePrice || 0) : autoUnitNetPrice(product, unit.value, taxable); return { ...l, price: round2(netUnitPrice / unit.multiplier), unitSalePrice: round2(netUnitPrice), unitKey: unit.value, unitName: unit.name, unitMultiplier: unit.multiplier, displayQty: paidDisplay, freeDisplayQty: freeDisplay, paidQty, freeQty, qty: totalQty, taxEnabled: taxable, priceEdited: keepPrice, warehouse: l.warehouse || product.location || product.warehouse || 'Magazina Kryesore' }; });
    });
  };

  const changeQty = (productId, delta) => {
    const line = cart.find(l => l.productId === productId);
    if (!line) return;
    applyLineQuantities(productId, round2(Number(line.displayQty || 0) + delta), Number(line.freeDisplayQty || 0), line.unitKey || 'base');
  };

  const changeDisplayQty = (productId, value) => {
    const line = cart.find(l => l.productId === productId);
    if (!line) return;
    applyLineQuantities(productId, value, Number(line.freeDisplayQty || 0), line.unitKey || 'base');
  };

  const changeFreeQty = (productId, value) => {
    const line = cart.find(l => l.productId === productId);
    if (!line) return;
    applyLineQuantities(productId, Number(line.displayQty || 0), value, line.unitKey || 'base');
  };

  const changeLineUnit = (productId, unitKey) => {
    const line = cart.find(l => l.productId === productId);
    if (!line) return;
    applyLineQuantities(productId, Number(line.displayQty || 0), Number(line.freeDisplayQty || 0), unitKey);
  };

  const changeLineWarehouse = (productId, warehouse) => {
    setCart(prev => prev.map(line => line.productId === productId ? { ...line, warehouse: warehouse || 'Magazina Kryesore' } : line));
  };

  const changeLinePrice = (productId, value) => {
    const unitPriceValue = Math.max(0, Number(value) || 0);
    setCart(prev => prev.map(line => {
      if (line.productId !== productId) return line;
      const product = prodById[productId] || {};
      const unit = getProductUnit(product, line.unitKey || 'base');
      return { ...line, unitSalePrice: round2(unitPriceValue), price: round2(unitPriceValue / unit.multiplier), priceEdited: true };
    }));
  };

  const changeLineNetValue = (productId, value) => {
    const lineValue = Math.max(0, Number(value) || 0);
    setCart(prev => prev.map(line => {
      if (line.productId !== productId) return line;
      const product = prodById[productId] || {};
      const unit = getProductUnit(product, line.unitKey || 'base');
      const paidDisplay = Math.max(0, Number(line.displayQty || 0));
      const unitSale = paidDisplay > 0 ? round2(lineValue / paidDisplay) : 0;
      return { ...line, unitSalePrice: unitSale, price: round2(unitSale / unit.multiplier), priceEdited: true };
    }));
  };

  const changeLineGrossValue = (productId, value) => {
    const grossValue = Math.max(0, Number(value) || 0);
    setCart(prev => prev.map(line => {
      if (line.productId !== productId) return line;
      const product = prodById[productId] || {};
      const unit = getProductUnit(product, line.unitKey || 'base');
      const paidDisplay = Math.max(0, Number(line.displayQty || 0));
      const taxable = line.taxEnabled !== false;
      const rate = taxable ? productTaxRate(product) : 0;
      const netValue = taxable && rate > 0 ? round2(grossValue / (1 + rate / 100)) : grossValue;
      const unitSale = paidDisplay > 0 ? round2(netValue / paidDisplay) : 0;
      return { ...line, unitSalePrice: unitSale, price: round2(unitSale / unit.multiplier), priceEdited: true };
    }));
  };

  const changeLineTax = (productId, enabled) => {
    setCart(prev => prev.map(line => {
      if (line.productId !== productId) return line;
      const product = prodById[productId] || {};
      const unit = getProductUnit(product, line.unitKey || 'base');
      const netUnitPrice = autoUnitNetPrice(product, unit.value, enabled);
      return { ...line, taxEnabled: !!enabled, unitSalePrice: netUnitPrice, price: round2(netUnitPrice / unit.multiplier), priceEdited: false };
    }));
  };

  const removeLine = (productId) => setCart(prev => prev.filter(l => l.productId !== productId));

  const totals = useMemo(() => computeSaleTotals(cart, prodById, { type: discountType, value: discountValue }), [cart, prodById, discountType, discountValue]);
  const itemCount = useMemo(() => cart.reduce((s, l) => s + (Number(l.qty) || 0), 0), [cart]);
  const changeDue = paymentMethod === 'Cash' ? Math.max(0, (Number(tendered) || 0) - totals.grand) : 0;

  const persistHeld = (list) => { setHeld(list); localStorage.setItem('pos_held', JSON.stringify(list)); };
  const resetSale = () => { setCart([]); setCustomerId(''); setDiscountValue(''); setDiscountType('flat'); setPaymentMethod('Cash'); setTendered(''); };

  // park the current cart (customer + discount too) to localStorage, then clear the till
  const holdSale = () => {
    if (!cart.length) return;
    const cust = customers.find(c => c.id === customerId);
    const label = (cust ? cust.name : 'Walk-in') + ' · ' + cart.reduce((n, l) => n + l.qty, 0) + ' item(s) · ' + money(totals.grand);
    persistHeld([...held, { id: Date.now(), label, cart, customerId, discountType, discountValue, ts: nowIso() }]);
    resetSale();
    Swal.fire({ icon: 'success', title: 'Held', text: 'Sale parked — recall it anytime.', timer: 1400, showConfirmButton: false });
  };

  const recallHeld = async () => {
    if (!held.length) { Swal.fire({ icon: 'info', title: 'No held sales' }); return; }
    const opts = {}; held.forEach((h, i) => opts[i] = h.label);
    const { value } = await Swal.fire({ title: 'Recall a held sale', input: 'select', inputOptions: opts, inputPlaceholder: 'Pick one', showCancelButton: true, confirmButtonText: 'Recall' });
    if (value == null) return;
    const h = held[Number(value)]; if (!h) return;
    setCart(h.cart || []); setCustomerId(h.customerId || ''); setDiscountType(h.discountType || 'flat'); setDiscountValue(h.discountValue || '');
    persistHeld(held.filter((_, i) => i !== Number(value)));
  };

  const handleCheckout = async () => {
    if (cart.length === 0) return;
    if (paymentMethod === 'Cash' && (Number(tendered) || 0) < totals.grand) {
      const go = await Swal.fire({ icon: 'warning', title: 'Short payment', text: `Tendered is less than ${money(totals.grand)}. Continue anyway?`, showCancelButton: true, confirmButtonText: 'Yes, continue' });
      if (!go.isConfirmed) return;
    }
    if (paymentMethod === 'Credit' && !customerId) { Swal.fire({ icon: 'warning', title: 'Pick a customer', text: 'Credit sales must be tied to a customer.' }); return; }
    setLoad('Processing sale...');
    const cust = customers.find(c => c.id === customerId);
    const sale = {
      items: totals.lines, subtotal: totals.subtotal, discount: totals.discount, discountType, tax: totals.tax, total: totals.grand,
      paymentMethod, amountTendered: paymentMethod === 'Cash' ? (Number(tendered) || 0) : (paymentMethod === 'Credit' ? 0 : totals.grand), changeDue: round2(changeDue),
      customerId: customerId || '', customerName: cust ? cust.name : 'Walk-in', status: paymentMethod === 'Credit' ? 'credit' : 'completed'
    };
    const res = await fbCreateSale(sale, user);
    setLoad('');
    if (res.success) {
      setCompletedSale(res.data);
      resetSale();
      setReloadKey(k => k + 1);
      Swal.fire({ icon: 'success', title: 'Sale Complete', text: `${res.data.invoiceNo || ''} — ${money(res.data.total)}`, timer: 1800, showConfirmButton: false });
    } else {
      Swal.fire({ icon: 'error', title: 'Checkout Failed', text: res.message });
    }
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-cash-register"></i> POS / Shitje</h2>
        <div className="pos-scan-actions">
          <button className="btn btn-secondary" disabled={!catalogReady} onClick={() => setShowCamera(true)}><i className="fas fa-camera"></i> Camera</button>
          <button className="btn btn-secondary" onClick={recallHeld}><i className="fas fa-clock-rotate-left"></i> Held{held.length ? ` (${held.length})` : ''}</button>
        </div>
      </div>

      <form className="pos-scan-box" onSubmit={handleScanSubmit}>
        <div className="form-group pos-product-search-wrap">
          <label><i className="fas fa-search"></i> Artikulli</label>
          <input ref={scanRef} type="text" className="pos-scan-input" autoFocus disabled={!catalogReady} value={scanValue}
            onChange={(e) => setScanValue(e.target.value)} autoComplete="off" placeholder={catalogReady ? 'Shkruaj emrin, kodin ose barkodin...' : 'Duke ngarkuar artikujt...'} />
          {productSuggestions.length > 0 && <div className="pos-product-suggestions">
            {productSuggestions.map(p => <button type="button" key={p.id} className="pos-product-suggestion" onMouseDown={(e) => { e.preventDefault(); pickProductFromSearch(p); }}>
              <span><span className="pos-sg-name">{p.name}</span><span className="pos-sg-meta">{p.sku || '-'} {p.barcode ? ' · ' + p.barcode : ''} · {formatUnitStructure(p)}</span></span>
              <span className="pos-sg-stock">{formatQtyWithUnits(computeQtyOnHand(p.id, movements), p)}</span>
            </button>)}
          </div>}
        </div>
        <button type="submit" className="btn btn-primary" disabled={!catalogReady}><i className="fas fa-plus"></i> Shto</button>
      </form>

      <div className="pos-grid">
        <div>
          {loadingProducts ? <TableSkeleton rows={4} columns={4} /> : <Cart items={cart} products={products} onInc={(id) => changeQty(id, 1)} onDec={(id) => changeQty(id, -1)} onQtyChange={changeDisplayQty} onFreeChange={changeFreeQty} onPriceChange={changeLinePrice} onNetValueChange={changeLineNetValue} onGrossValueChange={changeLineGrossValue} onTaxChange={changeLineTax} onRemove={removeLine} onUnitChange={changeLineUnit} onWarehouseChange={changeLineWarehouse} />}
        </div>
        <div className="pos-summary">
          <SearchableDropdown label="Customer" icon="fas fa-user" options={customerOpts} value={customerId} onChange={setCustomerId} placeholder="Walk-in customer"
              creatable={true} createLabel="Shto klient: {q}" onCreate={async (q) => { try { localStorage.setItem('erp_new_customer_name', q); } catch(e) {} nav.go('records', 'records'); return false; }} />
          <div className="pos-disc-row">
            <SearchableDropdown label="Discount" icon="fas fa-tags" options={DISCOUNT_TYPE_OPTS} value={discountType} onChange={setDiscountType} placeholder="Amount" />
            <div className="form-group"><label>Value</label><input type="number" min="0" step="0.01" placeholder="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} /></div>
          </div>
          <SearchableDropdown label="Payment" icon="fas fa-money-bill-wave" options={payOpts} value={paymentMethod} onChange={setPaymentMethod} placeholder="Cash"
              creatable={true} createLabel="Shto mënyrë pagese: {q}" onCreate={async (q) => {
                const res = await ieQuickAddSettingList('paymentMethods', q, user);
                if (!res.success) throw new Error(res.message || 'Dështoi');
                try { refreshConfig && refreshConfig(); } catch (e) {}
                return { value: res.value, label: res.value };
              }} />
          {paymentMethod === 'Cash' && <div className="form-group"><label>Amount Tendered</label><input type="number" min="0" step="0.01" value={tendered} onChange={(e) => setTendered(e.target.value)} /></div>}
          <div className="pos-summary-row"><span>Items</span><span>{itemCount}</span></div>
          <div className="pos-summary-row"><span>Vlera pa TVSH</span><span>{money(totals.subtotal)}</span></div>
          {totals.discount > 0 && <div className="pos-summary-row"><span>Discount</span><span>- {money(totals.discount)}</span></div>}
          {totals.tax > 0 && <div className="pos-summary-row"><span>TVSH</span><span>{money(totals.tax)}</span></div>}
          <div className="pos-summary-row grand"><span>Vlera me TVSH</span><span>{money(totals.grand)}</span></div>
          {paymentMethod === 'Cash' && (Number(tendered) || 0) > 0 && <div className="pos-summary-row"><span>Change</span><span>{money(changeDue)}</span></div>}
          <div className="pos-checkout-actions">
            <button className="btn btn-secondary" disabled={cart.length === 0} onClick={holdSale}><i className="fas fa-pause"></i> Hold</button>
            <button className="btn btn-success" disabled={cart.length === 0} onClick={handleCheckout}><i className="fas fa-check"></i> Checkout</button>
          </div>
        </div>
      </div>

      {showCamera && <CameraScanModal onDetected={handleDetected} onClose={() => setShowCamera(false)} />}
      {completedSale && <ThermalReceiptOverlay sale={completedSale} onClose={() => setCompletedSale(null)} />}
    </div>
  );
}

// --- Process Return (against a past sale) ---
function ReturnModal({ sale, returns, user, onClose, onDone }) {
  const already = useMemo(() => (sale.items || []).map(it => computeReturnedQty(sale.id, it.productId, returns)), [sale, returns]);
  const [qtys, setQtys] = useState(() => (sale.items || []).map(() => 0));
  const [saving, setSaving] = useState(false);

  const remaining = (idx) => sale.items[idx].qty - already[idx];
  const setQty = (idx, val) => {
    const max = remaining(idx);
    const v = Math.max(0, Math.min(max, Number(val) || 0));
    setQtys(prev => prev.map((q, i) => i === idx ? v : q));
  };

  const totalRefund = useMemo(() => qtys.reduce((s, q, i) => s + q * sale.items[i].price, 0), [qtys, sale.items]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    const items = sale.items
      .map((it, i) => ({ productId: it.productId, name: it.name, sku: it.sku, qty: qtys[i], price: it.price, lineTotal: qtys[i] * it.price }))
      .filter(it => it.qty > 0);
    if (!items.length) return Swal.fire({ icon: 'warning', title: 'Nothing Selected', text: 'Enter a return quantity for at least one item' });
    setSaving(true);
    const result = await fbCreateReturn(sale.id, items, user);
    setSaving(false);
    if (result.success) {
      Swal.fire({ icon: 'success', title: 'Return Processed', text: 'Refund: ' + money(totalRefund), timer: 2000, showConfirmButton: false });
      onDone();
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: result.message });
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-rotate-left"></i> Process Return - Sale {String(sale.id).slice(-6).toUpperCase()}</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <form onSubmit={handleSubmit}>
            <div className="about-table-wrapper">
              <table className="about-roles-table">
                <thead><tr><th>Item</th><th>Sold</th><th>Already Returned</th><th>Return Qty</th><th>Refund</th></tr></thead>
                <tbody>
                  {sale.items.map((it, i) => (
                    <tr key={it.sku || i}>
                      <td>{it.name}</td>
                      <td>{it.qty}</td>
                      <td>{already[i]}</td>
                      <td><input type="number" min="0" max={remaining(i)} value={qtys[i]} onChange={(e) => setQty(i, e.target.value)} style={{ width: '80px' }} /></td>
                      <td>{money(qtys[i] * it.price)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="stock-onhand-hint" style={{ marginTop: '16px' }}>Total Refund: <strong>{money(totalRefund)}</strong></p>
            <div className="form-actions">
              <button type="submit" className="btn btn-danger" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Processing...</> : <><i className="fas fa-rotate-left"></i> Process Return</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}
