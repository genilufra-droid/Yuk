function erpExportPdf(title, headers, rows, totalsRow, filters) {
  try {
    erpEnsureLibs();
    if (!rows || !rows.length) {
      if (window.Swal) Swal.fire({ icon: 'info', title: 'Nuk ka të dhëna', text: 'Nuk ka rreshta për eksport pas filtrave.' });
      return;
    }
    if (!window.pdfMake || typeof pdfMake.createPdf !== 'function') {
      if (window.Swal) Swal.fire({ icon: 'error', title: 'PDF nuk u eksportua', text: 'pdfMake nuk u ngarkua. Hap me internet dhe rifresko faqen.' });
      return;
    }
    const biz = erpBusinessHeader();
    const hdrs = (headers || []).map(function(h) { return String(h == null ? '' : h); });
    if (!hdrs.length) {
      if (window.Swal) Swal.fire({ icon: 'error', title: 'PDF', text: 'Nuk ka kolona për eksport.' });
      return;
    }
    const filterLine = filters ? Object.keys(filters).filter(function(k) {
      return filters[k] !== '' && filters[k] != null;
    }).map(function(k) { return k + ': ' + filters[k]; }).join(' | ') : '';

    // pdfMake needs plain strings; sanitize
    function cellText(v) {
      const p = erpPlain(v);
      if (typeof p === 'number') return Number(p).toLocaleString('sq-AL', { maximumFractionDigits: 2 });
      // pdfMake default font supports Latin; keep Albanian chars
      return String(p).slice(0, 500);
    }

    const body = [];
    body.push(hdrs.map(function(h) {
      return { text: cellText(h), style: 'th', fillColor: '#714B67', color: '#ffffff' };
    }));
    rows.forEach(function(r, ri) {
      body.push(hdrs.map(function(h) {
        return { text: cellText(r[h]), style: 'td', fillColor: ri % 2 === 0 ? '#ffffff' : '#fafbfc' };
      }));
    });
    if (totalsRow && rows.length) {
      body.push(hdrs.map(function(h, i) {
        const t = (i === 0)
          ? (totalsRow[h] != null && totalsRow[h] !== '' ? cellText(totalsRow[h]) : 'TOTAL')
          : cellText(totalsRow[h] != null ? totalsRow[h] : '');
        return { text: t, style: 'tf', fillColor: '#f3eef2' };
      }));
    }

    // Ensure every row has same column count
    body.forEach(function(row) {
      while (row.length < hdrs.length) row.push({ text: '', style: 'td' });
      if (row.length > hdrs.length) row.length = hdrs.length;

    const orientation = hdrs.length > 6 ? 'landscape' : 'portrait';
    const pageSize = hdrs.length > 10 ? 'A3' : 'A4';

    const doc = {

        { text: [biz.address, biz.phone, biz.email].filter(Boolean).join(' · ') || ' ', style: 'sub' },
        { text: 'Gjeneruar: ' + biz.when + '  |  Rreshta: ' + rows.length + (filterLine ? '  |  ' + filterLine : ''), style: 'sub', margin: [0, 0, 0, 10] },
        {
          table: {
            headerRows: 1,
            widths: hdrs.map(function() { return '*'; }),
            body: body,
            dontBreakRows: false
          },
          layout: {
            hLineWidth: function() { return 0.5; },
            vLineWidth: function() { return 0.5; },
            hLineColor: function() { return '#dee2e6'; },
            vLineColor: function() { return '#dee2e6'; },
            paddingLeft: function() { return 4; },
            paddingRight: function() { return 4; },
            paddingTop: function() { return 3; },
            paddingBottom: function() { return 3; }
          }
        }
      ],
      footer: function(currentPage, pageCount) {
        return {
          text: String(biz.name || 'Sistemi Genit') + '  ·  Faqe ' + currentPage + ' / ' + pageCount,
          alignment: 'center',
          fontSize: 8,
          color: '#6c757d',
          margin: [0, 8, 0, 0]
        };
      },
      styles: {
        biz: { fontSize: 10, color: '#6c757d', margin: [0, 0, 0, 2] },
        title: { fontSize: 16, bold: true, color: '#714B67', margin: [0, 0, 0, 2] },
        sub: { fontSize: 9, color: '#555555' },
        th: { bold: true, color: '#ffffff', fontSize: fontSize },
        td: { fontSize: fontSize, color: '#212529' },
        tf: { bold: true, fontSize: fontSize, color: '#714B67' }
      }
    };

    // Prefer download; on failure open blob
    const pdf = pdfMake.createPdf(doc);
    const fname = erpFileName(title, 'pdf');
    if (pdf.download) {
      pdf.download(fname);
    } else if (pdf.getBlob) {
      pdf.getBlob(function(blob) { erpDownloadBlob(fname, blob); });
    } else if (pdf.open) {
      pdf.open();
    }
  } catch (e) {
    console.error('erpExportPdf', e);
    if (window.Swal) Swal.fire({ icon: 'error', title: 'PDF dështoi', text: String(e && e.message || e) });
  }
}

function erpPrintPreview(title, headers, rows, totalsRow, filters) {
  try {
    if (!rows || !rows.length) {
      if (window.Swal) Swal.fire({ icon: 'info', title: 'Nuk ka të dhëna', text: 'Nuk ka rreshta për printim pas filtrave.' });
      return;
    }
    const biz = erpBusinessHeader();
    const hdrs = (headers || []).map(function(h) { return String(h == null ? '' : h); });
    const filterLine = filters ? Object.keys(filters).filter(function(k) {
      return filters[k] !== '' && filters[k] != null;
    }).map(function(k) { return k + ': ' + filters[k]; }).join(' | ') : '';
    const escLocal = (typeof esc === 'function') ? esc : function(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    };
    const th = hdrs.map(function(h) { return '<th>' + escLocal(h) + '</th>'; }).join('');
    const tb = rows.map(function(r) {
      return '<tr>' + hdrs.map(function(h) {
        const v = erpPlain(r[h]);
        return '<td>' + escLocal(typeof v === 'number' ? Number(v).toLocaleString('sq-AL') : v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    const tf = totalsRow ? '<tfoot><tr>' + hdrs.map(function(h, i) {
      const t = i === 0
        ? (totalsRow[h] != null && totalsRow[h] !== '' ? erpPlain(totalsRow[h]) : 'TOTAL')
        : erpPlain(totalsRow[h] != null ? totalsRow[h] : '');
      return '<td>' + escLocal(t) + '</td>';
    }).join('') + '</tr></tfoot>' : '';
    const w = window.open('', '_blank');
    if (!w) {
      if (window.Swal) Swal.fire({ icon: 'warning', title: 'Popup i bllokuar', text: 'Lejo popup për preview/print.' });
      return;
    }
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + escLocal(title) + '</title><style>' +
      'body{font-family:Arial,Helvetica,sans-serif;padding:16px;color:#212529;margin:0}h1{margin:0 0 4px;color:#714B67;font-size:20px;font-weight:500}.biz{color:#6c757d;font-size:12px;margin-bottom:2px}.sub{color:#555;font-size:12px;margin-bottom:14px}' +
      'table{width:100%;border-collapse:collapse;font-size:12px}th{background:#714B67;color:#fff;text-align:left;padding:8px;border:1px solid #714B67}' +
      'td{border:1px solid #dee2e6;padding:7px}tfoot td{font-weight:700;background:#f3eef2}' +
      '.actions{margin:0 0 12px;display:flex;gap:8px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:2}button{padding:8px 14px;border:0;border-radius:3px;cursor:pointer;font-weight:600}' +
      '.print{background:#714B67;color:#fff}.close{background:#e9ecef;color:#212529}' +
      '@media print{body{padding:8px}.actions{display:none!important}}' +
      '</style></head><body>' +
      '<div class="actions"><button class="print" onclick="window.print()">Printo</button><button class="close" onclick="window.close()">Mbyll</button></div>' +
      '<div class="biz">' + escLocal(biz.name) + (biz.address ? ' · ' + escLocal(biz.address) : '') + '</div>' +
      '<h1>' + escLocal(title) + '</h1>' +
      '<div class="sub">Gjeneruar: ' + escLocal(biz.when) + ' | Rreshta: ' + rows.length + (filterLine ? ' | ' + escLocal(filterLine) : '') + '</div>' +
      '<table><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody>' + tf + '</table>' +
      '</body></html>');
    w.document.close();
    try { w.focus(); } catch (e) {}
  } catch (e) {
    console.error(e);
    if (window.Swal) Swal.fire({ icon: 'error', title: 'Preview dështoi', text: String(e && e.message || e) });
  }
}

/** Extract filtered/exportable rows from a DataTable instance (excludes last action column by default). */
function erpFromDataTable(table, opts) {
  opts = opts || {};
  if (!table) return { headers: [], rows: [], filters: {}, totalsRow: null, scope: 'none', selectedCount: 0 };
  var excludeLast = opts.excludeLast !== false;
  // scope: 'selected' | 'filtered' | 'all' | 'auto' (auto = selected if any checked, else filtered)
  var scope = opts.scope || 'auto';
  var settings;
  try { settings = table.settings()[0]; } catch (e) {
    return { headers: [], rows: [], filters: {}, totalsRow: null, scope: 'none', selectedCount: 0 };
  }
  var colCount = settings.aoColumns.length;
  var endCol = excludeLast ? Math.max(0, colCount - 1) : colCount;
  var headers = [];
  for (var i = 0; i < endCol; i++) {
    var c = settings.aoColumns[i];
    headers.push(erpStripHtml(c.sTitle || c.data || ('Col' + (i + 1))) || ('Col' + (i + 1)));
  }

  // Selected indexes (checked rows among search-applied set)
  var selectedIndexes = [];
  try {
    table.rows({ search: 'applied' }).every(function() {
      var node = this.node();
      if (node && window.jQuery && jQuery(node).find('input.o-row-check').prop('checked')) {
        selectedIndexes.push(this.index());
      }
    });
    if (!selectedIndexes.length && window.jQuery) {
      var $tbl = jQuery(table.table().node());
      $tbl.find('tbody tr').each(function() {
        if (jQuery(this).find('input.o-row-check').prop('checked')) {
          try {
            var idx = table.row(this).index();
            if (idx != null && idx >= 0 && selectedIndexes.indexOf(idx) < 0) selectedIndexes.push(idx);
          } catch (e) {}
        }
      });
    }
  } catch (e) { selectedIndexes = []; }

  if (scope === 'auto') scope = selectedIndexes.length ? 'selected' : 'filtered';

  var indexes = [];
  try {
    if (scope === 'selected') indexes = selectedIndexes.slice();
    else if (scope === 'all') indexes = table.rows({ search: 'none' }).indexes().toArray();
    else indexes = table.rows({ search: 'applied' }).indexes().toArray();
  } catch (e) { indexes = []; }

  var cleanRows = indexes.map(function(idx) {
    var rowData = table.row(idx).data() || {};
    var obj = {};
    for (var i = 0; i < endCol; i++) {
      var c = settings.aoColumns[i];
      var val = null;
      var dataSrc = c.mData;
      if (dataSrc != null && dataSrc !== '' && typeof dataSrc !== 'function') {
        try { val = rowData[dataSrc]; } catch (e) { val = null; }
      }
      if (val == null || typeof val === 'object' || (typeof val === 'string' && /</.test(val))) {
        try { val = erpStripHtml(table.cell(idx, i).render('display')); }
        catch (e) {
          try { val = erpStripHtml(table.cell(idx, i).render('export')); } catch (e2) { val = ''; }
        }
      }
      if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(val)) {
        try { val = formatDateForDisplay(val); } catch (e) {}
      }
      if (typeof val === 'boolean') val = val ? 'Po' : 'Jo';
      if (typeof val === 'string') {
        // remove checkbox glyphs if leaked
        val = val.replace(/^[\s\u00a0]*[\u2610\u2611\u9744\u9745]?\s*/, '');
      }
      obj[headers[i]] = val;
    }
    return obj;
  });

  var totalsRow = {};
  headers.forEach(function(h, i) {
    var sum = 0, count = 0;
    cleanRows.forEach(function(r) {
      var v = r[h];
      if (typeof v === 'number' && Number.isFinite(v)) { sum += v; count++; return; }
      var s = String(v == null ? '' : v).trim();
      if (/^[\$€£Lek\s]*-?[\d]{1,3}(?:[.,\d]*)$/i.test(s) || /^-?\d+(?:[.,]\d+)?$/.test(s)) {
        var n = Number(s.replace(/[^0-9.\-]/g, ''));
        if (Number.isFinite(n)) { sum += n; count++; }
      }
    });
    var moneyLike = /balanc|total|çmim|cmim|shum|amount|price|cost|profit|value|detyrim|fitim|vler|pages|grade/i.test(h);
    if (count > 0 && count >= Math.max(1, Math.floor(cleanRows.length * 0.4))) {
      totalsRow[h] = moneyLike && typeof money === 'function' ? money(sum) : (Math.round(sum * 100) / 100);
    } else {
      totalsRow[h] = i === 0 ? 'TOTAL' : '';
    }
  });

  var search = (table.search && table.search()) || '';
  var filters = {};
  if (scope === 'selected') filters['Eksport'] = 'Vetëm të selektuarit (' + cleanRows.length + ')';
  else if (scope === 'all') filters['Eksport'] = 'Të gjitha (' + cleanRows.length + ')';
  else filters['Eksport'] = 'Të filtruarit (' + cleanRows.length + ')';
  if (search) filters['Kërkim'] = search;
  filters['Rreshta'] = cleanRows.length;
  return { headers: headers, rows: cleanRows, totalsRow: totalsRow, filters: filters, scope: scope, selectedCount: selectedIndexes.length };
}

function erpExportFromDataTable(table, title, mode, scope) {
  var pack = erpFromDataTable(table, { scope: scope || 'auto' });
  if (!pack.rows || !pack.rows.length) {
    var msg = (scope === 'selected' || pack.scope === 'selected')
      ? 'Nuk ka rreshta të selektuar. Zgjidh me checkbox, ose hiq selektimin për të eksportuar të filtruarit.'
      : 'Nuk ka rreshta për eksport.';
    if (window.Swal) Swal.fire({ icon: 'info', title: 'Eksport bosh', text: msg });
    return;
  }
  try {
    if (window.Swal) {
      var label = pack.scope === 'selected'
        ? ('Selektuar: ' + pack.rows.length)
        : (pack.scope === 'all' ? ('Të gjitha: ' + pack.rows.length) : ('Të filtruar: ' + pack.rows.length));
      Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1600 })
        .fire({ icon: 'info', title: label });
    }
  } catch (e) {}
  if (mode === 'xlsx') return erpExportXlsx(title, pack.headers, pack.rows, pack.totalsRow, pack.filters);
  if (mode === 'pdf') return erpExportPdf(title, pack.headers, pack.rows, pack.totalsRow, pack.filters);
  return erpPrintPreview(title, pack.headers, pack.rows, pack.totalsRow, pack.filters);
}

function OdooKanban({ columns, onDropCard }) {
  // columns: [{ id, title, cards: [{ id, title, sub, meta, amount, tags, raw, record }] }]
  // onDropCard(cardId, fromColId, toColId, card)
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);

  const onDragStart = (e, card, colId) => {
    setDragId(card.id);
    try {
      e.dataTransfer.setData('text/plain', JSON.stringify({ cardId: card.id, fromColId: colId }));
      e.dataTransfer.effectAllowed = 'move';
    } catch (err) {}
    e.currentTarget.classList.add('o-dragging');
  };
  const onDragEnd = (e) => {
    e.currentTarget.classList.remove('o-dragging');
    setDragId(null);
    setOverCol(null);
  };
  const onDragOver = (e, colId) => {
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
    if (overCol !== colId) setOverCol(colId);
  };
  const onDragLeave = (e, colId) => {
    if (overCol === colId) setOverCol(null);
  };
  const onDrop = (e, toColId) => {
    e.preventDefault();
    setOverCol(null);
    let payload = null;
    try { payload = JSON.parse(e.dataTransfer.getData('text/plain') || '{}'); } catch (err) { payload = {}; }
    const cardId = payload.cardId || dragId;
    const fromColId = payload.fromColId;
    if (!cardId || !toColId || fromColId === toColId) return;
    let card = null;
    (columns || []).forEach(c => (c.cards || []).forEach(x => { if (x.id === cardId) card = x; }));
    if (onDropCard) onDropCard(cardId, fromColId, toColId, card);
    setDragId(null);
  };

  return (
    <div className="o-kanban">
      {(columns || []).map(col => (
        <div className={'o-kanban-col' + (overCol === col.id ? ' o-col-hover' : '')} key={col.id}>
          <div className="o-kanban-col-header">
            <span>{col.title}</span>
            <span className="count">{(col.cards || []).length}</span>
          </div>
          <div
            className={'o-kanban-col-body' + (overCol === col.id ? ' o-drop-hover' : '')}
            onDragOver={(e) => onDragOver(e, col.id)}
            onDragLeave={(e) => onDragLeave(e, col.id)}
            onDrop={(e) => onDrop(e, col.id)}
          >
            {(col.cards || []).length === 0 && <div className="o-kanban-empty">Hiq këtu / Nuk ka regjistrime</div>}
            {(col.cards || []).map(card => (
              <div
                className={'o-kanban-card' + (dragId === card.id ? ' o-dragging' : '')}
                key={card.id}
                draggable={!!onDropCard}
                onDragStart={(e) => onDragStart(e, card, col.id)}
                onDragEnd={onDragEnd}
                onClick={() => card.onClick && card.onClick(card)}
              >
                <div className="k-title">{card.title}</div>
                {card.sub && <div className="k-sub">{card.sub}</div>}
                {card.meta && <div className="k-sub">{card.meta}</div>}
                {(card.tags || []).length > 0 && (
                  <div className="k-tags">{card.tags.map((t, i) => <span className="k-tag" key={i}>{t}</span>)}</div>
                )}
                <div className="k-meta">
                  <span>{card.footer || ''}</span>
                  {card.amount != null && card.amount !== '' && <span className="k-amount">{card.amount}</span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}


function useDtLiveSearch(tableRef, query) {
  useEffect(() => {
    let alive = true;
    const apply = () => {
      if (!alive) return false;
      const t = tableRef && (tableRef.current || tableRef);
      if (!t || !t.search) return false;
      const q = query == null ? '' : String(query);
      try { if (t.search() !== q) t.search(q).draw(false); } catch (e) {}
      return true;
    };
    if (apply()) return () => { alive = false; };
    // table may mount a tick later after DataTable init
    const id = setInterval(() => { if (apply()) clearInterval(id); }, 120);
    const stop = setTimeout(() => clearInterval(id), 4000);
    return () => { alive = false; clearInterval(id); clearTimeout(stop); };
  }, [query, tableRef]);
}

function FilteredSummaryBar({ tableRef, itemsBuilder, deps }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let alive = true;
    let bound = null;
    const redraw = () => { if (alive) setTick(x => x + 1); };
    const tryBind = () => {
      const t = tableRef && tableRef.current;
      if (!t || !t.on) return false;
      if (bound === t) return true;
      if (bound && bound.off) { try { bound.off('draw.erpSum search.erpSum', redraw); } catch (e) {} }
      t.on('draw.erpSum search.erpSum', redraw);
      bound = t;
      redraw();
      return true;
    };
    if (!tryBind()) {
      const id = setInterval(() => { if (tryBind()) clearInterval(id); }, 150);
      var stop = setTimeout(() => clearInterval(id), 5000);
    }
    return () => {
      alive = false;
      if (bound && bound.off) { try { bound.off('draw.erpSum search.erpSum', redraw); } catch (e) {} }
    };
  }, [...(deps || [])]);
  const t = tableRef && tableRef.current;
  if (!t) return <SummaryBar items={[{ label: 'Të filtruar', value: '…' }]} />;
  let filtered = [];
  try { filtered = t.rows({ search: 'applied' }).data().toArray(); } catch (e) { filtered = []; }
  const items = itemsBuilder ? itemsBuilder(filtered, t) : [{ label: 'Të filtruar', value: filtered.length }];
  return (
    <>
      <SummaryBar items={items} />
      
    </>
  );
}

const getTimeAgo = (iso) => {
  const s = Math.floor((new Date() - new Date(iso)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};

// qty on hand = running total of a product's stock ledger (in adds, out subtracts) - never stored
function computeQtyOnHand(productId, movements) {
  return (movements || []).reduce((qty, m) => m.productId === productId ? qty + (m.type === 'in' ? m.qty : -m.qty) : qty, 0);
}


// Unit conversion helpers: stock is always stored in BASE unit (usually copë).
function unitBaseName(product) {
  return String((product && (product.unit || product.baseUnit)) || 'copë').trim() || 'copë';
}
function safeMultiplier(v, fallback = 1) {
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : fallback;
}
function unit3EffectiveMultiplier(product) {
  const c3 = safeMultiplier(product && product.unit3Coef, 0);
  const c2 = safeMultiplier(product && product.unit2Coef, 1);
  if (!(c3 > 1)) return 0;
  // Nëse ka njësi 2 dhe koeficienti i njësisë 3 duket si numër njësish 2 (p.sh. 117 koli),
  // e kthejmë në bazë: 117 * 12 copë. Nëse është vendosur direkt bazë (p.sh. 1368), e lëmë siç është.
  if (product && product.unit2Name && c2 > 1 && c3 < c2 * 10) return round2(c3 * c2);
  return c3;
}
function getProductUnitOptions(product) {
  const base = unitBaseName(product);
  const opts = [{ value: 'base', key: 'base', name: base, multiplier: 1, label: base + ' (bazë)' }];
  if (product && product.unit2Name && safeMultiplier(product.unit2Coef, 0) > 1) {
    const m = safeMultiplier(product.unit2Coef);
    opts.push({ value: 'unit2', key: 'unit2', name: String(product.unit2Name).trim(), multiplier: m, label: String(product.unit2Name).trim() + ' = ' + m + ' ' + base });
  }
  if (product && product.unit3Name && safeMultiplier(product.unit3Coef, 0) > 1) {
    const raw3 = safeMultiplier(product.unit3Coef);
    const m = unit3EffectiveMultiplier(product);
    const u3 = String(product.unit3Name).trim();
    const u2 = product.unit2Name ? String(product.unit2Name).trim() : '';
    const c2 = safeMultiplier(product.unit2Coef, 1);
    const label = (u2 && c2 > 1 && m !== raw3) ? (u3 + ' = ' + raw3 + ' ' + u2 + ' × ' + c2 + ' ' + base + ' = ' + m + ' ' + base) : (u3 + ' = ' + m + ' ' + base);
    opts.push({ value: 'unit3', key: 'unit3', name: u3, multiplier: m, label });
  }
  return opts;
}
function getProductUnit(product, unitKey) {
  return getProductUnitOptions(product).find(u => u.value === unitKey) || getProductUnitOptions(product)[0];
}
function toBaseQty(product, qty, unitKey) {
  return round2((Number(qty) || 0) * safeMultiplier(getProductUnit(product, unitKey).multiplier));
}
function unitPrice(product, unitKey) {
  const unit = getProductUnit(product, unitKey || 'base');
  if (unit.value === 'unit2' && product && Number(product.unit2Price) > 0) return round2(Number(product.unit2Price));
  if (unit.value === 'unit3' && product && Number(product.unit3Price) > 0) return round2(Number(product.unit3Price));
  return round2((Number(product && product.price) || 0) * safeMultiplier(unit.multiplier));
}
function unitBasePrice(product, unitKey) {
  const unit = getProductUnit(product, unitKey || 'base');
  const up = unitPrice(product, unit.value);
  return round2(up / safeMultiplier(unit.multiplier));
}
function formatUnitStructure(product) {
  const base = unitBaseName(product);
  const bits = [base + ' bazë'];
  if (product && product.unit2Name && safeMultiplier(product.unit2Coef, 0) > 1) bits.push('1 ' + product.unit2Name + ' = ' + safeMultiplier(product.unit2Coef) + ' ' + base);
  if (product && product.unit3Name && safeMultiplier(product.unit3Coef, 0) > 1) {
    const raw3 = safeMultiplier(product.unit3Coef);
    const m = unit3EffectiveMultiplier(product);
    if (product.unit2Name && safeMultiplier(product.unit2Coef, 1) > 1 && m !== raw3) bits.push('1 ' + product.unit3Name + ' = ' + raw3 + ' ' + product.unit2Name + ' = ' + m + ' ' + base);
    else bits.push('1 ' + product.unit3Name + ' = ' + m + ' ' + base);
  }
  return bits.join(' • ');
}
function formatQtyWithUnits(baseQty, product) {
  const q = Number(baseQty) || 0;
  const base = unitBaseName(product);
  const opts = getProductUnitOptions(product).filter(u => u.multiplier > 1).sort((a, b) => b.multiplier - a.multiplier);
  const alt = opts.find(u => q && Number.isFinite(q / u.multiplier) && Math.abs((q / u.multiplier) - Math.round(q / u.multiplier)) < 0.000001);
  return q + ' ' + base + (alt ? ' (' + round2(q / alt.multiplier) + ' ' + alt.name + ')' : '');
}
function formatQtyTwoUnits(baseQty, product, preferredUnitKey) {
  const q = Number(baseQty) || 0;
  const base = unitBaseName(product);
  const preferred = preferredUnitKey ? getProductUnit(product, preferredUnitKey) : null;
  let alt = preferred && preferred.multiplier > 1 ? preferred : null;
  if (!alt) alt = getProductUnitOptions(product).filter(u => u.multiplier > 1).sort((a, b) => a.multiplier - b.multiplier)[0];
  return q + ' ' + base + (alt && alt.multiplier > 1 ? ' / ' + round2(q / alt.multiplier) + ' ' + alt.name : '');
}

function getDtRowData(table, el) {
  let tr = $(el).closest('tr');
  if (tr.hasClass('child')) tr = tr.prev();
  let rowData = table.row(tr).data();
  if (!rowData) {
    const parent = $(el).closest('tr').prevAll('tr').filter(function() { return !$(this).hasClass('child'); }).first();
    if (parent.length) rowData = table.row(parent).data();
  }
  return rowData || null;
}
function docLinkHtml(action, id, label) {
  const escL = (typeof esc === 'function') ? esc : function (x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  return '<button type="button" class="doc-link" data-action="' + action + '" data-id="' + escL(id) + '"><i class="fas fa-arrow-right"></i>' + escL(label) + '</button>';
}
function actionBtn(action, icon, label, extraClass) {
  return `<button type="button" class="product-action-btn odoo-row-btn ${extraClass || ''}" data-action="${action}" title="${label}"><i class="fas ${icon}"></i><span class="btn-label"> ${label}</span></button>`;
}
function statusTextSq(value) {
  const m = { ordered: 'Porositur', received: 'Marrë në stok', draft: 'Draft', cancelled: 'Anuluar', completed: 'Përfunduar', credit: 'Kredi' };
  return m[value] || value || '-';
}
function stockTypeText(type) { return type === 'in' ? 'HYRJE' : 'DALJE'; }
function displayEnteredQty(row, product) {
  const entered = row && row.enteredQty != null ? Number(row.enteredQty) : (row && row.unitMultiplier ? round2((Number(row.qty) || 0) / Number(row.unitMultiplier || 1)) : Number(row && row.qty || 0));
  const unitName = (row && row.unitName) || (product ? unitBaseName(product) : 'copë');
  return round2(entered) + ' ' + unitName;
}
function displayBaseQty(row, product) {
  const q = Number(row && row.qty || 0);
  if (!product && row && Number(row.unitMultiplier) > 1 && row.unitName) return q + ' copë (' + round2(q / Number(row.unitMultiplier)) + ' ' + row.unitName + ')';
  return formatQtyWithUnits(q, product || null);
}

// how much of a given sale line has already been returned - prevents returning more than was sold
function computeReturnedQty(saleId, productId, returns) {
  return (returns || []).reduce((qty, r) => r.saleId === saleId ? qty + (r.items || []).filter(it => it.productId === productId).reduce((s, it) => s + it.qty, 0) : qty, 0);
}

// build an instant lookup for POS - normalized id/sku/barcode -> product (avoids a firebase round-trip per scan)
function buildCodeIndex(products) {
  const m = new Map();
  (products || []).forEach(p => { [p.id, p.sku, p.barcode].forEach(k => { if (k) m.set(String(k).trim().toLowerCase(), p); }); });
  return m;
}


// race-safe data loading - token guard drops stale + post-unmount results
function useFetch(fn, deps = []) {
  const [s, setS] = useState({ loading: true, data: null, err: null });
  const tok = useRef(0);
  useEffect(() => {
    const id = ++tok.current;
    setS(p => ({ ...p, loading: true }));
    Promise.resolve(fn())
      .then(r => { if (id === tok.current) setS({ loading: false, data: r, err: null }); })
      .catch(e => { if (id === tok.current) setS({ loading: false, data: null, err: e }); });
    return () => { tok.current++; };
  }, deps);
  return s;
}

// --- SearchableDropdown (single-select) ---
const DropdownItem = React.memo(function DropdownItem({ option, selected, onSelect }) {
  return <div className={`searchable-dropdown-item ${selected ? 'selected' : ''}`} onClick={() => onSelect(option)}>{option.label}</div>;
});

function SearchableDropdown({ options, value, onChange, placeholder = 'Select...', label, icon, required = false, creatable = false, createLabel, onCreate, allowClear = true }) {
  const [isOpen, setIsOpen] = useState(false);
  const [search, setSearch] = useState('');
  const [creating, setCreating] = useState(false);
  const dropdownRef = useRef(null);
  const selectedLabel = (options || []).find(o => String(o.value) === String(value))?.label || '';
  const optIdx = useMemo(() => (options || []).map(o => ({ o, k: String(o.label || '').toLowerCase() })), [options]);
  const dq = useDeferredValue(search).toLowerCase();
  const filtered = useMemo(() => optIdx.filter(x => !dq || x.k.includes(dq)).map(x => x.o), [optIdx, dq]);
  const exact = useMemo(() => {
    const s = String(search || '').trim().toLowerCase();
    if (!s) return false;
    return (options || []).some(o => String(o.label || '').toLowerCase() === s || String(o.value || '').toLowerCase() === s);
  }, [options, search]);
  const showCreate = creatable && String(search || '').trim() && !exact;

  useEffect(() => {
    const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) { setIsOpen(false); setSearch(''); } };
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const handleSelect = useCallback((option) => {
    onChange(option.value, option);
    setIsOpen(false);
    setSearch('');
  }, [onChange]);
  const handleInputChange = (e) => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); };
  const handleInputClick = () => { setIsOpen(!isOpen); if (!isOpen) setSearch(''); };
  const handleCreate = async () => {
    const term = String(search || '').trim();
    if (!term || !onCreate) return;
    setCreating(true);
    try {
      const res = await onCreate(term);
      // onCreate may navigate away or return { value }
      if (res && res.value != null) {
        onChange(res.value, res);
      } else if (res !== false && res != null && res !== undefined && typeof res !== 'object') {
        onChange(res);
      }
      // if navigated, just close
      setIsOpen(false);
      setSearch('');
    } catch (e) {
      if (window.Swal) Swal.fire({ icon: 'error', title: 'Shtimi dështoi', text: e.message || String(e) });
    }
    setCreating(false);
  };

  return (
    <div className="form-group">
      {label && <label>{icon && <i className={icon}></i>} {label}{required && ' *'}</label>}
      <div className="searchable-dropdown" ref={dropdownRef}>
        <input type="text" className="searchable-dropdown-input" placeholder={placeholder}
          value={isOpen ? search : selectedLabel} onChange={handleInputChange} onClick={handleInputClick} required={required && !value}
          autoComplete="off" />
        <span className={`searchable-dropdown-arrow ${isOpen ? 'open' : ''}`}><i className="fas fa-chevron-down"></i></span>
        {isOpen && (
          <div className="searchable-dropdown-list">
            {allowClear && (
              <div className={`searchable-dropdown-item ${!value ? 'selected' : ''}`} onClick={() => handleSelect({ value: '', label: '' })}>{placeholder}</div>
            )}
            {filtered.length > 0 ? filtered.map((option, idx) => (
              <DropdownItem key={String(option.value) + '-' + idx} option={option} selected={String(value) === String(option.value)} onSelect={handleSelect} />
            )) : (
              !showCreate && <div className="searchable-dropdown-item no-results">Nuk u gjet asgjë</div>
            )}
            {showCreate && (
              <div className="searchable-dropdown-item create-new" onClick={creating ? undefined : handleCreate}>
                <i className={creating ? 'fas fa-spinner fa-spin' : 'fas fa-plus-circle'}></i>
                {createLabel ? createLabel.replace('{q}', search) : ('Shto: ' + search)}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// --- SearchableMultiSelect (multi-select, ready for future multi-attribute fields) ---
const MultiItem = React.memo(function MultiItem({ option, checked, onToggle }) {
  return <div className={`searchable-dropdown-item ${checked ? 'checked' : ''}`} onClick={() => onToggle(option.value)}>{option.label}</div>;
});

function SearchableMultiSelect({ options, values = [], onChange, placeholder = 'Select...', label, icon, required = false }) {
  const [isOpen, setIsOpen] = useState(false);
  const [search, setSearch] = useState('');
  const dropdownRef = useRef(null);
  const sel = useMemo(() => new Set(values), [values]);
  const selectedLabels = useMemo(() => options.filter(o => sel.has(o.value)), [options, sel]);
  const optIdx = useMemo(() => options.map(o => ({ o, k: o.label.toLowerCase() })), [options]);
  const dq = useDeferredValue(search).toLowerCase();
  const filtered = useMemo(() => optIdx.filter(x => x.k.includes(dq)).map(x => x.o), [optIdx, dq]);

  useEffect(() => {
    const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) { setIsOpen(false); setSearch(''); } };
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const toggleOption = useCallback((optionValue) => {
    const newValues = sel.has(optionValue) ? values.filter(v => v !== optionValue) : [...values, optionValue];
    onChange(newValues);
  }, [values, sel, onChange]);
  const removeTag = (optionValue) => onChange(values.filter(v => v !== optionValue));

  return (
    <div className="form-group">
      {label && <label>{icon && <i className={icon}></i>} {label}{required && ' *'}</label>}
      {selectedLabels.length > 0 && (
        <div className="searchable-multi-tags">
          {selectedLabels.map((o, i) => <span key={i} className="searchable-multi-tag">{o.label}
            <button type="button" className="searchable-multi-tag-remove" onClick={() => removeTag(o.value)}><i className="fas fa-times"></i></button></span>)}
        </div>
      )}
      <div className="searchable-dropdown" ref={dropdownRef}>
        <input type="text" className="searchable-dropdown-input" placeholder={values.length > 0 ? `${values.length} selected` : placeholder}
          value={isOpen ? search : ''} onChange={(e) => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); }}
          onClick={() => { setIsOpen(!isOpen); if (!isOpen) setSearch(''); }} required={required && values.length === 0} />
        <span className={`searchable-dropdown-arrow ${isOpen ? 'open' : ''}`}><i className="fas fa-chevron-down"></i></span>
        {isOpen && (
          <div className="searchable-dropdown-list">
            {filtered.length > 0 ? filtered.map((option, idx) => <MultiItem key={idx} option={option} checked={sel.has(option.value)} onToggle={toggleOption} />)
              : <div className="searchable-dropdown-item no-results">No results found</div>}
          </div>
        )}
      </div>
    </div>
  );
}

// reverse-chron activity feed from logs matching a term (name/email)
function HubTimeline({ logs, match }) {
  const m = String(match || '').toLowerCase();
  const rows = (logs || []).filter(l => !m || (`${l.detail || ''} ${l.user || ''}`).toLowerCase().includes(m));

  return <ul className="hub-timeline">{rows.map(l => <li key={l.id}><span className="tl-icon"><i className="fas fa-clock-rotate-left"></i></span><div className="tl-body"><strong>{l.action}</strong> — {l.detail}<div className="tl-when">{l.user} · {getTimeAgo(l.ts)}</div></div></li>)}</ul>;
}

// tabbed view-hub modal - tabs: [{id,label,icon,content}], header = identity card + kpis
function TabbedModal({ title, icon, header, tabs, onClose }) {
  const [active, setActive] = useState(tabs[0] && tabs[0].id);
  const cur = tabs.find(t => t.id === active) || tabs[0];
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header"><h3><i className={`fas ${icon}`}></i> {title}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          {header}
          <div className="modal-tabs">{tabs.map(t => <button key={t.id} className={`modal-tab ${active === t.id ? 'active' : ''}`} onClick={() => setActive(t.id)}><i className={`fas ${t.icon}`}></i> {t.label}</button>)}</div>
          <div>{cur && cur.content}</div>
        </div>
      </div>
    </div>
  );
}

// Product hub - details + stock movement ledger + sales history

  const { loading, data } = useFetch(() => Promise.all([fbGetStockMovements(), fbGetSales()]), []);
  const moves = useMemo(() => (data && data[0] && data[0].success ? data[0].data.filter(m => m.productId === product.id) : []), [data, product.id]);
  const allSales = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const qty = computeQtyOnHand(product.id, moves);
  const soldLines = useMemo(() => allSales.flatMap(s => (s.items || []).filter(it => it.productId === product.id).map((it, idx) => {
    const unitName = it.unitName || product.unitBase || product.unit || 'copë';
    const paidQty = Number(it.displayQty != null ? it.displayQty : (it.paidQty != null ? it.paidQty : it.qty)) || 0;
    const freeQty = Number(it.freeDisplayQty != null ? it.freeDisplayQty : it.freeQty) || 0;
    const unitPrice = Number(it.unitSalePrice != null ? it.unitSalePrice : it.price) || 0;

    return { id: s.id + '_' + it.productId + '_' + idx, when: s.createdAt, customer: s.customerName, qty: paidQty, freeQty, unitName, price: unitPrice, value: lineValue };
  })), [allSales, product.id, product.unit, product.unitBase]);
  const soldQty = soldLines.reduce((a, l) => a + Number(l.qty || 0), 0);
  const margin = Number(product.price) > 0 ? Math.round((Number(product.price) - Number(product.cost || 0)) / Number(product.price) * 100) : 0;
  const header = (
    <>
      <div className="hub-id-card"><div className="hub-avatar"><i className="fas fa-box"></i></div><div><div className="hub-name">{product.name}</div><div className="hub-sub">SKU {product.sku}{product.category ? ' · ' + product.category : ''}</div></div></div>
      <HubKpis items={[{ label: 'On Hand', value: qty }, { label: 'Stock Value', value: money(qty * (Number(product.cost) || 0)) }, { label: 'Sold', value: soldQty }, { label: 'Margin', value: margin + '%' }]} />
    </>
  );
  const tabs = [

// Supplier hub - profile + this supplier's POs + timeline
function SupplierHubModal({ supplier, onClose }) {
  const { loading, data } = useFetch(() => Promise.all([fbGetPurchaseOrders(), fbGetLogs()]), []);
  const supPOs = useMemo(() => (data && data[0] && data[0].success ? data[0].data.filter(p => p.supplierName === supplier.name) : []), [data, supplier.name]);
  const logs = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const poValue = supPOs.reduce((a, p) => a + Number(p.total || 0), 0);
  const header = (
    <>
      <div className="hub-id-card"><div className="hub-avatar"><i className="fas fa-truck-field"></i></div><div><div className="hub-name">{supplier.name}</div><div className="hub-sub">{supplier.contact || 'Supplier'}</div></div></div>
      <HubKpis items={[{ label: 'Payable', value: money(supplier.openingBalance) }, { label: 'POs', value: supPOs.length }, { label: 'PO Value', value: money(poValue) }]} />
    </>
  );
  const tabs = [
    { id: 'overview', label: 'Overview', icon: 'fa-circle-info', content: <div><HubField label="Contact" value={supplier.contact} /><HubField label="Phone" value={supplier.phone} /><HubField label="Email" value={supplier.email} /><HubField label="Terms" value={supplier.terms} /><HubField label="Address" value={supplier.address} /><HubField label="Notes" value={supplier.notes} /></div> },
    { id: 'pos', label: 'Purchase Orders', icon: 'fa-file-invoice-dollar', content: loading ? <div className="hub-empty">Loading…</div> : (supPOs.length ? <table className="hub-mini-table"><thead><tr><th>PO #</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>{supPOs.map(p => <tr key={p.id}><td>{p.poNumber}</td><td>{formatDateForDisplay(p.createdAt)}</td><td>{money(p.total)}</td><td>{p.status || 'draft'}</td></tr>)}</tbody></table> : <div className="hub-empty">No purchase orders.</div>) },
    { id: 'timeline', label: 'Timeline', icon: 'fa-stream', content: loading ? <div className="hub-empty">Loading…</div> : <HubTimeline logs={logs} match={supplier.name} /> }

  return <TabbedModal title={supplier.name} icon="fa-truck-field" header={header} tabs={tabs} onClose={onClose} />;
}

function NavDropdown({ trigger, children }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);
  return (
    <div className={`nav-dd${open ? ' open' : ''}`} ref={ref} style={{ height: '100%', display: 'flex', alignItems: 'stretch' }}>
      <div onClick={() => setOpen(!open)} style={{ display: 'flex', alignItems: 'stretch', height: '100%', cursor: 'pointer' }}>{trigger}</div>
      <div className="nav-dd-menu" onClick={() => setOpen(false)}>{children}</div>
    </div>
  );
}

function InitialSetupPage({ onComplete }) {
  const [form, setForm] = useState({
    businessName: '', nipt: '', address: '', phone: '',
    warehouse: 'Magazina Kryesore', adminName: '', email: '',
    password: '', confirmPassword: ''
  });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const upd = (key, value) => setForm(prev => Object.assign({}, prev, { [key]: value }));

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (form.password !== form.confirmPassword) {
      setError('Fjalëkalimet nuk përputhen.');
      return;
    }
    setLoading(true);
    try {
      const result = await fbCreateInitialSetup(form);
      setLoading(false);
      if (!result.success) {
        setError(result.message || 'Konfigurimi dështoi.');
        return;
      }
      if (result.data) onComplete(result.data, result.data.role || 'Admin');
      else window.location.reload();
    } catch (err) {
      setLoading(false);
      setError('Konfigurimi dështoi: ' + (err.message || err));
    }
  };

  return (
    <div className="login-container">
      <div className="login-box" style={{maxWidth: '640px', textAlign: 'left'}}>
        <div style={{textAlign: 'center'}}>
          <img src={LOGO_URL} alt="Logo" className="login-logo" />
          <h2 style={{marginBottom: '10px'}}>Konfigurimi i parë</h2>
          <p style={{color: '#667085', marginBottom: '24px'}}>Sistemi është bosh. Krijoni kompaninë dhe administratorin e parë.</p>
        </div>
        <form onSubmit={submit}>
          <div className="form-grid">
            <div className="form-group"><label>Emri i kompanisë *</label><input value={form.businessName} onChange={e => upd('businessName', e.target.value)} required /></div>
            <div className="form-group"><label>NIPT</label><input value={form.nipt} onChange={e => upd('nipt', e.target.value)} /></div>
            <div className="form-group"><label>Adresa</label><input value={form.address} onChange={e => upd('address', e.target.value)} /></div>
            <div className="form-group"><label>Telefoni</label><input value={form.phone} onChange={e => upd('phone', e.target.value)} /></div>
            <div className="form-group"><label>Magazina kryesore *</label><input value={form.warehouse} onChange={e => upd('warehouse', e.target.value)} required /></div>
            <div className="form-group"><label>Emri i administratorit *</label><input value={form.adminName} onChange={e => upd('adminName', e.target.value)} required /></div>
            <div className="form-group"><label>Email-i i administratorit *</label><input type="email" value={form.email} onChange={e => upd('email', e.target.value)} required /></div>
            <div className="form-group"><label>Fjalëkalimi *</label><input type="password" minLength="6" value={form.password} onChange={e => upd('password', e.target.value)} required /></div>
            <div className="form-group"><label>Konfirmo fjalëkalimin *</label><input type="password" minLength="6" value={form.confirmPassword} onChange={e => upd('confirmPassword', e.target.value)} required /></div>
          </div>
          <button type="submit" className="btn btn-primary" disabled={loading} style={{width: '100%', marginTop: '6px'}}>
            {loading ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-check"></i> Krijo sistemin bosh</>}
          </button>
          {error && <div className="error">{error}</div>}
        </form>
      </div>
    </div>
  );
}

              <SearchableDropdown label="Group / Category" icon="fas fa-tag" options={catOpts} value={formData.category} onChange={(val) => setFormData(p => ({ ...p, category: val }))} placeholder="Select group..." />
              <div className="form-group"><label>Tax ID / GST No</label><input type="text" value={formData.taxId} onChange={(e) => setFormData(p => ({ ...p, taxId: e.target.value }))} /></div>
              <div className="form-group"><label>City</label><input type="text" value={formData.city} onChange={(e) => setFormData(p => ({ ...p, city: e.target.value }))} /></div>
              <div className="form-group"><label>Country</label><input type="text" value={formData.country} onChange={(e) => setFormData(p => ({ ...p, country: e.target.value }))} /></div>
              <div className="form-group"><label>Opening Balance</label><input type="number" step="0.01" value={formData.amount} onChange={(e) => setFormData(p => ({ ...p, amount: e.target.value }))} /></div>
              <div className="form-group"><label>Credit Limit</label><input type="number" step="0.01" min="0" value={formData.creditLimit} onChange={(e) => setFormData(p => ({ ...p, creditLimit: e.target.value }))} /></div>
              <div className="form-group"><label>Loyalty Points</label><input type="number" step="1" min="0" value={formData.loyaltyPoints} onChange={(e) => setFormData(p => ({ ...p, loyaltyPoints: e.target.value }))} /></div>
              <div className="form-group"><label>Assigned To</label><input type="text" placeholder="Salesperson" value={formData.assignedTo} onChange={(e) => setFormData(p => ({ ...p, assignedTo: e.target.value }))} /></div>
              <div className="form-group"><label>Source</label><input type="text" placeholder="Walk-in, Referral, Web..." value={formData.source} onChange={(e) => setFormData(p => ({ ...p, source: e.target.value }))} /></div>
              <div className="form-group"><label><i className="fas fa-calendar-check"></i> Next Follow-up</label><input type="date" value={formData.nextFollowUp} onChange={(e) => setFormData(p => ({ ...p, nextFollowUp: e.target.value }))} /></div>
              <div className="form-group"><label>Tags</label><input type="text" placeholder="comma,separated" value={formData.tags} onChange={(e) => setFormData(p => ({ ...p, tags: e.target.value }))} /></div>
              <div className="form-group">
                <label><i className="fas fa-toggle-on"></i> Active</label>
                <div><input type="checkbox" className="toggle" checked={formData.active} onChange={(e) => setFormData(p => ({ ...p, active: e.target.checked }))} /></div>
              </div>
            </div>
            <div className="form-group"><label>Address</label><textarea rows="2" value={formData.address} onChange={(e) => setFormData(p => ({ ...p, address: e.target.value }))}></textarea></div>
            <div className="form-group"><label>Notes</label><textarea rows="2" value={formData.notes} onChange={(e) => setFormData(p => ({ ...p, notes: e.target.value }))}></textarea></div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> Ruaj</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// --- Records View (DataTable CRUD) ---
function RecordsView({ user, role, setActiveMenu }) {
  const nav = useAppNav();
  const [qSearch, setQSearch] = useState('');
  const [showModal, setShowModal] = useState(false);
  /* open-create:records */
  useEffect(() => {
    if (nav && nav.consumeCreate && nav.consumeCreate('records')) {
      setEditingId(null); setShowModal(true);
    }
  }, []);

  const [editingId, setEditingId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [filters, setFilters] = useState({ dateFrom: '', dateTo: '', active: '', addedBy: '', customerType: '' });
  const [load, setLoad] = useState('');
  const tableInstanceRef = useRef(null);
  useDtLiveSearch(tableInstanceRef, qSearch);
  const searchFnRef = useRef(null); // our own global-search predicate - removed by identity, never blind-pop another view's
  const [viewCust, setViewCust] = useState(null);

  const { loading, data, err } = useFetch(() => fbGetRecords(), [reloadKey]);
  const records = useMemo(() => (data && data.success ? data.data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);
  window.refreshRecords = reload;

  const byId = useMemo(() => records.reduce((m, r) => (m[r.id] = r, m), {}), [records]);
  const uniqueUsers = useMemo(() => [...new Set(records.map(r => r.addedBy).filter(Boolean))], [records]);
  const openEdit = useCallback((id) => { setEditingId(id); setShowModal(true); }, []);

  useEffect(() => {
    if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load records' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(records).draw(false);
    } else {
      table = $('#recordsTable').DataTable({
        data: records,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (!d.active) $(row).addClass('row-muted'); }, // inactive customers dimmed
        columns: [
          { data: 'id', title: 'ID', render: (d, t) => t === 'display' ? d.slice(-6).toUpperCase() : d },
          { data: 'name', title: 'Emri', render: (d, t, row) => t === 'display' ? esc(d) + (row.company ? `<div class="cell-sub">${esc(row.company)}</div>` : '') : d },
          { data: 'phone', title: 'Telefoni', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'customerType', title: 'Tipi', render: (d, t) => t === 'display' ? '<span class="type-chip">' + esc(d || 'Retail') + '</span>' : d },
          { data: 'category', title: 'Grupi', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'amount', title: 'Balanca', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'active', title: 'Aktiv', render: (d, t, row) => t === 'display' ? `<input type="checkbox" ${d ? 'checked' : ''} class="toggle" onchange="toggleActive('${row.id}', this.checked ? 1 : 0)">` : d },
          { data: 'createdAt', title: 'Krijuar', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
          { data: null, title: 'Veprime', orderable: false, render: () => actionBtn('view', 'fa-eye', 'Shiko') + actionBtn('edit', 'fa-edit', 'Ndrysho', 'edit') + (role === 'Admin' ? actionBtn('delete', 'fa-trash', 'Fshi', 'delete') : '') }
        ],
        pageLength: 80,
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: erpDtButtons('Klientët'),
        order: [[7, 'desc']]
      });
      tableInstanceRef.current = table;
    }
    $('#recordsTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      const rowData = getDtRowData(table, this);
      if (!rowData || !rowData.id) return;
      const id = rowData.id;
      const act = $(this).data('action');
      if (act === 'view') setViewCust(byId[id] || rowData);
      else if (act === 'edit') openEdit(id);
      else handleDelete(byId[id] || rowData);
    });
  }, [loading, records, role]);

  useEffect(() => () => {
    const ext = $.fn.dataTable.ext.search;
    const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1); // stop the filter leaking into other views' tables
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  const applyFilters = () => {
    if (!tableInstanceRef.current) return;
    const dt = tableInstanceRef.current;
    const ext = $.fn.dataTable.ext.search;
    const prev = ext.indexOf(searchFnRef.current); if (prev !== -1) ext.splice(prev, 1); // replace our own predicate only
    const fn = (settings, dataRow, dataIndex) => {
      const rec = records[dataIndex];
      if (!rec) return true;
      const created = new Date(rec.createdAt);
      const from = filters.dateFrom ? new Date(filters.dateFrom) : null;
      const to = filters.dateTo ? new Date(filters.dateTo + 'T23:59:59') : null;
      if (from && created < from) return false;
      if (to && created > to) return false;
      if (filters.active !== '' && Boolean(rec.active) !== (filters.active === '1')) return false;
      if (filters.addedBy && rec.addedBy !== filters.addedBy) return false;
      if (filters.customerType && (rec.customerType || 'Retail') !== filters.customerType) return false;
      return true;
    };
    searchFnRef.current = fn; ext.push(fn);
    dt.draw();
  };

  const clearFilters = () => {
    setFilters({ dateFrom: '', dateTo: '', active: '', addedBy: '', customerType: '' });
    const ext = $.fn.dataTable.ext.search;
    const i = ext.indexOf(searchFnRef.current); if (i !== -1) ext.splice(i, 1);
    searchFnRef.current = null;
    if (tableInstanceRef.current) tableInstanceRef.current.draw();
  };

  useEffect(() => { if (tableInstanceRef.current && records.length > 0) applyFilters(); }, [filters, records]);

  const handleSave = async (formData) => {
    setLoad(editingId ? 'Updating record...' : 'Saving record...');
    const result = editingId ? await fbUpdateRecord(editingId, formData, user) : await fbAddRecord(formData, user);
    setLoad('');
    if (result.success) {
      setShowModal(false); setEditingId(null);
      Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
      reload();
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: result.message });
    }
  };

  const handleDelete = (record) => {
    Swal.fire({ icon: 'warning', title: 'Delete?', text: 'This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
      if (!result.isConfirmed) return;
      setLoad('Deleting record...');
      const r = await fbDeleteRecord(record.id, record.name, user);
      setLoad('');
      if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
      else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
    });
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-address-book"></i> Klientët</h2>
        <div style={{ display: 'flex', gap: '10px' }}><RefreshBtn onClick={reload} /><button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> I ri</button></div>
      </div>
      {!loading && (
        <div className="filters-section">
          <div className="filters-header">
            <h3><i className="fas fa-filter"></i> Filtrat & Kërkimi</h3>
            <button className="btn btn-secondary btn-sm" onClick={() => { clearFilters(); setQSearch(''); }}><i className="fas fa-times-circle"></i> Pastro të gjitha</button>
          </div>
          <div className="o-cp-tools" style={{ paddingLeft: 0, paddingRight: 0, borderBottom: 'none' }}>
            <OdooSearchFacets
              value={qSearch}
              onChange={setQSearch}
              placeholder="Kërko klient… emër, telefon, kompani, tip…"
              facets={[
                filters.customerType ? { id: 'type', label: 'Tipi', value: filters.customerType } : null,
                filters.active !== '' ? { id: 'active', label: 'Aktiv', value: filters.active === '1' ? 'Po' : 'Jo' } : null,
                filters.addedBy ? { id: 'by', label: 'Shtuar nga', value: filters.addedBy } : null,
                qSearch ? { id: 'q', label: 'Kërkim', value: qSearch } : null
              ].filter(Boolean)}
              onRemoveFacet={(f) => {
                if (f.id === 'type') setFilters(x => ({ ...x, customerType: '' }));
                if (f.id === 'active') setFilters(x => ({ ...x, active: '' }));
                if (f.id === 'by') setFilters(x => ({ ...x, addedBy: '' }));
                if (f.id === 'q') setQSearch('');
              }}
              filterChips={[
                { id: 'Retail', label: 'Retail', active: filters.customerType === 'Retail' },
                { id: 'Wholesale', label: 'Wholesale', active: filters.customerType === 'Wholesale' },
                { id: 'VIP', label: 'VIP', active: filters.customerType === 'VIP' },
                { id: 'act1', label: 'Aktivë', active: filters.active === '1' },
                { id: 'act0', label: 'Jo aktivë', active: filters.active === '0' }
              ]}
              onToggleChip={(c) => {
                if (c.id === 'act1') setFilters(x => ({ ...x, active: x.active === '1' ? '' : '1' }));
                else if (c.id === 'act0') setFilters(x => ({ ...x, active: x.active === '0' ? '' : '0' }));
                else setFilters(x => ({ ...x, customerType: x.customerType === c.id ? '' : c.id }));
              }}
            />
          </div>
          <div className="filters-grid">
            <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date From</label><input type="date" className="filter-input" value={filters.dateFrom} onChange={(e) => setFilters(f => ({ ...f, dateFrom: e.target.value }))} /></div>
            <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date To</label><input type="date" className="filter-input" value={filters.dateTo} onChange={(e) => setFilters(f => ({ ...f, dateTo: e.target.value }))} /></div>
            <SearchableDropdown label="Active" icon="fas fa-check-circle" options={ACTIVE_OPTS} value={filters.active} onChange={(val) => setFilters(f => ({ ...f, active: val }))} placeholder="Të gjithë klientët" />
            <SearchableDropdown label="Customer Type" icon="fas fa-user-group" options={CUSTOMER_TYPE_OPTS} value={filters.customerType} onChange={(val) => setFilters(f => ({ ...f, customerType: val }))} placeholder="Të gjitha tipet" />
            <SearchableDropdown label="Added By" icon="fas fa-user" options={uniqueUsers.map(u => ({ value: u, label: u }))} value={filters.addedBy} onChange={(val) => setFilters(f => ({ ...f, addedBy: val }))} placeholder="Të gjithë përdoruesit" />
          </div>
        </div>
      )}
      {loading && <TableSkeleton rows={8} columns={8} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <table id="recordsTable" className="display" style={{ width: '100%' }}></table>
        {records.length > 0 && <FilteredSummaryBar tableRef={tableInstanceRef} deps={[records, filters, qSearch]} itemsBuilder={(rows) => [
          { label: 'Të filtruar', value: rows.length },
          { label: 'Aktivë', value: rows.filter(r => r.active).length },
          { label: 'Balanca (filtruar)', value: money(rows.reduce((s, r) => s + Number(r.amount || 0), 0)) }
        ]} />}
      </div>
      {viewCust && <CustomerHubModal customer={viewCust} onClose={() => setViewCust(null)} />}
      {showModal && <RecordModal record={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}

// --- Product Modal (Add/Edit) ---
function ProductModal({ product, onClose, onSave }) {
  const catOpts = useCategoryOpts();
  const unitNameOpts = useUnitNameOpts();
  const { settings, refreshConfig } = useConfig();
  const [formData, setFormData] = useState({
    name: product?.name || (function(){ try { const n=localStorage.getItem('erp_new_product_name'); if(n){ localStorage.removeItem('erp_new_product_name'); return n; } } catch(e) {} return ''; })(), category: product?.category || '', price: product?.price ?? '',
    cost: product?.cost ?? '', reorderLevel: product?.reorderLevel ?? '', unit: product?.unit || 'copë',
    unit2Name: product?.unit2Name ?? 'koli', unit2Coef: product?.unit2Coef ?? '12', unit2Price: product?.unit2Price ?? '',
    unit3Name: product?.unit3Name ?? 'paletë', unit3Coef: product?.unit3Coef ?? '1368', unit3Price: product?.unit3Price ?? '',
    barcode: product?.barcode || '', brand: product?.brand || '', supplier: product?.supplier || '',
    taxRate: product?.taxRate ?? '', status: product?.status || 'active',
    wholesalePrice: product?.wholesalePrice ?? '', mrp: product?.mrp ?? '',
    maxStock: product?.maxStock ?? '', reorderQty: product?.reorderQty ?? '',
    location: product?.location || '', batchNo: product?.batchNo || '', expiryDate: product?.expiryDate || '',
    imageUrl: product?.imageUrl || '', description: product?.description || ''
  });
  const [saving, setSaving] = useState(false);
  const num = (v) => Number(v) || 0;
  const basePricePreview = num(formData.price);
  const unit2CoefPreview = num(formData.unit2Coef);
  const unit3CoefPreview = num(formData.unit3Coef);
  const autoUnit2Price = unit2CoefPreview > 1 ? round2(basePricePreview * unit2CoefPreview) : 0;
  const autoUnit3Price = unit3CoefPreview > 1 ? round2(basePricePreview * unit3CoefPreview) : 0;
  const finalUnit2Price = num(formData.unit2Price) > 0 ? num(formData.unit2Price) : autoUnit2Price;
  const finalUnit3Price = num(formData.unit3Price) > 0 ? num(formData.unit3Price) : autoUnit3Price;

  const submit = async (e) => {
    e.preventDefault();
    setSaving(true);
    const unit2Coef = num(formData.unit2Coef);
    const unit3Coef = num(formData.unit3Coef);
    if (!String(formData.name || '').trim()) { setSaving(false); return Swal.fire({ icon: 'warning', title: 'Emri mungon', text: 'Vendos emrin e artikullit.' }); }
    if (String(formData.unit2Name || '').trim() && unit2Coef <= 1) { setSaving(false); return Swal.fire({ icon: 'warning', title: 'Koeficient i pasaktë', text: 'Njësia 2 duhet të ketë koeficient më të madh se 1.' }); }
    if (String(formData.unit3Name || '').trim() && unit3Coef <= 1) { setSaving(false); return Swal.fire({ icon: 'warning', title: 'Koeficient i pasaktë', text: 'Njësia 3 duhet të ketë koeficient më të madh se 1.' }); }
    const names = [formData.unit, formData.unit2Name, formData.unit3Name].map(x => String(x || '').trim().toLowerCase()).filter(Boolean);
    if (new Set(names).size !== names.length) { setSaving(false); return Swal.fire({ icon: 'warning', title: 'Njësi të përsëritura', text: 'Njësia bazë, Njësia 2 dhe Njësia 3 nuk duhet të kenë të njëjtin emër.' }); }
    // blank tax rate -> null so POS inherits the store default; explicit 0 stays 0 (tax-exempt)
    await onSave({
      ...formData,
      unit: String(formData.unit || 'copë').trim() || 'copë',
      unit2Name: String(formData.unit2Name || '').trim(), unit2Coef: unit2Coef, unit2Price: num(formData.unit2Price),
      unit3Name: String(formData.unit3Name || '').trim(), unit3Coef: unit3Coef, unit3Price: num(formData.unit3Price),
      price: num(formData.price), cost: num(formData.cost), reorderLevel: num(formData.reorderLevel),
      taxRate: formData.taxRate === '' ? null : num(formData.taxRate), wholesalePrice: num(formData.wholesalePrice), mrp: num(formData.mrp),
      maxStock: num(formData.maxStock), reorderQty: num(formData.reorderQty),
      status: formData.status || 'active'
    });
    setSaving(false); // re-enable on failed save (parent keeps modal open)
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-box"></i> {product ? 'Ndrysho Artikullin' : 'Krijo'}</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <form onSubmit={submit}>
            <div className="form-group">
              <label><i className="fas fa-barcode"></i> Kodi / SKU</label>
              <input type="text" value={product ? product.sku : 'Gjenerohet automatikisht kur ruhet'} disabled />
            </div>
            {formData.imageUrl ? <div className="prod-img-preview"><img src={formData.imageUrl} alt="" onError={(e) => { e.target.style.display = 'none'; }} /></div> : null}
            <div className="form-grid">
              <div className="product-modal-section-title">Të dhënat kryesore</div>
              <div className="form-group"><label>Emri i artikullit *</label><input type="text" value={formData.name} onChange={(e) => setFormData(p => ({ ...p, name: e.target.value }))} required /></div>
              <SearchableDropdown label="Kategoria" icon="fas fa-tag" options={catOpts} value={formData.category} onChange={(val) => setFormData(p => ({ ...p, category: val }))} placeholder="Zgjidh kategorinë..." required={true}
                creatable={true} createLabel="Shto kategori: {q}" onCreate={async (q) => {
                  let u = null; try { u = JSON.parse(localStorage.getItem('fb_user')||'null'); } catch(e) {}
                  const res = await fbAddCategory(q, u || { email: 'system', name: 'System' });
                  if (!res.success) throw new Error(res.message || 'Dështoi');
                  try { if (refreshConfig) refreshConfig(); } catch (e) {}
                  return { value: q, label: q };
                }} />
              <div className="form-group"><label>Marka</label><input type="text" value={formData.brand} onChange={(e) => setFormData(p => ({ ...p, brand: e.target.value }))} /></div>
              <div className="form-group"><label><i className="fas fa-barcode"></i> Barkodi (UPC/EAN)</label><input type="text" placeholder="Skano ose shkruaj barkodin" value={formData.barcode} onChange={(e) => setFormData(p => ({ ...p, barcode: e.target.value }))} /></div>
              <div className="product-modal-section-title">Çmime dhe taksa</div>
              <div className="form-group"><label>Çmimi shitjes për njësi bazë *</label><input type="number" step="0.01" min="0" value={formData.price} onChange={(e) => setFormData(p => ({ ...p, price: e.target.value }))} required /></div>
              <div className="form-group"><label>Kosto për njësi bazë</label><input type="number" step="0.01" min="0" value={formData.cost} onChange={(e) => setFormData(p => ({ ...p, cost: e.target.value }))} /></div>
              <div className="form-group"><label>Çmimi shumicë</label><input type="number" step="0.01" min="0" value={formData.wholesalePrice} onChange={(e) => setFormData(p => ({ ...p, wholesalePrice: e.target.value }))} /></div>
              <div className="form-group"><label>Çmimi listë / MRP</label><input type="number" step="0.01" min="0" value={formData.mrp} onChange={(e) => setFormData(p => ({ ...p, mrp: e.target.value }))} /></div>
              <div className="form-group"><label>TVSH % {settings?.taxRate ? `(default ${settings.taxRate}%)` : ''}</label><input type="number" step="0.01" min="0" placeholder="bosh = përdor default" value={formData.taxRate} onChange={(e) => setFormData(p => ({ ...p, taxRate: e.target.value }))} /></div>
              <div className="product-modal-section-title">Njësitë konvertuese</div>
              <SearchableDropdown label="Njësia bazë / stoku" icon="fas fa-scale-balanced" options={unitNameOpts} value={formData.unit} onChange={(val) => setFormData(p => ({ ...p, unit: val || 'copë' }))} placeholder="copë"
                creatable={true} createLabel="Shto njësi: {q}" onCreate={async (q) => {
                  const res = await ieQuickAddSettingList('customUnits', q, JSON.parse(localStorage.getItem('fb_user')||'null'));
                  if (!res.success) throw new Error(res.message||'Dështoi');
                  try { refreshConfig && refreshConfig(); } catch(e) {}
                  return { value: q, label: q };
                }} />
              <div className="form-group"><label>Njësia 2</label><input type="text" placeholder="koli" value={formData.unit2Name} onChange={(e) => setFormData(p => ({ ...p, unit2Name: e.target.value }))} /></div>
              <div className="form-group"><label>Koeficienti Njësia 2</label><input type="number" step="0.01" min="0" placeholder="12 = 1 koli ka 12 copë" value={formData.unit2Coef} onChange={(e) => setFormData(p => ({ ...p, unit2Coef: e.target.value }))} /></div>
              <div className="form-group"><label>Çmimi Njësia 2</label><input type="number" step="0.01" min="0" placeholder={autoUnit2Price ? `auto ${money(autoUnit2Price)}` : 'auto nga çmimi bazë'} value={formData.unit2Price} onChange={(e) => setFormData(p => ({ ...p, unit2Price: e.target.value }))} /><div className="unit-price-preview">Në shitje: {formData.unit2Name || 'Njësia 2'} = {money(finalUnit2Price || 0)}</div></div>
              <div className="form-group"><label>Njësia 3</label><input type="text" placeholder="paletë" value={formData.unit3Name} onChange={(e) => setFormData(p => ({ ...p, unit3Name: e.target.value }))} /></div>
              <div className="form-group"><label>Koeficienti Njësia 3</label><input type="number" step="0.01" min="0" placeholder="1368 = 1 paletë ka 1368 copë" value={formData.unit3Coef} onChange={(e) => setFormData(p => ({ ...p, unit3Coef: e.target.value }))} /></div>
              <div className="form-group"><label>Çmimi Njësia 3</label><input type="number" step="0.01" min="0" placeholder={autoUnit3Price ? `auto ${money(autoUnit3Price)}` : 'auto nga çmimi bazë'} value={formData.unit3Price} onChange={(e) => setFormData(p => ({ ...p, unit3Price: e.target.value }))} /><div className="unit-price-preview">Në shitje: {formData.unit3Name || 'Njësia 3'} = {money(finalUnit3Price || 0)}</div></div>
              <div className="product-modal-section-title">Stoku dhe magazina</div>
              <div className="form-group"><label>Minimumi furnizimit *</label><input type="number" step="1" min="0" value={formData.reorderLevel} onChange={(e) => setFormData(p => ({ ...p, reorderLevel: e.target.value }))} required /></div>
              <div className="form-group"><label>Stoku maksimal</label><input type="number" step="1" min="0" value={formData.maxStock} onChange={(e) => setFormData(p => ({ ...p, maxStock: e.target.value }))} /></div>
              <div className="form-group"><label>Sasia për furnizim</label><input type="number" step="1" min="0" placeholder="sasia fikse që do porositet" value={formData.reorderQty} onChange={(e) => setFormData(p => ({ ...p, reorderQty: e.target.value }))} /></div>
              <div className="form-group"><label>Furnitori</label><input type="text" value={formData.supplier} onChange={(e) => setFormData(p => ({ ...p, supplier: e.target.value }))} /></div>
              <div className="form-group"><label><i className="fas fa-location-dot"></i> Vendndodhja / Rafti</label><input type="text" placeholder="Raft-Sektor-Kuti" value={formData.location} onChange={(e) => setFormData(p => ({ ...p, location: e.target.value }))} /></div>
              <div className="form-group"><label>Partia / Lot No</label><input type="text" value={formData.batchNo} onChange={(e) => setFormData(p => ({ ...p, batchNo: e.target.value }))} /></div>
              <div className="form-group"><label><i className="fas fa-calendar-xmark"></i> Data skadencës</label><input type="date" value={formData.expiryDate} onChange={(e) => setFormData(p => ({ ...p, expiryDate: e.target.value }))} /></div>
              <SearchableDropdown label="Statusi" icon="fas fa-toggle-on" options={STATUS_OPTS} value={formData.status} onChange={(val) => setFormData(p => ({ ...p, status: val }))} placeholder="Aktiv" />
            </div>
            <div className="unit-logic-box"><strong>Rregull:</strong> stoku ruhet gjithmonë në njësinë bazë. Shembull: 1 koli = 12 copë; 1 paletë = 1368 copë. Në shitje/hyrje/dalje mund të zgjedhësh koli ose paletë dhe sistemi e kthen automatikisht në copë.</div>
            <div className="form-group"><label><i className="fas fa-image"></i> URL Foto</label><input type="text" placeholder="https://..." value={formData.imageUrl} onChange={(e) => setFormData(p => ({ ...p, imageUrl: e.target.value }))} /></div>
            <div className="form-group"><label>Përshkrimi</label><textarea rows="2" value={formData.description} onChange={(e) => setFormData(p => ({ ...p, description: e.target.value }))}></textarea></div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> Ruaj</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// --- QR Modal (single product view) ---
function QRModal({ product, onClose }) {
  const previewRef = useRef(null);
  const printRef = useRef(null);

  useEffect(() => {
    if (!product) return;
    QRCode.toCanvas(previewRef.current, product.id, { width: 220, margin: 1, color: { dark: '#001f3f', light: '#ffffff' } }, () => {});
    QRCode.toCanvas(printRef.current, product.id, { width: 300, margin: 0 }, () => {});
  }, [product]);

  if (!product) return null;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: '380px' }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3><i className="fas fa-qrcode"></i> Product QR Code</h3>
          <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body" style={{ textAlign: 'center' }}>
          <canvas ref={previewRef}></canvas>
          <p style={{ marginTop: '14px', fontWeight: 700, color: 'var(--navy-primary)', fontSize: '16px', letterSpacing: '.5px' }}>{product.sku}</p>
          <p style={{ color: '#999', fontSize: '13px', marginTop: '4px' }}>{product.name}</p>
          <div className="form-actions" style={{ justifyContent: 'center', marginTop: '24px' }}>
            <button className="btn btn-primary" onClick={() => window.print()}><i className="fas fa-print"></i> Print Label</button>
            <button className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Close</button>
          </div>
        </div>
        {/* print-only mirror, hidden on screen, shown via .qr-label-print in @media print */}
        <div className="qr-print-stage">
          <div className="qr-label-print">
            <canvas ref={printRef}></canvas>
            <div className="qr-label-sku">{product.sku}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- Bulk QR label printing ---
function PrintAllLabels({ products, onDone }) {
  const canvasRefs = useRef({});

  useEffect(() => {
    let cancelled = false;
    Promise.all(products.map(p => QRCode.toCanvas(canvasRefs.current[p.id], p.id, { width: 300, margin: 0 })))
      .then(() => { if (!cancelled) window.print(); })
      .catch((e) => console.error('qr render failed', e));
    return () => { cancelled = true; };
  }, [products]);

  useEffect(() => {
    const afterPrint = () => onDone();
    window.addEventListener('afterprint', afterPrint);
    return () => window.removeEventListener('afterprint', afterPrint);
  }, [onDone]);

  return (
    <div className="qr-print-stage">
      {products.map(p => (
        <div className="qr-label-print" key={p.id}>
          <canvas ref={(el) => { canvasRefs.current[p.id] = el; }}></canvas>
          <div className="qr-label-sku">{p.sku}</div>
        </div>
      ))}
    </div>
  );
}

// --- Reorder report (print only - lists everything at/below reorder level) ---
