// --- Users View// --- Users View (Admin only - manages the /users login collection) ---
function UsersView({ user, role }) {
  const [qSearch, setQSearch] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableInstanceRef = useRef(null);
  useDtLiveSearch(tableInstanceRef, qSearch);

  const { loading, data, err } = useFetch(() => fbGetUsers(), [reloadKey]);
  const [viewUser, setViewUser] = useState(null);
  const users = useMemo(() => (data && data.success ? data.data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);
  const byId = useMemo(() => users.reduce((m, u) => (m[u.id] = u, m), {}), [users]);
  const adminCount = useMemo(() => users.filter(u => u.role === 'Admin').length, [users]);
  const openEdit = useCallback((id) => { setEditingId(id); setShowModal(true); }, []);

  useEffect(() => {
    if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load users' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(users).draw(false);
    } else {
      table = $('#usersTable').DataTable({
        data: users,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        columns: [
          { data: 'name', title: 'Emri', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'email', title: 'Email', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'role', title: 'Roli', render: (d, t) => t === 'display' ? '<span class="role-badge ' + (d === 'Admin' ? 'role-admin' : (d === 'Manager' ? 'role-admin' : 'role-emp')) + '">' + esc(d || 'User') + '</span>' : d },
          { data: null, title: 'Veprime', orderable: false, render: () => actionBtn('view', 'fa-eye', 'Shiko') + actionBtn('edit', 'fa-edit', 'Ndrysho', 'edit') + actionBtn('delete', 'fa-trash', 'Fshi', 'delete') }
        ],
        pageLength: 80,
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: erpDtButtons('Përdoruesit'),
        order: [[0, 'asc']]
      });
      tableInstanceRef.current = table;
    }
    $('#usersTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      const rowData = getDtRowData(table, this);
      if (!rowData || !rowData.id) return;
      const id = rowData.id;
      const act = $(this).data('action');
      if (act === 'view') setViewUser(byId[id] || rowData);
      else if (act === 'edit') openEdit(id);
      else handleDelete(byId[id] || rowData);
    });
  }, [loading, users]);

  useEffect(() => () => {
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  const handleSave = async (formData) => {
    if (role !== 'Admin' && !mergeUserRights(user).users) {
      Swal.fire({ icon: 'error', title: 'Pa të drejtë', text: 'Vetëm Admin (ose me të drejtën Përdoruesit) mund të shtojë/ndryshojë llogari.' });
      return;
    }
    setLoad(editingId ? 'Duke përditësuar...' : 'Duke ruajtur përdoruesin...');
    try {
      const result = editingId ? await fbUpdateUser(editingId, formData, user) : await fbAddUser(formData, user);
      setLoad('');
      if (result && result.success) {
        setShowModal(false); setEditingId(null);
        Swal.fire({ icon: 'success', title: 'U ruajt!', text: result.message, timer: 1800, showConfirmButton: false });
        reload();
      } else {
        Swal.fire({ icon: 'error', title: 'Nuk u ruajt', text: (result && result.message) || 'Gabim i panjohur' });
      }
    } catch (e) {
      setLoad('');
      Swal.fire({ icon: 'error', title: 'Gabim', text: String(e && e.message || e) });
    }
  };

  const handleDelete = (u) => {
    if (u.id === user.id || u.email === user.email) return Swal.fire({ icon: 'warning', title: 'Not Allowed', text: 'You cannot delete your own account while logged in.' });
    if (u.role === 'Admin' && adminCount <= 1) return Swal.fire({ icon: 'warning', title: 'Not Allowed', text: 'At least one Admin account must remain.' });
    Swal.fire({ icon: 'warning', title: 'Delete?', text: 'This cannot be undone', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (result) => {
      if (!result.isConfirmed) return;
      setLoad('Deleting user...');
      const r = await fbDeleteUser(u.id, u.name, user);
      setLoad('');
      if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); reload(); }
      else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
    });
  };

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-users-cog"></i> Përdoruesit</h2>
        <div style={{ display: 'flex', gap: '10px' }}><RefreshBtn onClick={reload} /><button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> Shto përdorues</button></div>
      </div>
      {loading && <TableSkeleton rows={5} columns={4} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <div className="module-toolbar"><GoogleSearchBox value={qSearch} onChange={setQSearch} placeholder="Kërko përdorues… emër, email, rol…" /></div>
        <table id="usersTable" className="display" style={{ width: '100%' }}></table>
        <FilteredSummaryBar tableRef={tableInstanceRef} deps={[users, qSearch]} itemsBuilder={(rows) => [
          { label: 'Përdorues (filtruar)', value: rows.length },
          { label: 'Admin', value: rows.filter(r => r.role === 'Admin').length }
        ]} />
      </div>
      {viewUser && <UserHubModal account={viewUser} onClose={() => setViewUser(null)} />}
      {showModal && <UserModal editUser={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}

function ieCsvEscape(v) {
  const s = String(v == null ? '' : v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function ieDownloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function ieParseCsv(text) {
  const rows = [];
  let i = 0, field = '', row = [], inQ = false;
  const s = String(text || '').replace(/^\uFEFF/, '');
  while (i < s.length) {
    const ch = s[i];
    if (inQ) {
      if (ch === '"') {
        if (s[i+1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"') { inQ = true; i++; continue; }
    if (ch === ',') { row.push(field); field = ''; i++; continue; }
    if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && s[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(c => String(c).trim() !== '')) rows.push(row);
      row = []; i++; continue;
    }
    field += ch; i++;
  }
  row.push(field);
  if (row.some(c => String(c).trim() !== '')) rows.push(row);
  if (!rows.length) return { headers: [], rows: [] };
  const headers = rows[0].map(h => String(h || '').trim());
  const data = rows.slice(1).map(r => {
    const o = {};
    headers.forEach((h, idx) => { o[h] = r[idx] != null ? String(r[idx]).trim() : ''; });
    return o;
  });
  return { headers, rows: data };
}

async function ieParseXlsx(arrayBuffer) {
  if (!window.JSZip) throw new Error('JSZip nuk u ngarkua');
  const zip = await JSZip.loadAsync(arrayBuffer);
  // shared strings
  const shared = [];
  const ssFile = zip.file('xl/sharedStrings.xml');
  if (ssFile) {
    const ss = await ssFile.async('string');
    const siRe = /<si>([\s\S]*?)<\/si>/g;
    let m;
    while ((m = siRe.exec(ss))) {
      const texts = [];
      const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
      let tm;
      while ((tm = tRe.exec(m[1]))) texts.push(tm[1]);
      let t = texts.length ? texts.join('') : m[1].replace(/<[^>]+>/g, '');
      t = t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
      shared.push(t);
    }
  }
  // worksheet
  const sheetName = Object.keys(zip.files).sort().find(function(n) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); });
  if (!sheetName) throw new Error('Nuk u gjet worksheet në Excel');
  const xml = await zip.file(sheetName).async('string');
  // Parse cells: <c r="A1" t="s"><v>0</v></c>
  const cellRe = /<c([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  const gridMap = {}; // row -> {col: val}
  let cm;
  function colLettersToIndex(letters) {
    let n = 0;
    for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
    return n - 1;
  }
  while ((cm = cellRe.exec(xml))) {
    const attrs = cm[1] || '';
    const body = cm[2] || '';
    const refM = attrs.match(/\br="([A-Z]+)(\d+)"/i);
    if (!refM) continue;
    const col = colLettersToIndex(refM[1].toUpperCase());
    const row = Number(refM[2]) - 1;
    const t = ((attrs.match(/\bt="([^"]+)"/) || [])[1]) || '';
    let val = '';
    const vM = body.match(/<v[^>]*>([\s\S]*?)<\/v>/);
    const isM = body.match(/<t[^>]*>([\s\S]*?)<\/t>/);
    if (vM) val = vM[1];
    else if (isM) val = isM[1];
    if (t === 's') val = shared[Number(val)] != null ? shared[Number(val)] : '';
    if (t === 'inlineStr' && !val) {
      const t2 = body.match(/<t[^>]*>([\s\S]*?)<\/t>/);
      if (t2) val = t2[1];
    }
    val = String(val == null ? '' : val).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').trim();
    if (!gridMap[row]) gridMap[row] = {};
    gridMap[row][col] = val;
  }
  const rowIdxs = Object.keys(gridMap).map(Number).sort(function(a,b){return a-b;});
  if (!rowIdxs.length) return { headers: [], rows: [] };
  const grid = rowIdxs.map(function(r) {
    const cols = gridMap[r];
    const maxC = Math.max.apply(null, Object.keys(cols).map(Number));
    const arr = [];
    for (let c = 0; c <= maxC; c++) arr.push(cols[c] != null ? cols[c] : '');
    return arr;
  }).filter(function(arr) { return arr.some(function(x){ return String(x).trim() !== ''; }); });

  if (!grid.length) return { headers: [], rows: [] };

  // known header tokens
  const known = {};
  try {
    Object.keys(IE_TEMPLATES).forEach(function(k) {
      const tpl = IE_TEMPLATES[k];
      (tpl.headers || []).forEach(function(h) {
        known[String(h).toLowerCase().replace(/\*/g,'').trim()] = 1;
      });
      (tpl.columns || []).forEach(function(h) {
        known[String(h).toLowerCase().trim()] = 1;
      });
    });
  } catch (e) {}
  ['emri','name','sku','data','date','tipi','type','sasia','qty','shuma','amount','artikulli','klienti','furnitori','telefoni','phone','email','cmimi','çmimi','kosto','balanca','pagesa','statusi'].forEach(function(k){ known[k]=1; });

  function scoreHeader(row) {
    let s = 0;
    (row || []).forEach(function(cell) {
      const n = String(cell || '').toLowerCase().replace(/\*/g,'').trim();
      if (!n) return;
      if (known[n]) s += 3;
      if (n.indexOf('emri') >= 0 || n.indexOf('name') >= 0 || n.indexOf('sku') >= 0 || n.indexOf('sasia') >= 0) s += 2;
      if (/template|sistemi|gjeneruar|filtrat|rreshta|format|lloj:/.test(n)) s -= 6;
    });
    const filled = (row || []).filter(function(c){ return String(c||'').trim() !== ''; }).length;
    if (filled >= 3) s += 2;
    if (filled >= 6) s += 2;
    return s;
  }

  let headerIdx = 0, best = -999;
  for (let r = 0; r < Math.min(grid.length, 40); r++) {
    const sc = scoreHeader(grid[r]);
    if (sc > best) { best = sc; headerIdx = r; }
  }
  if (best < 2) {
    let maxLen = 0;
    grid.forEach(function(r, idx) { if (r.length > maxLen) { maxLen = r.length; headerIdx = idx; } });
  }

  const headers = grid[headerIdx].map(function(h) { return String(h || '').trim(); });
  const rows = [];
  for (let r = headerIdx + 1; r < grid.length; r++) {
    const line = grid[r];
    const joined = line.join(' ').toLowerCase().trim();
    if (/^(gjeneruar|filtrat|rreshta|sistemi genit|template_|lloj:|format:)/.test(joined)) continue;
    const o = {};
    let any = false;
    headers.forEach(function(h, idx) {
      if (!h) return;
      let v = line[idx] != null ? String(line[idx]).trim() : '';
      if (/e\+\d+$/i.test(v) && !isNaN(Number(v))) {
        try { v = String(Math.round(Number(v))); } catch (e) {}
      }
      o[h] = v;
      if (v) any = true;
    });
    if (any) rows.push(o);
  }
  return { headers: headers, rows: rows, headerRow: headerIdx + 1 };
}

function ieNormHeader(h) {
  return String(h == null ? '' : h).toLowerCase().replace(/\*/g, '').replace(/\s+/g, ' ').trim();
}

function ieMapRow(tpl, raw) {
  const o = {};
  const rawMap = {};
  Object.keys(raw || {}).forEach(function(k) { rawMap[ieNormHeader(k)] = raw[k]; });
  tpl.columns.forEach(function(col, i) {
    const h = tpl.headers[i];
    let v = raw[col];
    if (v == null || v === '') v = raw[h];
    if ((v == null || v === '') && h) v = raw[String(h).replace(/\*/g, '')];
    if ((v == null || v === '') && h) v = rawMap[ieNormHeader(h)];
    if ((v == null || v === '')) v = rawMap[ieNormHeader(col)];
    // aliases
    if ((v == null || v === '') && col === 'name') v = rawMap['emri'] || rawMap['klienti'] || rawMap['furnitori'] || rawMap['artikulli'];
    if ((v == null || v === '') && col === 'phone') v = rawMap['telefoni'] || rawMap['tel'];
    if ((v == null || v === '') && col === 'productName') v = rawMap['artikulli'] || rawMap['emri artikullit'] || rawMap['emri'];
    if ((v == null || v === '') && col === 'customerName') v = rawMap['klienti'] || rawMap['emri'];
    if ((v == null || v === '') && col === 'supplierName') v = rawMap['furnitori'] || rawMap['emri'];
    if ((v == null || v === '') && col === 'unitPrice') v = rawMap['cmimi'] || rawMap['çmimi'] || rawMap['cmimi*'] || rawMap['çmimi*'];
    if ((v == null || v === '') && col === 'unitCost') v = rawMap['kosto'] || rawMap['kosto*'];
    if ((v == null || v === '') && col === 'qty') v = rawMap['sasia'] || rawMap['sasia*'];
    if ((v == null || v === '') && col === 'amount') v = rawMap['shuma'] || rawMap['shuma*'] || rawMap['balanca'];
    if (typeof v === 'string' && /e\+\d+$/i.test(v) && !isNaN(Number(v))) {
      try { v = String(Math.round(Number(v))); } catch (e) {}
    }
    o[col] = v != null ? v : '';
  });
  return o;
}

/** Clean XLSX: ONLY header + data rows (no meta title rows) — critical for import templates */
async function ieBuildCleanXlsx(filename, sheetName, headers, rows) {
  if (!window.JSZip) throw new Error('JSZip nuk u ngarkua');
  const shared = [];
  const sharedIndex = Object.create(null);
  function ss(v) {
    const s = String(v == null ? '' : v);
    if (Object.prototype.hasOwnProperty.call(sharedIndex, s)) return sharedIndex[s];
    const i = shared.length; shared.push(s); sharedIndex[s] = i; return i;
  }
  function colName(n) { let s = '', x = n + 1; while (x > 0) { const m = (x - 1) % 26; s = String.fromCharCode(65 + m) + s; x = Math.floor((x - 1) / 26); } return s; }
  function escXml(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const all = [headers].concat((rows || []).map(function(r) {
    return headers.map(function(h) { return r[h] != null ? r[h] : ''; });
  }));
  const sheetRows = all.map(function(row, ri) {
    const cells = row.map(function(val, ci) {
      const ref = colName(ci) + (ri + 1);
      if (typeof val === 'number' && Number.isFinite(val)) return '<c r="' + ref + '"><v>' + val + '</v></c>';
      // force phones/long digits as text
      const s = String(val == null ? '' : val);
      if (/^\d{9,}$/.test(s)) return '<c r="' + ref + '" t="inlineStr"><is><t>' + escXml(s) + '</t></is></c>';
      return '<c r="' + ref + '" t="s"><v>' + ss(s) + '</v></c>';
    }).join('');
    return '<row r="' + (ri + 1) + '">' + cells + '</row>';
  }).join('');
  const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' + sheetRows + '</sheetData></worksheet>';
  const sst = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="' + shared.length + '" uniqueCount="' + shared.length + '">' +
    shared.map(function(s) { return '<si><t>' + escXml(s) + '</t></si>'; }).join('') + '</sst>';
  const safeSheet = String(sheetName || 'Data').replace(/[\\\/\?\*\[\]]/g, ' ').slice(0, 31) || 'Data';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  zip.folder('_rels').file('.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  zip.folder('xl').file('workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + escXml(safeSheet) + '" sheetId="1" r:id="rId1"/></sheets></workbook>');
  zip.folder('xl').folder('_rels').file('workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  zip.folder('xl').file('sharedStrings.xml', sst);
  zip.folder('xl').file('styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>');
  zip.folder('xl').folder('worksheets').file('sheet1.xml', sheetXml);
  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename.endsWith('.xlsx') ? filename : (filename + '.xlsx');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 2000);
  return true;
}

function ieTemplateCsv(tpl) {
  const lines = [tpl.headers.map(ieCsvEscape).join(',')];
  const sample = tpl.headers.map(function(h, i) {
    const c = tpl.columns[i];
    if (c === 'name' || c === 'productName' || c === 'party' || c === 'supplierName' || c === 'customerName') return 'Shembull';
    if (c === 'type') return 'in';
    if (c === 'qty' || c === 'amount' || c === 'unitPrice' || c === 'unitCost' || c === 'price') return '1';
    if (c === 'date') return new Date().toISOString().slice(0, 10);
    if (c === 'active') return '1';
    if (c === 'paymentMethod' || c === 'method') return 'Cash';
    if (c === 'status') return 'ordered';
    if (c === 'taxRate') return '20';
    if (c === 'phone') return '0691234567';
    return '';
  });
  lines.push(sample.map(ieCsvEscape).join(','));
  return lines.join('\n');
}

async function ieTemplateXlsx(tpl) {
  const headers = tpl.headers.slice();
  const sample = {};
  headers.forEach(function(h, i) {
    const c = tpl.columns[i];
    let v = '';
    if (c === 'name' || c === 'productName' || c === 'party' || c === 'supplierName' || c === 'customerName') v = 'Shembull';
    else if (c === 'type') v = 'in';
    else if (c === 'qty' || c === 'amount' || c === 'unitPrice' || c === 'unitCost' || c === 'price') v = 1;
    else if (c === 'date') v = new Date().toISOString().slice(0, 10);
    else if (c === 'active') v = 1;
    else if (c === 'paymentMethod' || c === 'method') v = 'Cash';
    else if (c === 'status') v = 'ordered';
    else if (c === 'taxRate') v = 20;
    else if (c === 'phone') v = '0691234567';
    sample[h] = v;
  });
  await ieBuildCleanXlsx('template_' + tpl.id + '.xlsx', tpl.label, headers, [sample]);
}

        const price = Number(r.unitPrice) || 0;
        const rate = r.taxRate === '' || r.taxRate == null ? Number(CFG.taxRate || 0) : Number(r.taxRate);
        const lineNet = round2(qty * price);
        const lineTax = round2(lineNet * rate / 100);
        subtotal += lineNet; tax += lineTax;
        items.push({
          productId: p ? p.id : null, name: r.productName || (p && p.name) || '', sku: r.sku || (p && p.sku) || '',
          qty: qty, displayQty: qty, freeDisplayQty: 0, freeQty: 0, unitKey: 'base', unitName: r.unitName || 'copë', unitMultiplier: 1,
          unitSalePrice: price, price: price, taxRate: rate, lineNet: lineNet, lineTax: lineTax, lineTotal: round2(lineNet + lineTax),
          cost: p ? Number(p.cost)||0 : 0, warehouse: p ? (p.location || 'Magazina Kryesore') : 'Magazina Kryesore'
        });
      }
      if (!items.length) continue;
      const discount = Number(head.discount) || 0;
      const total = round2(subtotal - discount + tax);
      // Use direct push to allow historical import without double stock if product missing
      try {
        const payload = {
          invoiceNo: head.invoiceNo || undefined,
          customerName: head.customerName || 'Walk-in',
          customerPhone: head.customerPhone || '',
          paymentMethod: head.paymentMethod || 'Cash',
          status: (head.paymentMethod === 'Credit' ? 'credit' : 'completed'),
          items: items, subtotal: subtotal, discount: discount, tax: tax, total: total,
          notes: head.notes || 'Import', cashier: user.name || user.email,
          createdAt: head.date ? new Date(head.date + 'T12:00:00').toISOString() : nowIso()
        };
        if (!payload.invoiceNo) {
          const inv = await fbGenerateInvoiceNo();
          payload.invoiceNo = inv.success ? inv.data : ('IMP-' + Date.now());
        }
        await db.ref('sales').push(payload);
        // stock out for known products
        for (let __j = 0; __j < items.length; __j++) { const it = items[__j];
          if (!it.productId) continue;
          await fbAddStockMovement({
            productId: it.productId, type: 'out', qty: it.qty, enteredQty: it.qty, unitKey: 'base', unitName: it.unitName,
            unitMultiplier: 1, reason: 'Sale', reference: payload.invoiceNo, warehouse: it.warehouse
          }, it.name, user);
        }
        ok++;
      } catch (e) { errors.push(e.message || 'Gabim shitje'); }
    }
  } else if (tpl.id === 'purchases') {
    const groups = {};
    mapped.forEach(r => {
      const key = [r.poNumber || '', r.date || '', r.supplierName || ''].join('|');
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    const pr = await fbGetProducts();
    const products = pr.data || [];
    const bySku = {};
    products.forEach(p => { if (p.sku) bySku[String(p.sku).toLowerCase()] = p; bySku[String(p.name||'').toLowerCase()] = p; });
    const sup = await fbGetSuppliers();
    const suppliers = sup.data || [];
    const __keys = Object.keys(groups); for (let __k = 0; __k < __keys.length; __k++) { const key = __keys[__k];
      const lines = groups[key];
      const head = lines[0];
      const supplier = suppliers.find(s => s.name === head.supplierName);
      const items = [];
      let total = 0;
      for (let __l = 0; __l < lines.length; __l++) { const r = lines[__l];
        const p = bySku[String(r.sku||'').toLowerCase()] || bySku[String(r.productName||'').toLowerCase()];
        const qty = Number(r.qty) || 0;
        const cost = Number(r.unitCost) || 0;
        const lineTotal = round2(qty * cost);
        total += lineTotal;
        items.push({
          productId: p ? p.id : null, name: r.productName || (p && p.name) || '', sku: r.sku || (p && p.sku) || '',
          qty: qty, enteredQty: qty, unitKey: 'base', unitName: r.unitName || 'copë', unitMultiplier: 1,
          unitCost: cost, enteredUnitCost: cost, lineTotal: lineTotal
        });
      }
      try {
        let poNumber = head.poNumber;
        if (!poNumber) {
          const g = await fbGeneratePoNumber();
          poNumber = g.success ? g.data : ('PO-' + Date.now());
        }
        await db.ref('purchase_orders').push({
          poNumber: poNumber, supplierId: supplier ? supplier.id : '', supplierName: head.supplierName,
          status: head.status || 'ordered', items: items, total: round2(total), notes: head.notes || 'Import',
          createdAt: head.date ? new Date(head.date + 'T12:00:00').toISOString() : nowIso(), createdBy: user.email
        });
        ok++;
      } catch (e) { errors.push(e.message || 'Gabim blerje'); }
    }
  } else if (tpl.id === 'payments') {
    for (let __i = 0; __i < mapped.length; __i++) { const r = mapped[__i];
      const type = String(r.type||'').toLowerCase() === 'out' ? 'out' : 'in';
      try {
        await db.ref('payments').push({
          date: r.date || nowIso().slice(0,10), type: type, party: r.party, amount: Number(r.amount)||0,
          method: r.method || r.paymentMethod || 'Cash', reference: r.reference || '', notes: r.notes || '',
          createdAt: nowIso(), addedBy: user.email
        });
        ok++;
      } catch (e) { errors.push(e.message || 'Gabim pagese'); }
    }
  } else if (tpl.id === 'expenses') {
    for (let __i = 0; __i < mapped.length; __i++) { const r = mapped[__i];
      const res = await fbAddExpense({
        date: r.date || nowIso().slice(0,10), category: r.category, payee: r.payee || '',
        amount: Number(r.amount)||0, paymentMethod: r.paymentMethod || 'Cash', notes: r.notes || ''
      }, user);
      if (res.success) ok++; else errors.push(res.message || 'Gabim shpenzimi');
    }
  }
  return { ok, errors, total: mapped.length };
}

function ImportExportView({ user, role }) {
  const [tab, setTab] = useState('import');
  const [entity, setEntity] = useState('customers');
  const [preview, setPreview] = useState({ headers: [], rows: [] });
  const [status, setStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const [restoreMode, setRestoreMode] = useState('merge');
  const fileRef = useRef(null);
  const backupRef = useRef(null);
  const tpl = IE_TEMPLATES[entity];

  const onPickFile = async (file) => {
    if (!file) return;
    setStatus(null); setBusy(true);
    try {
      const name = (file.name || '').toLowerCase();
      let parsed;
      if (name.endsWith('.csv') || name.endsWith('.txt')) {
        const text = await file.text();
        parsed = ieParseCsv(text);
      } else if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
        const buf = await file.arrayBuffer();
        parsed = await ieParseXlsx(buf);
      } else {
        throw new Error('Formati duhet të jetë .csv ose .xlsx');
      }
      setPreview(parsed);
      if (!parsed.rows.length) {
        setStatus({ type: 'err', text: 'Nuk u gjetën rreshta të dhënash. Sigurohu që rreshti i header-it ka kolona si: ' + (IE_TEMPLATES[entity] && IE_TEMPLATES[entity].headers ? IE_TEMPLATES[entity].headers.slice(0,4).join(', ') : 'Emri*, ...') + ' dhe të dhënat janë POSHTË header-it (pa rreshta titulli sipër).' });
      } else {
        setStatus({ type: 'info', text: 'U lexuan ' + parsed.rows.length + ' rreshta | Header: ' + (parsed.headers || []).slice(0,6).join(' | ') + ((parsed.headers||[]).length>6?'...':'') + '. Shtyp Importo.' });
      }
    } catch (e) {
      setStatus({ type: 'err', text: e.message || String(e) });
      setPreview({ headers: [], rows: [] });
    }
    setBusy(false);
  };

  const doImport = async () => {
    if (!preview.rows.length) return Swal.fire({ icon: 'info', title: 'Nuk ka rreshta', text: 'Ngarko një file template më parë.' });
    const conf = await Swal.fire({
      icon: 'question', title: 'Importo ' + tpl.label + '?',
      text: preview.rows.length + ' rreshta do të importohen.',
      showCancelButton: true, confirmButtonText: 'Importo', cancelButtonText: 'Anulo', confirmButtonColor: '#714B67'
    });
    if (!conf.isConfirmed) return;
    setBusy(true); setStatus({ type: 'info', text: 'Duke importuar...' });
    try {
      const res = await ieImportEntity(tpl, preview.rows, user);
      if (!res.total) {
        setStatus({ type: 'err', text: '0 rreshta të vlefshëm. Kontrollo që kolonat përputhen me template (p.sh. Emri*) dhe fushat e detyrueshme janë plotësuar.' });
        Swal.fire({ icon: 'warning', title: 'Asgjë nuk u importua', text: 'Header-i duhet të jetë rreshti me Emri*/SKU*/etj. Jo titulli i file-it.' });
        setBusy(false); return;
      }
      setStatus({
        type: res.errors.length ? 'err' : 'ok',
        text: 'U importuan ' + res.ok + ' / ' + res.total + (res.errors.length ? ('. Gabime: ' + res.errors.slice(0, 5).join(' | ')) : '')
      });
      Swal.fire({ icon: res.errors.length ? 'warning' : 'success', title: 'Importi përfundoi', text: 'Sukses: ' + res.ok + (res.errors.length ? ', gabime: ' + res.errors.length : '') });
      try { await fbLogActivity('Import', user, tpl.label + ': ' + res.ok + ' rreshta'); } catch (e) {}
    } catch (e) {
      setStatus({ type: 'err', text: e.message || String(e) });
    }
    setBusy(false);
  };

  const doExport = async (id) => {
    setBusy(true);
    try {
      if (!window.JSZip) throw new Error('JSZip nuk u ngarkua. Hap me internet dhe rifresko.');
      const t = IE_TEMPLATES[id];
      if (!t) throw new Error('Moduli nuk u gjet');
      const n = await ieExportEntity(t, user);
      Swal.fire({ icon: 'success', title: 'Eksportuar', text: t.label + ': ' + n + ' rreshta (edhe 0 = vetëm header)', timer: 2000, showConfirmButton: false });
    } catch (e) {
      console.error(e);
      Swal.fire({ icon: 'error', title: 'Eksporti dështoi', text: e.message || String(e) });
    }
    setBusy(false);
  };

  const downloadTemplate = async (asXlsx, entityId) => {
    const t = IE_TEMPLATES[entityId || entity] || IE_TEMPLATES.customers;
    if (!t) return;
    try {
      if (asXlsx) {
        if (!window.JSZip) throw new Error('JSZip nuk u ngarkua. Hap me internet dhe rifresko.');
        await ieTemplateXlsx(t);
      } else {
        ieDownloadText('template_' + t.id + '.csv', '﻿' + ieTemplateCsv(t), 'text/csv;charset=utf-8');
      }
    } catch (e) {
      console.error(e);
      if (window.Swal) Swal.fire({ icon:'error', title:'Template dështoi', text: e.message || String(e) });
    }
  };

  const doBackupJson = async () => {
    setBusy(true);
    const res = await fbDumpAllData();
    setBusy(false);
    if (!res.success) return Swal.fire({ icon: 'error', title: 'Backup dështoi', text: res.message });
    ieDownloadText('backup_sistemi_genit_' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(res.data, null, 2), 'application/json');
    Swal.fire({ icon: 'success', title: 'Backup JSON u shkarkua', timer: 1500, showConfirmButton: false });
  };

  const doBackupXlsx = async () => {
    setBusy(true);
    try {
      // multi-entity: export one combined workbook via sequential is not multi-sheet; create multi-sheet zip
      const dump = await fbDumpAllData();
      if (!dump.success) throw new Error(dump.message);
      const data = dump.data.data || {};
      // Build simple multi-sheet xlsx
      if (!window.JSZip) throw new Error('JSZip mungon');
      const entities = [
        { name: 'Klientet', rows: Object.values(data.records || {}).map(c => [c.name, c.phone, c.email, c.customerType, c.amount, c.active]) , headers: ['Emri','Telefoni','Email','Tipi','Balanca','Aktiv'] },
        { name: 'Artikujt', rows: Object.values(data.products || {}).map(p => [p.name, p.sku, p.barcode, p.category, p.price, p.cost, p.location, p.status]), headers: ['Emri','SKU','Barkodi','Kategoria','Cmimi','Kosto','Magazina','Statusi'] },
        { name: 'Furnitoret', rows: Object.values(data.suppliers || {}).map(s => [s.name, s.contact, s.phone, s.email, s.openingBalance]), headers: ['Emri','Kontakti','Telefoni','Email','Balanca'] },
        { name: 'Shitjet', rows: Object.values(data.sales || {}).map(s => [s.invoiceNo, s.createdAt, s.customerName, s.paymentMethod, s.total, s.status]), headers: ['Fatura','Data','Klienti','Pagesa','Totali','Statusi'] },
        { name: 'Blerjet', rows: Object.values(data.purchase_orders || {}).map(p => [p.poNumber, p.createdAt, p.supplierName, p.total, p.status]), headers: ['PO','Data','Furnitori','Totali','Statusi'] },
        { name: 'Stoku', rows: Object.values(data.stock_movements || {}).map(m => [m.createdAt, m.type, m.productId, m.qty, m.reason, m.reference]), headers: ['Data','Tipi','ProduktId','Sasia','Arsyeja','Referenca'] },
        { name: 'Shpenzimet', rows: Object.values(data.expenses || {}).map(e => [e.date || e.createdAt, e.category, e.payee || e.vendor, e.amount, e.paymentMethod]), headers: ['Data','Kategoria','Marresi','Shuma','Pagesa'] },
        { name: 'Pagesat', rows: Object.values(data.payments || {}).map(p => [p.date, p.type, p.party, p.amount, p.method, p.reference]), headers: ['Data','Tipi','Pale','Shuma','Metoda','Referenca'] }
      ];
      // Use first entity via erpExportXlsx for simplicity + also JSON is main backup
      // Create multi-sheet manually
      const zip = new JSZip();
      const shared = [];
      const sharedIndex = Object.create(null);
      function ss(v) {
        const s = String(v == null ? '' : v);
        if (Object.prototype.hasOwnProperty.call(sharedIndex, s)) return sharedIndex[s];
        const i = shared.length; shared.push(s); sharedIndex[s] = i; return i;
      }
      function colName(n) { let s='',x=n+1; while(x>0){const m=(x-1)%26;s=String.fromCharCode(65+m)+s;x=Math.floor((x-1)/26);} return s; }
      function escXml(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      const sheetFiles = [];
      entities.forEach((ent, si) => {
        const rowsXml = [];
        const all = [ent.headers].concat(ent.rows.map(r => r.map(x => x)));
        all.forEach((row, ri) => {
          const cells = row.map((val, ci) => {
            const ref = colName(ci) + (ri+1);
            if (typeof val === 'number' && Number.isFinite(val)) return '<c r="'+ref+'"><v>'+val+'</v></c>';
            return '<c r="'+ref+'" t="s"><v>'+ss(val)+'</v></c>';
          }).join('');
          rowsXml.push('<row r="'+(ri+1)+'">'+cells+'</row>');
        });
        const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rowsXml.join('')+'</sheetData></worksheet>';
        const fname = 'xl/worksheets/sheet'+(si+1)+'.xml';
        zip.file(fname, sheetXml);
        sheetFiles.push({ name: ent.name.slice(0,31), fname: 'worksheets/sheet'+(si+1)+'.xml', id: si+1 });
      });
      const sst = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="'+shared.length+'" uniqueCount="'+shared.length+'">'+shared.map(s=>'<si><t>'+escXml(s)+'</t></si>').join('')+'</sst>';
      zip.file('xl/sharedStrings.xml', sst);
      zip.file('xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>');
      const sheetsXml = sheetFiles.map((s,i)=>'<sheet name="'+escXml(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('');
      zip.file('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheetsXml+'</sheets></workbook>');
      const rels = sheetFiles.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="'+s.fname+'"/>').join('') +
        '<Relationship Id="rId'+(sheetFiles.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>' +
        '<Relationship Id="rId'+(sheetFiles.length+2)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
      zip.folder('xl').folder('_rels').file('workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>');
      zip.folder('_rels').file('.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
      const overrides = sheetFiles.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('');
      zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+overrides+'<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
      const blob = await zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression:'DEFLATE' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup_sistemi_genit_'+new Date().toISOString().slice(0,10)+'.xlsx'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      Swal.fire({ icon:'success', title:'Backup Excel u shkarkua', timer:1500, showConfirmButton:false });
    } catch (e) {
      Swal.fire({ icon:'error', title:'Backup Excel dështoi', text: e.message || String(e) });
    }
    setBusy(false);
  };

  const onRestoreFile = async (file) => {
    if (!file) return;
    setBusy(true);
    try {
      const name = (file.name || '').toLowerCase();
      if (!name.endsWith('.json')) throw new Error('Për restore përdor backup .json (rekomanduar). Excel është vetëm për shikim/eksport.');
      const text = await file.text();
      const json = JSON.parse(text);
      const conf = await Swal.fire({
        icon: 'warning',
        title: 'Restore backup?',
        html: '<p>Mode: <b>' + (restoreMode === 'replace' ? 'ZËVENDËSO' : 'BASHKO (merge)') + '</b></p><p>Kjo mund të ndryshojë të dhënat ekzistuese.</p>',
        showCancelButton: true, confirmButtonText: 'Vazhdo', cancelButtonText: 'Anulo', confirmButtonColor: '#d9534f'
      });
      if (!conf.isConfirmed) { setBusy(false); return; }
      let payload = json;
      if (json && json.success && json.data) payload = json.data; // accidental wrap
      if (payload && payload.meta && payload.data) payload = payload;
      else if (payload && !payload.data) payload = { data: payload };
      const res = await fbRestoreAllData(payload, restoreMode);
      if (!res.success) throw new Error(res.message);
      await fbLogActivity('Restore Backup', user, restoreMode);
      Swal.fire({ icon: 'success', title: 'Restore u krye', text: 'Rifresko faqen për të parë të dhënat.', confirmButtonText: 'Rifresko' }).then(() => location.reload());
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'Restore dështoi', text: e.message || String(e) });
    }
    setBusy(false);
  };

  const entities = Object.keys(IE_TEMPLATES).map(k => IE_TEMPLATES[k]);

  return (
    <div className="data-section">
      <div className="section-header">
        <h2><i className="fas fa-file-import"></i> Import / Eksport</h2>
        <div style={{ display:'flex', gap:8 }}>
          {busy && <span style={{ color:'#6c757d', fontSize:13 }}><i className="fas fa-spinner fa-spin"></i> Duke punuar...</span>}
        </div>
      </div>
      <div className="ie-tabs">
        <button type="button" className={'ie-tab' + (tab==='import'?' active':'')} onClick={() => setTab('import')}><i className="fas fa-file-import"></i> Import</button>
        <button type="button" className={'ie-tab' + (tab==='export'?' active':'')} onClick={() => setTab('export')}><i className="fas fa-file-export"></i> Eksport</button>
        <button type="button" className={'ie-tab' + (tab==='backup'?' active':'')} onClick={() => setTab('backup')}><i className="fas fa-database"></i> Backup / Restore</button>
      </div>
      <div className="ie-body">
        {tab === 'import' && (
          <>
            <div className="ie-grid">
              {entities.map(e => (
                <div key={e.id} className="ie-card" style={{ outline: entity===e.id ? '2px solid #714B67' : 'none' }}>
                  <h3><i className={'fas ' + e.icon}></i> {e.label}</h3>
                  <p>Shkarko template, plotëso rreshtat, pastaj ngarko për import.</p>
                  <div className="ie-actions">
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => { setEntity(e.id); downloadTemplate(false, e.id); }}><i className="fas fa-download"></i> CSV</button>
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => { setEntity(e.id); downloadTemplate(true, e.id); }}><i className="fas fa-file-excel"></i> Excel</button>
                    <button type="button" className="btn btn-primary btn-sm" onClick={() => setEntity(e.id)}><i className="fas fa-check"></i> Zgjidh</button>
                  </div>
                </div>
              ))}
            </div>
            <div className="ie-upload">
              <p style={{ marginBottom: 8 }}><b>Moduli aktiv:</b> {tpl.label}</p>
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onChange={e => onPickFile(e.target.files && e.target.files[0])} />
              <label onClick={() => fileRef.current && fileRef.current.click()}><i className="fas fa-cloud-upload-alt"></i> Ngarko file CSV / Excel</label>
              <div style={{ marginTop: 10 }}>
                <button type="button" className="btn btn-success" disabled={busy || !preview.rows.length} onClick={doImport}><i className="fas fa-file-import"></i> Importo {tpl.label}</button>
              </div>
            </div>

// ===========================================================================
// alphaExtraReports — remaining Alpha WEB catalogue (49 reports) on the same
// engine. Finance reports use a simplified derived chart of accounts.
// ===========================================================================
function alphaWhStock(D) {
  const m = {};
  (D.moves || []).forEach(v => {
    const pid = v.productId || ''; if (!m[pid]) m[pid] = { total: 0, wh: {} };
    const q = Number(v.qty || 0) * (v.type === 'in' ? 1 : -1);
    const w = v.warehouse || 'Magazina Kryesore';
    m[pid].total += q; m[pid].wh[w] = (m[pid].wh[w] || 0) + q;
  });
  return m;
}
function alphaStockValue(D) {
  const ws = alphaWhStock(D); let val = 0;
  (D.products || []).forEach(p => { val += (ws[p.id] ? ws[p.id].total : Number(p.stock || 0)) * Number(p.cost || 0); });
  return round2(val);
}
function alphaFin(D, fil) {
  const sales = (D.sales || []).filter(x => x.status !== 'cancelled' && alphaInPeriod(x.createdAt, fil));
  const pos = (D.pos || []).filter(p => p.status === 'received' && alphaInPeriod(p.createdAt, fil));
  const exp = (D.expenses || []).filter(e => alphaInPeriod(e.date || e.createdAt, fil));
  const revenue = round2(sales.reduce((a, x) => a + Number(x.subtotal || 0), 0));
  const vatOut = round2(sales.reduce((a, x) => a + Number(x.tax || 0), 0));
  const purchases = round2(pos.reduce((a, p) => a + Number(p.total || 0), 0));
  const expenses = round2(exp.reduce((a, e) => a + Number(e.amount || 0), 0));
  const cashIn = round2(sales.filter(x => x.paymentMethod !== 'Credit').reduce((a, x) => a + Number(x.total || 0), 0));
  const receivables = round2(sales.filter(x => x.paymentMethod === 'Credit').reduce((a, x) => a + Number(x.total || 0), 0));
  const inventory = alphaStockValue(D);
  const cash = round2(cashIn - purchases - expenses);
  const profit = round2(revenue - purchases - expenses);
  const events = [];
  sales.forEach(x => { const dt = String(x.createdAt || '').slice(0, 10);
    if (x.paymentMethod === 'Credit') events.push({ dt, acc: '1100', d: Number(x.total || 0), k: 0, desc: 'Faturë ' + (x.invoiceNo || '') });
    else events.push({ dt, acc: '1000', d: Number(x.total || 0), k: 0, desc: 'Faturë ' + (x.invoiceNo || '') });
    events.push({ dt, acc: '4000', d: 0, k: Number(x.total || 0), desc: 'E ardhur ' + (x.invoiceNo || '') });
  });
  pos.forEach(p => { const dt = String(p.createdAt || '').slice(0, 10); events.push({ dt, acc: '5000', d: Number(p.total || 0), k: 0, desc: 'Blerje ' + (p.poNumber || '') }); events.push({ dt, acc: '1000', d: 0, k: Number(p.total || 0), desc: 'Pagesë furnitor ' + (p.poNumber || '') }); });
  exp.forEach(e => { const dt = String(e.date || e.createdAt || '').slice(0, 10); events.push({ dt, acc: '5000', d: Number(e.amount || 0), k: 0, desc: 'Shpenzim ' + (e.category || '') }); events.push({ dt, acc: '1000', d: 0, k: Number(e.amount || 0), desc: 'Shpenzim ' + (e.category || '') }); });
  events.sort((a, b) => a.dt.localeCompare(b.dt));
  return { revenue, vatOut, purchases, expenses, cashIn, receivables, inventory, cash, profit, events };
}
const ALPHA_ACC = { '1000': 'Arka (para në dorë)', '1100': 'Klientët (të arkhëtueshëm)', '1200': 'Inventari (stoku)', '2000': 'Furnitorët (detyrime)', '3000': 'Kapitali', '4000': 'Të ardhurat nga shitje', '5000': 'Shpenzimet' };
function alphaAccBalances(F) {
  const b = {}; Object.keys(ALPHA_ACC).forEach(k => b[k] = { d: 0, k: 0 });
  F.events.forEach(e => { b[e.acc].d += e.d; b[e.acc].k += e.k; });
  return b;
}
function alphaExtraReports(id, fil, D) {
  const F = [{ label: 'Fillimi:', value: fil.from }, { label: 'Përfundimi:', value: fil.to }, { label: 'Monedha:', value: 'LEK' }, { label: 'Kursi:', value: '1' }];
  let spec = null, rows = [], totals = null;
  const FIN = alphaFin(D, fil);

  if (id === 'RAP_ARKA_GJENDJAPERMBLEDHUR') {
    spec = { title: 'Gjendja e përmbledhur e arkës', filters: F, leadCols: [], columns: [{ key: 'pershkrimi', label: 'Përshkrimi', align: 'l' }, { key: 'hyrje', label: 'Hyrje', num: 1 }, { key: 'dalje', label: 'Dalje', num: 1 }, { key: 'balanca', label: 'Balanca', num: 1 }] };
    const bal = round2(FIN.cashIn - FIN.purchases - FIN.expenses);
    rows = [{ pershkrimi: 'Arkëtime (shitje me para)', hyrje: FIN.cashIn, dalje: 0, balanca: FIN.cashIn }, { pershkrimi: 'Pagesë furnitorësh', hyrje: 0, dalje: FIN.purchases, balanca: -FIN.purchases }, { pershkrimi: 'Shpenzime', hyrje: 0, dalje: FIN.expenses, balanca: -FIN.expenses }];
    totals = { hyrje: FIN.cashIn, dalje: round2(FIN.purchases + FIN.expenses), balanca: bal };
  } else if (id === 'RAP_ARKA_SIPAS_KATEGORISE') {
    spec = { title: 'Arkëtime sipas kategorisë së pagesës', filters: F, leadCols: [], columns: [{ key: 'kategoria', label: 'Kategoria e pagesës', align: 'l' }, { key: 'dok', label: 'Nr. dokumente', num: 1 }, { key: 'vlera', label: 'Vlera', num: 1 }] };
    totals = { dok: 0, vlera: 0 };
    const m = {};
    (D.sales || []).filter(x => x.status !== 'cancelled' && x.paymentMethod !== 'Credit' && alphaInPeriod(x.createdAt, fil)).forEach(x => { const k = x.paymentMethod || 'Para'; m[k] = m[k] || { kategoria: k, dok: 0, vlera: 0 }; m[k].dok++; m[k].vlera += Number(x.total || 0); });
    rows = Object.keys(m).sort((a, b) => m[b].vlera - m[a].vlera).map(k => m[k]);
    rows.forEach(r => { totals.dok += r.dok; totals.vlera += r.vlera; });
  } else if (id === 'Rap_ShitjeAnalitik') {
    spec = { title: 'Regjistri Analitik i Shitjeve', filters: F, leadCols: [{ key: 'rend', label: 'Nr. Rend' }], columns: [{ key: 'nr', label: 'Nr. Fature' }, { key: 'dt', label: 'Dt. Dok' }, { key: 'klienti', label: 'Klienti', align: 'l' }, { key: 'artikulli', label: 'Artikulli', align: 'l' }, { key: 'sasia', label: 'Sasia', num: 1 }, { key: 'cmimi', label: 'Çmimi', num: 1 }, { key: 'vlera', label: 'Vlera pa TVSH', num: 1 }, { key: 'tvsh', label: 'TVSH', num: 1 }, { key: 'totali', label: 'Totali', num: 1 }] };
    totals = { sasia: 0, vlera: 0, tvsh: 0, totali: 0 };
    (D.sales || []).filter(x => x.status !== 'cancelled' && alphaInPeriod(x.createdAt, fil)).forEach(x => (x.items || []).forEach(it => { rows.push({ rend: rows.length + 1, nr: x.invoiceNo || '', dt: String(x.createdAt || '').slice(0, 10), klienti: x.customerName || 'Walk-in', artikulli: it.name || '', sasia: Number(it.displayQty != null ? it.displayQty : it.qty) || 0, cmimi: Number(it.unitSalePrice || it.price || 0), vlera: Number(it.lineNet || 0), tvsh: Number(it.lineTax || 0), totali: Number(it.lineTotal || 0) }); totals.sasia += Number(it.displayQty != null ? it.displayQty : it.qty) || 0; totals.vlera += Number(it.lineNet || 0); totals.tvsh += Number(it.lineTax || 0); totals.totali += Number(it.lineTotal || 0); }));
  } else if (id === 'Rap_ShitjePermbledhes') {
    spec = { title: 'Regjistri Permbledhes i Shitjeve', filters: F, leadCols: [{ key: 'rend', label: 'Nr. Rend' }], columns: [{ key: 'nr', label: 'Nr. Fature' }, { key: 'dt', label: 'Dt. Dok' }, { key: 'klienti', label: 'Klienti', align: 'l' }, { key: 'pagesa', label: 'Pagesa' }, { key: 'nentotal', label: 'Nentotal', num: 1 }, { key: 'zbritje', label: 'Zbritje', num: 1 }, { key: 'tvsh', label: 'TVSH', num: 1 }, { key: 'totali', label: 'Totali', num: 1 }] };
    totals = { nentotal: 0, zbritje: 0, tvsh: 0, totali: 0 };
    (D.sales || []).filter(x => x.status !== 'cancelled' && alphaInPeriod(x.createdAt, fil)).forEach(x => { rows.push({ rend: rows.length + 1, nr: x.invoiceNo || '', dt: String(x.createdAt || '').slice(0, 10), klienti: x.customerName || 'Walk-in', pagesa: x.paymentMethod || 'Para', nentotal: Number(x.subtotal || 0), zbritje: Number(x.discount || 0), tvsh: Number(x.tax || 0), totali: Number(x.total || 0) }); totals.nentotal += Number(x.subtotal || 0); totals.zbritje += Number(x.discount || 0); totals.tvsh += Number(x.tax || 0); totals.totali += Number(x.total || 0); });

        </div>
        <div className="right"><span className="type-chip">{built.rows.length} rreshta</span></div>
      </div>
      <div style={{ padding: '0 0 12px' }}>
        {MODULES.map(m => (
          <div key={m.label} style={{ marginBottom: 10 }}>
            <div style={{ fontWeight: 700, color: '#5c6bc0', margin: '8px 0 6px', borderBottom: '1px solid #e0e0e0', paddingBottom: 4 }}>{m.label}</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {m.items.map(it => (
                <button key={it[0]} type="button" onClick={() => setSel(it[0])}
                  style={{ padding: '6px 10px', borderRadius: 4, cursor: 'pointer', fontSize: 12, border: sel === it[0] ? '2px solid #714B67' : '1px solid #ccc', background: sel === it[0] ? '#f3eef2' : '#fff', color: '#3949ab', textAlign: 'center' }}>
                  {it[1]}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div style={{ background: '#f5f5f5', padding: 12, borderRadius: 6, overflow: 'auto' }}>
        <div dangerouslySetInnerHTML={{ __html: built.html }} />
      </div>
    </div>
  );
}

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [setupRequired, setSetupRequired] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);

  useEffect(() => {
    let mounted = true;
    (async function() {
      try {
        const needsSetup = await fbNeedsInitialSetup();
        if (!mounted) return;
        setSetupRequired(needsSetup);
        if (needsSetup) {
          localStorage.removeItem('fb_user');
        } else {
          const saved = localStorage.getItem('fb_user');
          if (saved) {
            try {
              const u = JSON.parse(saved);
              setIsLoggedIn(true);
              setCurrentUser(u);
              setUserRole(u.role);
            } catch (e) {
              localStorage.removeItem('fb_user');
            }
          }
        }
      } catch (e) {
        console.error('Startup check failed', e);
        setSetupRequired(true);
      } finally {
        if (mounted) setCheckingSession(false);
      }
    })();
    return () => { mounted = false; };
  }, []);

  const handleLogin = (user, role) => {
    localStorage.setItem('fb_user', JSON.stringify(user));
    setSetupRequired(false);
    setIsLoggedIn(true); setCurrentUser(user); setUserRole(role);
  };
  const handleLogout = () => {
    localStorage.removeItem('fb_user');
    setIsLoggedIn(false); setCurrentUser(null); setUserRole(null);
  };

  if (checkingSession || setupRequired === null) return <div className="login-container"><div className="login-box"><i className="fas fa-spinner fa-spin" style={{fontSize: '40px', color: 'var(--navy-primary)'}}></i></div></div>;
  if (setupRequired) return <InitialSetupPage onComplete={handleLogin} />;

  return <div>{!isLoggedIn ? <LoginPage onLogin={handleLogin} /> : <Dashboard user={currentUser} role={userRole} onLogout={handleLogout} />}</div>;
}

class ErrorBoundary extends React.Component {
  state = { err: null };
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { console.error('ui crash', err); }
  render() {
    if (this.state.err) return (
      <div className="login-container"><div className="login-box">
        <i className="fas fa-triangle-exclamation" style={{fontSize: 40, color: 'var(--danger)'}}></i>
        <h2>Something broke</h2>
        <pre style={{maxWidth:'70vw',whiteSpace:'pre-wrap',fontSize:11,color:'#a33',textAlign:'left'}}>{String(this.state.err && this.state.err.message || this.state.err || '')}</pre>
        <button className="btn btn-primary" onClick={() => location.reload()}><i className="fas fa-rotate"></i> Reload</button>
      </div></div>
    );
    return this.props.children;
  }
}



// Odoo 17 Enterprise list interactions: checkboxes, selection bar, open record
(function bindOdooListRows() {
  if (!window.jQuery) return;
  var $ = window.jQuery;

  function ensureSelectionBar(wrapper) {
    var $w = $(wrapper);
    if ($w.find('.o-selection-bar').length) return $w.find('.o-selection-bar');
    var $bar = $('<div class="o-selection-bar">' +
      '<span class="o-selection-chip"><span class="o-sel-count">0</span> selected <button type="button" class="o-sel-clear" title="Pastro">×</button></span>' +
      '<div class="o-actions-wrap">' +
        '<button type="button" class="o-actions-btn"><i class="fas fa-cog"></i> Actions <i class="fas fa-caret-down"></i></button>' +
        '<div class="o-actions-menu">' +
          '<button type="button" data-o-act="multi-edit"><i class="fas fa-pen-to-square"></i> Ndrysho fushë (multi)</button>' +
          '<button type="button" data-o-act="export-xlsx"><i class="fas fa-file-excel"></i> Excel (selek./filtruar)</button>' +
          '<button type="button" data-o-act="export-pdf"><i class="fas fa-file-pdf"></i> PDF (selek./filtruar)</button>' +
          '<button type="button" data-o-act="export-print"><i class="fas fa-print"></i> Preview (selek./filtruar)</button>' +
          '<button type="button" data-o-act="export-all"><i class="fas fa-database"></i> Eksporto të gjitha</button>' +
          '<button type="button" class="danger" data-o-act="delete"><i class="fas fa-trash"></i> Fshi të zgjedhurat</button>' +
        '</div>' +
      '</div>' +
    '</div>');
    // place after buttons or at top of wrapper
    var $btns = $w.find('.dt-buttons').first();
    if ($btns.length) $btns.after($bar); else $w.prepend($bar);
    return $bar;
  }

  function selectedRows(api) {
    var rows = [];
    api.rows({ page: 'current' }).every(function() {
      var node = this.node();
      if (node && $(node).find('input.o-row-check').prop('checked')) {
        rows.push({ idx: this.index(), data: this.data(), node: node });
      }
    });
    // also include off-page if checked stored on data
    return rows;
  }

  function refreshSelectionUI(api) {
    try {
      var $table = $(api.table().node());
      var $wrap = $table.closest('.dataTables_wrapper');
      var $bar = ensureSelectionBar($wrap);
      var n = $table.find('tbody input.o-row-check:checked').length;
      $bar.toggleClass('visible', n > 0);
      $bar.find('.o-sel-count').text(n);
      var all = $table.find('tbody input.o-row-check');
      var checked = $table.find('tbody input.o-row-check:checked');
      $table.find('thead input.o-check-all').prop('checked', all.length > 0 && all.length === checked.length);
      $table.find('thead input.o-check-all').prop('indeterminate', checked.length > 0 && checked.length < all.length);
    } catch (e) {}
  }

  function injectCheckboxColumn(api) {
    try {
      var $table = $(api.table().node());
      // Header select-all inside first header cell (no extra column — DataTables-safe)
      var $firstTh = $table.find('thead tr th').first();
      if ($firstTh.length && !$firstTh.find('input.o-check-all').length) {
        $firstTh.prepend('<span class="o-check-wrap"><input type="checkbox" class="o-check-all" title="Zgjidh të gjitha"/> </span>');
      }
      $table.find('tbody tr').each(function() {
        var $tr = $(this);
        var $firstTd = $tr.children('td').first();
        if ($firstTd.length && !$firstTd.find('input.o-row-check').length) {
          $firstTd.prepend('<span class="o-check-wrap"><input type="checkbox" class="o-row-check"/> </span>');
        }
        var $view = $tr.find('[data-action="view"]').first();
        if ($view.length && !$tr.find('.o-open-form').length) {
          var $last = $tr.children('td').last();
          $last.append(' <button type="button" class="o-open-form" title="Hap"><i class="fas fa-arrow-right"></i></button>');
        }
      });
      ensureSelectionBar($table.closest('.dataTables_wrapper'));
      refreshSelectionUI(api);
    } catch (e) { console.warn('checkbox inject', e); }
  }

  // Re-inject after every draw (rows rebuilt)
  $(document).on('init.dt draw.dt', 'table', function(e, settings) {
    try {
      var api = new $.fn.dataTable.Api(settings);
      var $table = $(api.table().node());
      // clear previous check wraps in body (header keep)
      $table.find('tbody .o-check-wrap').remove();
      $table.find('tbody .o-open-form').remove();
      injectCheckboxColumn(api);

      // money columns align
      var moneyRe = /balanc|total|çmim|cmim|shum|amount|price|cost|profit|value|detyrim|fitim|vler|pages|grade/i;
      api.columns().every(function() {
        var header = ($(this.header()).text() || '').trim();
        if (moneyRe.test(header)) {
          $(this.header()).addClass('odoo-num');
          $(this.nodes()).addClass('odoo-num');
        }
      });
    } catch (err) {}
  });

  // checkbox events
  $(document).on('change', 'table.dataTable thead input.o-check-all', function(e) {
    e.stopPropagation();
    var on = this.checked;
    var $table = $(this).closest('table');
    $table.find('tbody input.o-row-check').prop('checked', on);
    $table.find('tbody tr').toggleClass('odoo-selected', on);
    try {
      var api = $table.DataTable();
      refreshSelectionUI(api);
    } catch (err) {}
  });
  $(document).on('change', 'table.dataTable tbody input.o-row-check', function(e) {
    e.stopPropagation();
    var $tr = $(this).closest('tr');
    $tr.toggleClass('odoo-selected', this.checked);
    try {
      var api = $(this).closest('table').DataTable();
      refreshSelectionUI(api);
    } catch (err) {}
  });
  $(document).on('click', 'table.dataTable td.o-check-col', function(e) {
    e.stopPropagation();
  });

  // row click selects highlight (not checkbox)
  $(document).on('click', 'table.dataTable tbody tr', function(e) {
    if ($(e.target).closest('button,a,input,label,.product-action-btn,.toggle,.o-check-col,.o-open-form').length) return;
    var $tr = $(this);
    // single highlight without unchecking multi selection
    $tr.addClass('odoo-selected');
  });

  // double-click / open form chevron = view action
  $(document).on('dblclick', 'table.dataTable tbody tr', function(e) {
    if ($(e.target).closest('button,a,input,label,.product-action-btn,.toggle,.o-check-col').length) return;
    var $btn = $(this).find('[data-action="view"]').first();
    if ($btn.length) $btn.trigger('click');
  });
  $(document).on('click', 'table.dataTable .o-open-form', function(e) {
    e.preventDefault(); e.stopPropagation();
    var $btn = $(this).closest('tr').find('[data-action="view"]').first();
    if ($btn.length) $btn.trigger('click');
  });

  // selection bar actions
  $(document).on('click', '.o-sel-clear', function() {
    var $wrap = $(this).closest('.dataTables_wrapper');
    $wrap.find('input.o-row-check, input.o-check-all').prop('checked', false);
    $wrap.find('tbody tr').removeClass('odoo-selected');
    $wrap.find('.o-selection-bar').removeClass('visible');
  });
  $(document).on('click', '.o-actions-btn', function(e) {
    e.preventDefault(); e.stopPropagation();
    $(this).closest('.o-actions-wrap').toggleClass('open');
  });
  $(document).on('click', function() { $('.o-actions-wrap').removeClass('open'); });
  $(document).on('click', '.o-actions-menu', function(e) { e.stopPropagation(); });

  $(document).on('click', '.o-actions-menu [data-o-act]', function() {
    var act = $(this).data('o-act');
    var $wrap = $(this).closest('.dataTables_wrapper');
    var $table = $wrap.find('table.dataTable').first();
    var api;
    try { api = $table.DataTable(); } catch (e) { return; }
    var title = $table.attr('id') || 'Raporti';
    // Prefer module title from nearby header
    var $h = $wrap.closest('.data-section').find('.section-header h2').first();
    if ($h.length) title = $h.text().trim() || title;

    if (act === 'multi-edit') {
      var selected = [];
      api.rows({ page: 'current' }).every(function() {
        var node = this.node();
        if (node && $(node).find('input.o-row-check').prop('checked')) {
          selected.push(this.data());
        }
      });
      if (!selected.length) {
        if (window.Swal) Swal.fire({ icon: 'info', title: 'Zgjidh rreshta', text: 'Shëno checkbox-et për multi-edit.' });
        return;
      }
      var tableId = $table.attr('id') || '';
      var fieldOpts = [];
      if (tableId === 'salesTable') {
        fieldOpts = [
          { value: 'paymentMethod', label: 'Pagesa (Cash/Card/Mobile/Bank/Credit)' },
          { value: 'status', label: 'Statusi (completed/credit)' },
          { value: 'customerName', label: 'Emri i klientit' }
        ];
      } else if (tableId === 'productsTable') {
        fieldOpts = [
          { value: 'category', label: 'Kategoria' },
          { value: 'status', label: 'Statusi (active/discontinued)' },
          { value: 'reorderLevel', label: 'Nivel furnizimi' },
          { value: 'price', label: 'Çmimi' },
          { value: 'cost', label: 'Kosto' }
        ];
      } else if (tableId === 'poTable') {
        fieldOpts = [
          { value: 'status', label: 'Statusi (draft/ordered/received/cancelled)' },
          { value: 'expectedDate', label: 'Data e pritjes (YYYY-MM-DD)' },
          { value: 'notes', label: 'Shënime' }
        ];
      } else if (tableId === 'recordsTable') {
        fieldOpts = [
          { value: 'customerType', label: 'Tipi (Retail/Wholesale/VIP/Lead)' },
          { value: 'category', label: 'Grupi' },
          { value: 'active', label: 'Aktiv (1/0)' },
          { value: 'amount', label: 'Balanca' }
        ];
      } else if (tableId === 'expensesTable') {
        fieldOpts = [
          { value: 'category', label: 'Kategoria' },
          { value: 'paymentMethod', label: 'Pagesa' },
          { value: 'amount', label: 'Shuma' }
        ];
      } else {
        if (window.Swal) Swal.fire({ icon: 'info', title: 'Multi-edit', text: 'Ky modul nuk ka multi-edit ende. Përdor Shitjet, Produktet, PO, Klientët ose Shpenzimet.' });
        return;
      }
      var optionsHtml = fieldOpts.map(function(o) { return '<option value="' + o.value + '">' + o.label + '</option>'; }).join('');
      if (!window.Swal) return;
      Swal.fire({
        title: 'Ndrysho ' + selected.length + ' rreshta',
        html:
          '<div style="text-align:left">' +
          '<label style="font-size:12px;color:#6c757d">Fusha</label>' +
          '<select id="o-me-field" class="swal2-select" style="width:100%;display:block;margin:6px 0 12px">' + optionsHtml + '</select>' +
          '<label style="font-size:12px;color:#6c757d">Vlera e re</label>' +
          '<input id="o-me-value" class="swal2-input" style="width:100%;margin:6px 0" placeholder="Shkruaj vlerën">' +
          '<div class="o-multi-edit-hint">Si Odoo multi_edit: e njëjta vlerë aplikohet te të gjithë të zgjedhurit.</div>' +
          '</div>',
        showCancelButton: true,
        confirmButtonText: 'Confirm',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#714B67',
        preConfirm: function() {
          var field = (document.getElementById('o-me-field') || {}).value;
          var value = (document.getElementById('o-me-value') || {}).value;
          if (!field) { Swal.showValidationMessage('Zgjidh fushën'); return false; }
          if (value === undefined || value === null || String(value).trim() === '') { Swal.showValidationMessage('Shkruaj vlerën'); return false; }
          return { field: field, value: String(value).trim() };
        }
      }).then(function(res) {
        if (!res.isConfirmed || !res.value) return;
        var field = res.value.field;
        var value = res.value.value;
        // coerce numbers / booleans
        var numFields = { amount:1, price:1, cost:1, reorderLevel:1 };
        var patchVal = value;
        if (numFields[field]) patchVal = Number(value);
        if (field === 'active') patchVal = (value === '1' || value === 'true' || value === 'Po' || value === 'po');
        var userObj = null;
        try { userObj = JSON.parse(localStorage.getItem('fb_user') || 'null'); } catch (e) {}
        var jobs = selected.map(function(row) {
          var id = row && row.id;
          if (!id) return Promise.resolve({ success: false });
          var patch = {}; patch[field] = patchVal;
          if (tableId === 'salesTable' && typeof fbUpdateSale === 'function') return fbUpdateSale(id, patch, userObj);
          if (tableId === 'productsTable' && typeof fbUpdateProduct === 'function') return fbUpdateProduct(id, patch, userObj);
