// --- Odoo-style Sale Form View (sheet + statusbar) ---
function SaleFormView({ sale, onClose, onPrint }) {
  if (!sale) return null;
  const stages = [
    { id: 'draft', label: 'Draft' },
    { id: 'confirmed', label: 'Confirmed' },
    { id: 'paid', label: 'Paid' },
    { id: 'credit', label: 'Credit' },
    { id: 'returned', label: 'Returned' }
  ];
  const hasReturn = Number(sale.returnedTotal || 0) > 0;
  const state = hasReturn ? 'returned' : (sale.status === 'credit' ? 'credit' : (sale.paymentMethod === 'Credit' ? 'credit' : 'paid'));
  const items = sale.items || [];
  return (
    <OdooFormOverlay
      breadcrumb="Shitjet"
      title={sale.invoiceNo || String(sale.id).slice(-6).toUpperCase()}
      onClose={onClose}
      buttons={
        <>
          <button type="button" className="btn btn-primary" onClick={() => openSaleDocument(sale, 'thermal', true)}><i className="fas fa-print"></i> Termik</button>
          <button type="button" className="btn btn-primary" onClick={() => openSaleDocument(sale, 'a4', true)}><i className="fas fa-file-invoice"></i> A4</button>
          <button type="button" className="btn btn-secondary" onClick={() => openSaleDocument(sale, 'a4', false)}><i className="fas fa-eye"></i> Preview</button>
          <button type="button" className="btn btn-secondary" onClick={() => exportSalePdf(sale)}><i className="fas fa-file-pdf"></i> PDF</button>
          <button type="button" className="btn btn-secondary" onClick={() => exportSaleXlsx(sale)}><i className="fas fa-file-excel"></i> Excel</button>
        </>
      }
    >
      <OdooFormSheet
        title={sale.invoiceNo || ('FAT-' + String(sale.id).slice(-6).toUpperCase())}
        statusbar={<div style={{ maxWidth: 1100, margin: '0 auto 12px' }}>
          <div className="o-statusbar">
            {stages.map((s, i) => {
              const idx = Math.max(0, stages.findIndex(x => x.id === state));
              let cls = 'o-arrow';
              if (s.id === state) cls += ' active';
              else if (i < idx) cls += ' done';
              const clickable = s.id === 'paid' || s.id === 'credit';
              return (
                <span key={s.id} className={cls} style={{ cursor: clickable ? 'pointer' : 'default' }}
                  onClick={async () => {
                    if (!clickable || s.id === state) return;
                    const patch = s.id === 'credit' ? { status: 'credit', paymentMethod: 'Credit' } : { status: 'completed', paymentMethod: sale.paymentMethod === 'Credit' ? 'Cash' : (sale.paymentMethod || 'Cash') };
                    const r = await fbUpdateSale(sale.id, patch, null);
                    if (r.success) {
                      Swal.fire({ icon: 'success', title: 'U përditësua', timer: 1000, showConfirmButton: false });
                      onClose();
                      try { window.dispatchEvent(new CustomEvent('erp-data-changed', { detail: { tableId: 'salesTable' } })); } catch (e) {}
                    } else Swal.fire({ icon: 'error', text: r.message });
                  }}
                >{s.label}</span>
              );
            })}
          </div>
          <div className="o-multi-edit-hint" style={{ textAlign:'right' }}>Kliko Paid/Credit për të ndryshuar statusin · ose përdor Kanban drag</div>
        </div>}
      >
        <div className="o-form-group">
          <div>
            <OdooFormField label="Klienti" value={sale.customerName || 'Walk-in'} />
            <OdooFormField label="Data" value={formatDateForDisplay(sale.createdAt)} />
            <OdooFormField label="Arkëtari" value={sale.cashier || '—'} />
            <OdooFormField label="Pagesa" value={sale.paymentMethod || '—'} />
          </div>
          <div>
            <OdooFormField label="Nëntotali" value={money(sale.subtotal || 0)} />
            <OdooFormField label="Zbritje" value={money(sale.discount || 0)} />
            <OdooFormField label="TVSH" value={money(sale.tax || 0)} />
            <OdooFormField label="Totali" value={money(sale.total || 0)} />
          </div>
        </div>
        <div className="o-form-section-title">Artikujt e faturës</div>
        <table className="o-form-table">
          <thead>
            <tr><th>Artikulli</th><th>Sasia</th><th>Njësia</th><th>Çmimi</th><th>TVSH %</th><th>Vlera</th></tr>
          </thead>
          <tbody>
            {items.length === 0 && <tr><td colSpan="6" style={{ color:'#999', textAlign:'center' }}>Nuk ka rreshta</td></tr>}
            {items.map((it, i) => (
              <tr key={i}>
                <td>{it.name}<div className="cell-sub">{it.sku || ''}</div></td>
                <td>{it.displayQty != null ? it.displayQty : it.qty}</td>
                <td>{it.unitName || 'copë'}</td>
                <td>{money(it.unitSalePrice != null ? it.unitSalePrice : it.price)}</td>
                <td>{it.taxRate != null ? it.taxRate : '—'}</td>
                <td>{money(it.lineTotal != null ? it.lineTotal : it.lineNet)}</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr>
              <td colSpan="5">TOTAL</td>
              <td>{money(sale.total || 0)}</td>
            </tr>
          </tfoot>
        </table>
      </OdooFormSheet>
    </OdooFormOverlay>
  );
}


function SalesHistoryView({ user, role }) {
  const [qSearch, setQSearch] = useState('');
  const [viewMode, setViewMode] = useState('list'); // list | kanban
  const [facetPay, setFacetPay] = useState('');
  const [facetStatus, setFacetStatus] = useState('');
  const [reloadKey, setReloadKey] = useState(0);
  const [returnSaleId, setReturnSaleId] = useState(null);
  const [viewSale, setViewSale] = useState(null);
  const [printSale, setPrintSale] = useState(null);
  const tableInstanceRef = useRef(null);
  useDtLiveSearch(tableInstanceRef, qSearch);
  useEffect(() => {
    const fn = (e) => { if (!e.detail || e.detail.tableId === 'salesTable') setReloadKey(k => k + 1); };
    window.addEventListener('erp-data-changed', fn);
    return () => window.removeEventListener('erp-data-changed', fn);
  }, []);

  const { loading, data, err } = useFetch(() => Promise.all([fbGetSales(), fbGetReturns()]), [reloadKey]);
  const sales = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const returns = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const reload = () => setReloadKey(k => k + 1);
  const byId = useMemo(() => sales.reduce((m, s) => (m[s.id] = s, m), {}), [sales]);
  const payMethods = useMemo(() => [...new Set(sales.map(s => s.paymentMethod).filter(Boolean))], [sales]);
  const facets = useMemo(() => {
    const f = [];
    if (facetPay) f.push({ id: 'pay', label: 'Pagesa', value: facetPay });
    if (facetStatus) f.push({ id: 'status', label: 'Statusi', value: facetStatus === 'credit' ? 'Kredi' : facetStatus });
    if (qSearch) f.push({ id: 'q', label: 'Kërkim', value: qSearch });
    return f;
  }, [facetPay, facetStatus, qSearch]);
  const filterChips = useMemo(() => {
    const chips = [
      { id: 'credit', label: 'Kredi e hapur', active: facetStatus === 'credit' },
      { id: 'returned', label: 'Me kthim', active: facetStatus === 'returned' }
    ];
    payMethods.slice(0, 6).forEach(p => chips.push({ id: 'pay:' + p, label: p, active: facetPay === p }));
    return chips;
  }, [payMethods, facetPay, facetStatus]);
  const onToggleChip = (c) => {
    if (c.id === 'credit') setFacetStatus(facetStatus === 'credit' ? '' : 'credit');
    else if (c.id === 'returned') setFacetStatus(facetStatus === 'returned' ? '' : 'returned');
    else if (String(c.id).startsWith('pay:')) {
      const p = String(c.id).slice(4);
      setFacetPay(facetPay === p ? '' : p);
    }
  };
  const onRemoveFacet = (f) => {
    if (f.id === 'pay') setFacetPay('');
    else if (f.id === 'status') setFacetStatus('');
    else if (f.id === 'q') setQSearch('');
  };
  const filteredSales = useMemo(() => {
    return sales.filter(s => {
      if (facetPay && s.paymentMethod !== facetPay) return false;
      if (facetStatus === 'credit' && s.status !== 'credit' && s.paymentMethod !== 'Credit') return false;
      if (facetStatus === 'returned') {
        // filled later with returns map - approximate using returnedTotal on tableData
      }
      if (qSearch) {
        const q = qSearch.toLowerCase();
        const blob = [s.invoiceNo, s.customerName, s.cashier, s.paymentMethod, s.status].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
  }, [sales, facetPay, facetStatus, qSearch]);


  const tableData = useMemo(() => sales.map(s => {
    const itemCount = (s.items || []).reduce((n, it) => n + it.qty, 0);
    const cogs = (s.items || []).reduce((c, it) => c + (Number(it.cost) || 0) * it.qty, 0);
    const profit = round2(Number(s.subtotal != null ? s.subtotal : s.total || 0) - Number(s.discount || 0) - cogs);
    const returnedTotal = returns.filter(r => r.saleId === s.id).reduce((sum, r) => sum + Number(r.totalRefund || 0), 0);
    return Object.assign({}, s, { itemCount, profit, returnedTotal });
  }), [sales, returns]);

  const summary = useMemo(() => ({
    count: sales.length,
    total: tableData.reduce((s, r) => s + Number(r.total || 0), 0),
    profit: tableData.reduce((s, r) => s + Number(r.profit || 0), 0),
    returned: tableData.reduce((s, r) => s + Number(r.returnedTotal || 0), 0)
  }), [tableData, sales.length]);

  useEffect(() => {
    if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load sales' });
  }, [err, data]);

  const displaySales = useMemo(() => {
    return (tableData || []).filter(s => {
      if (facetPay && s.paymentMethod !== facetPay) return false;
      if (facetStatus === 'credit' && !(s.status === 'credit' || s.paymentMethod === 'Credit')) return false;
      if (facetStatus === 'returned' && !(Number(s.returnedTotal) > 0)) return false;
      return true;
    });
  }, [tableData, facetPay, facetStatus]);

  useEffect(() => {
    if (loading) return;
    if (viewMode !== 'list') {
      if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); } catch (e) {} tableInstanceRef.current = null; }
      return;
    }
    if (!document.getElementById('salesTable')) return;
    if (tableInstanceRef.current) {
      try { if (!document.contains(tableInstanceRef.current.table().node())) { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } } catch (e) { tableInstanceRef.current = null; }
    }
    let table = tableInstanceRef.current;
    if (table) {
      table.clear().rows.add(displaySales).draw(false);
    } else {
      table = $('#salesTable').DataTable({
        data: displaySales,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (d.status === 'credit') $(row).addClass('row-danger'); else if (Number(d.returnedTotal) > 0) $(row).addClass('row-warn'); }, // credit=red, has-return=amber
        columns: [
          { data: 'invoiceNo', title: 'Fatura', render: (d, t, row) => t === 'display' ? docLinkHtml('view', row.id, d || String(row.id).slice(-6).toUpperCase()) : (d || row.id) },
          { data: 'createdAt', title: 'Data', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
          { data: 'customerName', title: 'Klienti', render: (d, t) => t === 'display' ? esc(d || 'Walk-in') : d },
          { data: 'cashier', title: 'Arkëtari', render: (d, t) => t === 'display' ? esc(d || '') : d },
          { data: 'itemCount', title: 'Artikuj' },
          { data: 'total', title: 'Totali', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'paymentMethod', title: 'Pagesa', render: (d, t) => t === 'display' ? (d ? '<span class="type-chip">' + esc(d) + '</span>' : '-') : (d || '') },
          { data: 'profit', title: 'Fitimi', render: (d, t) => t === 'display' ? `<span style="color:${Number(d) >= 0 ? '#155724' : '#721c24'};font-weight:600">${money(d)}</span>` : d },
          { data: 'returnedTotal', title: 'Kthyer', render: (d, t) => t === 'display' ? (d > 0 ? '<span class="status-badge status-inactive">' + money(d) + '</span>' : '-') : d },
          { data: null, title: 'Veprime', orderable: false, render: () => actionBtn('view', 'fa-receipt', 'Shiko') + (role === 'Admin' ? actionBtn('return', 'fa-rotate-left', 'Kthim', 'qr') : '') }
        ],
        pageLength: 80,
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: erpDtButtons('Historiku_Shitjeve'),
        order: [[1, 'desc']]
      });
      tableInstanceRef.current = table;
    }
    $('#salesTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      const rowData = getDtRowData(table, this);
      if (!rowData || !rowData.id) return;
      const id = rowData.id;
      const action = $(this).data('action');
      if (action === 'view') setViewSale(byId[id] || rowData);
      else if (action === 'return') setReturnSaleId(id);
    });
  }, [loading, displaySales, role, facetPay, facetStatus, viewMode]);

  useEffect(() => () => {
    if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
  }, []);

  const onSaleKanbanDrop = async (cardId, fromCol, toCol, card) => {
    if (!cardId || fromCol === toCol) return;
    if (toCol === 'returned') {
      Swal.fire({ icon: 'info', title: 'Kthimi', text: 'Për kthim përdor butonin Kthim te listë/formë. Drag te "Kthyer" nuk krijon kthim automatik.' });
      return;
    }
    const patch = {};
    if (toCol === 'credit') { patch.status = 'credit'; patch.paymentMethod = 'Credit'; }
    else if (toCol === 'paid') { patch.status = 'completed'; if ((card && card.record && card.record.paymentMethod) === 'Credit') patch.paymentMethod = 'Cash'; }
    else return;
    const r = await fbUpdateSale(cardId, patch, user);
    if (r.success) {
      Swal.fire({ icon: 'success', title: 'Statusi u ndryshua', text: r.message, timer: 1200, showConfirmButton: false });
      reload();
    } else Swal.fire({ icon: 'error', title: 'Gabim', text: r.message });
  };

const kanbanColumns = useMemo(() => {
    const groups = [
      { id: 'paid', title: 'Paguar', match: s => s.status !== 'credit' && s.paymentMethod !== 'Credit' && !(Number(s.returnedTotal) > 0) },
      { id: 'credit', title: 'Kredi', match: s => s.status === 'credit' || s.paymentMethod === 'Credit' },
      { id: 'returned', title: 'Kthyer', match: s => Number(s.returnedTotal) > 0 },
      { id: 'other', title: 'Të tjera', match: s => false }
    ];
    // Build from tableData (has profit/returnedTotal) filtered
    const src = (tableData || []).filter(s => {
      if (facetPay && s.paymentMethod !== facetPay) return false;
      if (facetStatus === 'credit' && !(s.status === 'credit' || s.paymentMethod === 'Credit')) return false;
      if (facetStatus === 'returned' && !(Number(s.returnedTotal) > 0)) return false;
      if (qSearch) {
        const q = qSearch.toLowerCase();
        const blob = [s.invoiceNo, s.customerName, s.cashier, s.paymentMethod, s.status].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
    const used = new Set();
    return groups.map(g => {
      const cards = src.filter(s => {
        if (g.id === 'other') return !used.has(s.id);
        const ok = g.match(s);
        if (ok) used.add(s.id);
        return ok;
      }).map(s => ({
        id: s.id,
        title: s.invoiceNo || String(s.id).slice(-6).toUpperCase(),
        sub: s.customerName || 'Walk-in',
        meta: formatDateForDisplay(s.createdAt),
        amount: money(s.total),
        footer: s.paymentMethod || '',
        tags: [s.status === 'credit' ? 'Kredi' : null, Number(s.returnedTotal) > 0 ? 'Kthim' : null].filter(Boolean),
        record: s,
        onClick: () => setViewSale(byId[s.id] || s)
      }));
      return { id: g.id, title: g.title, cards };
    }).filter(c => c.id !== 'other' || c.cards.length);
  }, [tableData, facetPay, facetStatus, qSearch, byId]);

  return (
    <div className="data-section">
      <div className="section-header">
        <h2><i className="fas fa-receipt"></i> Porositë</h2>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <OdooViewSwitcher mode={viewMode} onChange={setViewMode} />
          <RefreshBtn onClick={reload} />
        </div>
      </div>
      <div className="o-cp-tools">
        <OdooSearchFacets
          value={qSearch}
          onChange={setQSearch}
          placeholder="Kërko faturë, klient, arkëtar, pagesë…"
          facets={facets}
          onRemoveFacet={onRemoveFacet}
          filterChips={filterChips}
          onToggleChip={onToggleChip}
        />
      </div>
      {loading && <TableSkeleton rows={8} columns={10} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <div style={{ display: viewMode === 'list' ? 'block' : 'none' }}>
            <table id="salesTable" className="display" style={{ width: '100%' }}></table>
            <FilteredSummaryBar tableRef={tableInstanceRef} deps={[tableData, qSearch, facetPay, facetStatus]} itemsBuilder={(rows) => [
              { label: 'Shitje (filtruar)', value: rows.length },
              { label: 'Totali (filtruar)', value: money(rows.reduce((s, r) => s + Number(r.total || 0), 0)) },
              { label: 'Fitimi (filtruar)', value: money(rows.reduce((s, r) => s + Number(r.profit || 0), 0)) }
            ]} />
        </div>
        {viewMode === 'kanban' && <OdooKanban columns={kanbanColumns} onDropCard={onSaleKanbanDrop} />}
        {sales.length > 0 && viewMode === 'list' && <SummaryBar items={[{ label: 'Sales', value: summary.count }, { label: 'Total', value: money(summary.total) }, { label: 'Profit', value: money(summary.profit) }, { label: 'Returned', value: money(summary.returned) }]} />}
      </div>
      {viewSale && <SaleFormView sale={viewSale} onClose={() => setViewSale(null)} onPrint={(s) => setPrintSale(s)} />}
      {printSale && <ThermalReceiptOverlay sale={printSale} onClose={() => setPrintSale(null)} />}
      {returnSaleId && <ReturnModal sale={byId[returnSaleId]} returns={returns} user={user} onClose={() => setReturnSaleId(null)} onDone={() => { setReturnSaleId(null); reload(); }} />}
    </div>
  );
}

// --- Dashboard View (Admin only) - POS overview ---
function DashboardView({ user, role, setActiveMenu }) {
  const { loading, data } = useFetch(() => Promise.all([fbGetSales(), fbGetProducts(), fbGetStockMovements(), fbGetExpenses()]), []);
  const sales = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const products = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const movements = useMemo(() => (data && data[2] && data[2].success ? data[2].data : []), [data]);
  const expenses = useMemo(() => (data && data[3] && data[3].success ? data[3].data : []), [data]);

  const barRef = useRef(null), payRef = useRef(null);
  const barChart = useRef(null), payChart = useRef(null);
  const ymd = (d) => { try { return new Date(d).toISOString().slice(0, 10); } catch (e) { return ''; } };
  const today = new Date().toISOString().slice(0, 10);

  const s = useMemo(() => {
    const todaySales = sales.filter(x => ymd(x.createdAt) === today);
    const lowStock = products.filter(p => computeQtyOnHand(p.id, movements) <= Number(p.reorderLevel || 0));
    const month = today.slice(0, 7);
    const monthRevenue = sales.filter(x => ymd(x.createdAt).slice(0, 7) === month).reduce((a, x) => a + Number(x.total || 0), 0);
    const monthExpenses = expenses.filter(e => (e.date || ymd(e.createdAt)).slice(0, 7) === month).reduce((a, e) => a + Number(e.amount || 0), 0);
    return {
      todayRevenue: todaySales.reduce((a, x) => a + Number(x.total || 0), 0),
      todayOrders: todaySales.length,
      lowStock,
      creditOutstanding: sales.filter(x => x.status === 'credit').reduce((a, x) => a + Number(x.total || 0), 0),
      stockValue: products.reduce((a, p) => a + computeQtyOnHand(p.id, movements) * (Number(p.cost) || 0), 0),
      monthRevenue, monthExpenses
    };
  }, [sales, products, movements, expenses, today]);

  const recentSales = useMemo(() => [...sales].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 6), [sales]);

  useEffect(() => {
    if (loading) return;
    const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
    const labels = days.map(d => d.toLocaleDateString('en-US', { weekday: 'short' }));

function reportInRange(iso, from, to) {

  if (to && d > new Date(to + 'T23:59:59')) return false;

function reportMatch(q) {
  const raw = String(q || '').trim().toLowerCase();

  if (!raw) return true;
  const hay = vals.map(function(v) { return String(v == null ? '' : v).toLowerCase(); }).join(' ');

  const tokens = raw.split(/\s+/).filter(Boolean);

  return tokens.every(function(t) { return hay.indexOf(t) !== -1; });
}

  const partyActionRows = billingRows.filter(r => {

    if (filters.supplierId) {

    }
    return reportMatch(filters.q, r.party, r.type, r.doc, r.kind);
  }).map(r => ({ date:r.date, party:r.party, kind:r.kind, action:r.type, doc:r.doc, debit:r.invoice, credit:r.payment, net:Number(r.invoice||0)-Number(r.payment||0) }));

    if (filters.price && r.price != null && Math.abs(Number(r.price) - Number(filters.price)) > 0.00001) return false;
    return reportMatch(filters.q, r.item, r.sku, r.party, r.doc, r.type, r.warehouse);
  }).map((r, i) => Object.assign({}, r, { nr:i+1 }));

// --- Logs View (Admin only) ---
function LogsView() {
  const { loading, data } = useFetch(() => fbGetLogs(), []);
  const logs = useMemo(() => (data && data.success ? data.data : []), [data]);
  const [qSearch, setQSearch] = useState('');
  const filtered = useMemo(() => {
    const q = qSearch.trim().toLowerCase();
    if (!q) return logs;
    return logs.filter(l => [l.action, l.detail, l.user, formatDateForDisplay(l.ts)].join(' ').toLowerCase().includes(q));
  }, [logs, qSearch]);
  const headers = ['Action', 'Detail', 'User', 'When'];
  const exportRows = filtered.map(l => ({ Action: l.action, Detail: l.detail, User: l.user, When: formatDateForDisplay(l.ts) }));
  return (
    <div className="data-section">
      <div className="section-header"><h2><i className="fas fa-history"></i> Aktiviteti</h2>
        <div className="erp-export-bar">
          <button className="btn btn-excel" disabled={!exportRows.length} onClick={() => erpExportXlsx('Activity_Logs', headers, exportRows, null, { Kërkim: qSearch || '-' })}><i className="fas fa-file-excel"></i> Excel</button>
          <button className="btn btn-pdf" disabled={!exportRows.length} onClick={() => erpExportPdf('Activity_Logs', headers, exportRows, null, { Kërkim: qSearch || '-' })}><i className="fas fa-file-pdf"></i> PDF</button>
          <button className="btn btn-preview" disabled={!exportRows.length} onClick={() => erpPrintPreview('Activity_Logs', headers, exportRows, null, { Kërkim: qSearch || '-' })}><i className="fas fa-print"></i> Preview</button>
        </div>
      </div>
      <div className="module-toolbar" style={{ marginBottom: 12 }}><GoogleSearchBox value={qSearch} onChange={setQSearch} placeholder="Kërko log… veprim, detaj, përdorues…" /></div>
      {loading ? <TableSkeleton rows={6} columns={4} /> : (
        <div className="about-table-wrapper">
          <table className="about-roles-table">
            <thead><tr><th>Action</th><th>Detail</th><th>User</th><th>When</th></tr></thead>
            <tbody>
              {filtered.length === 0 ? <tr><td colSpan="4" style={{textAlign: 'center', color: '#999'}}>No activity yet.</td></tr>
                : filtered.map(l => <tr key={l.id}><td>{l.action}</td><td>{l.detail}</td><td>{l.user}</td><td>{formatDateForDisplay(l.ts)}</td></tr>)}
            </tbody>
          </table>
          <SummaryBar items={[{ label: 'Logje (filtruar)', value: filtered.length }, { label: 'Gjithsej', value: logs.length }]} />
        </div>
      )}
    </div>
  );
}

// --- Supplier Modal ---
function SupplierModal({ editItem, onClose, onSave }) {
  const [f, setF] = useState({ name: editItem?.name || (function(){ try { const n=localStorage.getItem('erp_new_supplier_name'); if(n){ localStorage.removeItem('erp_new_supplier_name'); return n; } } catch(e) {} return ''; })(), contact: editItem?.contact || '', phone: editItem?.phone || '', email: editItem?.email || '', address: editItem?.address || '', terms: editItem?.terms || '', openingBalance: editItem?.openingBalance ?? '', notes: editItem?.notes || '' });
  const [saving, setSaving] = useState(false);
  const upd = (k, v) => setF(p => ({ ...p, [k]: v }));
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-truck-field"></i> {editItem ? 'Edit' : 'Add'} Supplier</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <form onSubmit={(e) => { e.preventDefault(); setSaving(true); onSave({ ...f, openingBalance: Number(f.openingBalance) || 0 }); }}>
            <div className="form-grid">
              <div className="form-group"><label>Supplier Name *</label><input type="text" value={f.name} onChange={(e) => upd('name', e.target.value)} required /></div>
              <div className="form-group"><label>Contact Person</label><input type="text" value={f.contact} onChange={(e) => upd('contact', e.target.value)} /></div>
              <div className="form-group"><label>Phone</label><input type="text" value={f.phone} onChange={(e) => upd('phone', e.target.value)} /></div>
              <div className="form-group"><label>Email</label><input type="email" value={f.email} onChange={(e) => upd('email', e.target.value)} /></div>
              <div className="form-group"><label>Payment Terms</label><input type="text" placeholder="Net 30, COD..." value={f.terms} onChange={(e) => upd('terms', e.target.value)} /></div>
              <div className="form-group"><label>Opening Balance (payable)</label><input type="number" step="0.01" value={f.openingBalance} onChange={(e) => upd('openingBalance', e.target.value)} /></div>
            </div>
            <div className="form-group"><label>Address</label><textarea rows="2" value={f.address} onChange={(e) => upd('address', e.target.value)}></textarea></div>
            <div className="form-group"><label>Notes</label><textarea rows="2" value={f.notes} onChange={(e) => upd('notes', e.target.value)}></textarea></div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> Ruaj</>}</button>
              <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

  /* open-create:suppliers */
  useEffect(() => {
    if (nav && nav.consumeCreate && nav.consumeCreate('suppliers')) {
      setEditingId(null); setShowModal(true);
    }
  }, []);

  const [editingId, setEditingId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableRef = useRef(null);
  useDtLiveSearch(tableRef, qSearch);
  const { loading, data, err } = useFetch(() => fbGetSuppliers(), [reloadKey]);
  const suppliers = useMemo(() => (data && data.success ? data.data : []), [data]);
  const byId = useMemo(() => suppliers.reduce((m, s) => (m[s.id] = s, m), {}), [suppliers]);
  const reload = () => setReloadKey(k => k + 1);
  const totalPayable = useMemo(() => suppliers.reduce((s, x) => s + Number(x.openingBalance || 0), 0), [suppliers]);
  const [viewSup, setViewSup] = useState(null);

  useEffect(() => { if (err || (data && !data.success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data.message) || 'Failed to load suppliers' }); }, [err, data]);

  useEffect(() => {
    if (loading) return;
    let table = tableRef.current;
    if (table) { table.clear().rows.add(suppliers).draw(false); }
    else {
      table = $('#suppliersTable').DataTable({
        data: suppliers,
        columnDefs: [{ targets: '_all', defaultContent: '' }], // tolerate rows missing newer fields - no "unknown parameter" warning
        createdRow: (row, d) => { if (Number(d.openingBalance) > 0) $(row).addClass('row-warn'); }, // outstanding payable
        columns: [
          { data: 'name', title: 'Emri', render: (d, t) => t === 'display' ? esc(d) : d },
          { data: 'contact', title: 'Kontakt', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'phone', title: 'Telefoni', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'email', title: 'Email', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'terms', title: 'Kushtet', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'openingBalance', title: 'Detyrim', render: (d, t) => t === 'display' ? money(d) : d },
          { data: null, title: 'Veprime', orderable: false, render: () => actionBtn('view', 'fa-eye', 'Shiko') + actionBtn('edit', 'fa-edit', 'Ndrysho', 'edit') + (role === 'Admin' ? actionBtn('delete', 'fa-trash', 'Fshi', 'delete') : '') }
        ],
        pageLength: 80, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']], responsive: true, dom: 'Blfrtip',
        buttons: erpDtButtons('Furnitorët'),
        order: [[0, 'asc']]
      });
      tableRef.current = table;
    }
    $('#suppliersTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      const rowData = getDtRowData(table, this);
      if (!rowData || !rowData.id) return;
      const id = rowData.id;
      const act = $(this).data('action');
      if (act === 'view') setViewSup(byId[id] || rowData);
      else if (act === 'edit') { setEditingId(id); setShowModal(true); }
      else handleDelete(byId[id] || rowData);
    });
  }, [loading, suppliers, role]);

  useEffect(() => () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } }, []);

  const handleSave = async (fd) => {
    setLoad(editingId ? 'Updating supplier...' : 'Saving supplier...');
    const r = editingId ? await fbUpdateSupplier(editingId, fd, user) : await fbAddSupplier(fd, user);
    setLoad('');
    if (r.success) { setShowModal(false); setEditingId(null); Swal.fire({ icon: 'success', title: 'Success!', text: r.message, timer: 1800, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };
  const handleDelete = (s) => Swal.fire({ icon: 'warning', title: 'Delete supplier?', text: s.name, showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then(async (res) => {
    if (!res.isConfirmed) return; setLoad('Deleting...'); const r = await fbDeleteSupplier(s.id, s.name, user); setLoad('');
    if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1600, showConfirmButton: false }); reload(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  });

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header"><h2><i className="fas fa-truck-field"></i> Furnitorët</h2><div style={{ display: 'flex', gap: '10px' }}><RefreshBtn onClick={reload} /><button className="btn btn-success" onClick={() => { setEditingId(null); setShowModal(true); }}><i className="fas fa-plus"></i> I ri</button></div></div>
      {loading && <TableSkeleton rows={8} columns={7} />}
      <div style={{ display: loading ? 'none' : 'block' }}><div className="module-toolbar"><GoogleSearchBox value={qSearch} onChange={setQSearch} placeholder="Kërko furnitor… emër, kontakt, telefon, email…" /></div>
        <table id="suppliersTable" className="display" style={{ width: '100%' }}></table>
        <FilteredSummaryBar tableRef={tableRef} deps={[suppliers, qSearch]} itemsBuilder={(rows) => [
          { label: 'Furnitorë (filtruar)', value: rows.length },
          { label: 'Detyrim (filtruar)', value: money(rows.reduce((s, r) => s + Number(r.openingBalance || 0), 0)) }
        ]} />{suppliers.length > 0 && <SummaryBar items={[{ label: 'Suppliers', value: suppliers.length }, { label: 'Total Payable', value: money(totalPayable) }]} />}</div>
      {viewSup && <SupplierHubModal supplier={viewSup} onClose={() => setViewSup(null)} />}
      {showModal && <SupplierModal editItem={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}

// --- Expense Modal ---
function ExpenseModal({ editItem, onClose, onSave }) {
  const nav = useAppNav();

  const [saving, setSaving] = useState(false);
  const upd = (k, v) => setF(p => ({ ...p, [k]: v }));
  return (
    <div className="modal-overlay" onClick={onClose}>

              <SearchableDropdown label="Paid Via" icon="fas fa-money-bill-wave" options={payOpts || PAYMENT_OPTS} value={f.paymentMethod} onChange={(v) => upd('paymentMethod', v)} placeholder="Cash"
                creatable={true} createLabel="Shto mënyrë pagese: {q}" onCreate={async (q) => {

                  try { refreshConfig && refreshConfig(); } catch(e) {}
                  return { value: q, label: q };
                }} />

            <div className="form-group"><label>Notes</label><textarea rows="2" value={f.notes} onChange={(e) => upd('notes', e.target.value)}></textarea></div>

              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> Ruaj</>}</button>

            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

  /* open-create:expenses */
  useEffect(() => {
    if (nav && nav.consumeCreate && nav.consumeCreate('expenses')) {
      setEditingId(null); setShowModal(true);
    }
  }, []);

  const [editingId, setEditingId] = useState(null);

  const tableRef = useRef(null);
  useDtLiveSearch(tableRef, qSearch);

  const expenses = useMemo(() => (data && data.success ? data.data : []), [data]);

  useEffect(() => {
    if (loading) return;

          { data: 'amount', title: 'Shuma', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'paymentMethod', title: 'Paguar me', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'notes', title: 'Shënime', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: null, title: 'Veprime', orderable: false, render: () => actionBtn('edit', 'fa-edit', 'Ndrysho', 'edit') + (role === 'Admin' ? actionBtn('delete', 'fa-trash', 'Fshi', 'delete') : '') }
        ],
        pageLength: 80, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']], responsive: true, dom: 'Blfrtip',
        buttons: erpDtButtons('Shpenzimet'),
        order: [[0, 'desc']]
      });
      tableRef.current = table;
    }
    $('#expensesTable').off('click', '[data-action]').on('click', '[data-action]', function () {

      if (!rowData || !rowData.id) return;

    });

    setLoad('');
    if (r.success) { setShowModal(false); setEditingId(null); Swal.fire({ icon: 'success', title: 'Success!', text: r.message, timer: 1600, showConfirmButton: false }); reload(); }
    else Swal.fire({ icon: 'error', title: 'Error', text: r.message });

    if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); reload(); } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });

      {showModal && <ExpenseModal editItem={byId[editingId]} onClose={() => { setShowModal(false); setEditingId(null); }} onSave={handleSave} />}
    </div>
  );
}

// --- Purchase Order create modal (supplier + line items) ---
function PurchaseOrderModal({ suppliers, products, onClose, onSave }) {
  const nav = useAppNav();
  const [supplierId, setSupplierId] = useState('');
  const [expectedDate, setExpectedDate] = useState('');
  const [notes, setNotes] = useState('');
  const [lines, setLines] = useState([]);
  const [productId, setProductId] = useState('');
  const [qty, setQty] = useState('');
  const [unitKey, setUnitKey] = useState('base');
  const [unitCost, setUnitCost] = useState('');
  const [saving, setSaving] = useState(false);

  const supplierOpts = useMemo(() => (suppliers || []).map(s => ({ value: s.id, label: s.name })), [suppliers]);
  const productOpts = useMemo(() => (products || []).map(p => ({ value: p.id, label: `${p.name} (${p.sku})` })), [products]);
  const byId = useMemo(() => (products || []).reduce((m, p) => (m[p.id] = p, m), {}), [products]);
  const selectedProduct = productId ? byId[productId] : null;
  const unitOpts = useMemo(() => selectedProduct ? getProductUnitOptions(selectedProduct) : [{ value: 'base', label: 'copë (bazë)', name: 'copë', multiplier: 1 }], [selectedProduct]);
  const selectedUnit = selectedProduct ? getProductUnit(selectedProduct, unitKey) : unitOpts[0];
  const baseQtyPreview = selectedProduct ? toBaseQty(selectedProduct, qty, unitKey) : 0;
  const total = useMemo(() => lines.reduce((s, l) => s + Number(l.lineTotal || 0), 0), [lines]);

  useEffect(() => { setUnitKey('base'); setUnitCost(''); }, [productId]);

  const addLine = () => {
    const q = Number(qty), c = Number(unitCost);
    if (!productId) return Swal.fire({ icon: 'warning', title: 'Zgjidh artikullin' });
    if (!Number.isFinite(q) || q <= 0) return Swal.fire({ icon: 'warning', title: 'Sasi e pasaktë', text: 'Sasia duhet të jetë më e madhe se 0.' });
    const p = byId[productId];
    const unit = getProductUnit(p, unitKey);
    const enteredUnitCost = c || unitPrice(p, unit.value) || Number(p.cost) * unit.multiplier || 0;
    const baseUnitCost = unit.multiplier > 0 ? round2(enteredUnitCost / unit.multiplier) : enteredUnitCost;
    const baseQty = toBaseQty(p, q, unit.value);
    const lineTotal = round2(q * enteredUnitCost);
    setLines(prev => {
      const key = productId + '|' + unit.value;
      const ex = prev.find(l => l.key === key);
      if (ex) return prev.map(l => l.key === key ? { ...l, enteredQty: round2(Number(l.enteredQty || 0) + q), qty: round2(Number(l.qty || 0) + baseQty), enteredUnitCost, unitCost: baseUnitCost, lineTotal: round2(Number(l.lineTotal || 0) + lineTotal) } : l);
      return [...prev, { key, productId, name: p.name, sku: p.sku, enteredQty: q, qty: baseQty, unitKey: unit.value, unitName: unit.name, unitMultiplier: unit.multiplier, enteredUnitCost, unitCost: baseUnitCost, lineTotal }];
    });
    setProductId(''); setQty(''); setUnitKey('base'); setUnitCost('');
  };
  const removeLine = (key) => setLines(prev => prev.filter(l => l.key !== key));

  const submit = async (status) => {
    if (!supplierId) return Swal.fire({ icon: 'warning', title: 'Zgjidh furnitorin' });
    if (!lines.length) return Swal.fire({ icon: 'warning', title: 'Shto të paktën një rresht' });
    const sup = (suppliers || []).find(s => s.id === supplierId);
    setSaving(true);
    await onSave({ supplierId, supplierName: sup ? sup.name : '', items: lines.map(l => ({ ...l, lineUnitCost: l.enteredUnitCost })), total: round2(total), notes: notes.trim() || null, expectedDate: expectedDate || null, status });
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fas fa-file-invoice-dollar"></i> Porosi blerjeje e re</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
        <div className="modal-body">
          <div className="form-grid">
            <SearchableDropdown label="Furnitori" icon="fas fa-truck-field" options={supplierOpts} value={supplierId} onChange={setSupplierId} placeholder="Zgjidh furnitorin..." required={true}
                creatable={true} createLabel="Shto furnitor: {q}" onCreate={async (q) => { try { localStorage.setItem('erp_new_supplier_name', q); } catch(e) {} nav.go('suppliers', 'suppliers'); return false; }} />
            <div className="form-group"><label><i className="fas fa-calendar-day"></i> Data e pritshme</label><input type="date" value={expectedDate} onChange={(e) => setExpectedDate(e.target.value)} /></div>
          </div>
          <div className="pos-disc-row" style={{ gridTemplateColumns: '2fr .75fr .9fr .9fr auto', alignItems: 'end' }}>
            <SearchableDropdown label="Artikulli" icon="fas fa-box" options={productOpts} value={productId} onChange={setProductId} placeholder="Kërko artikull..."
                creatable={true} createLabel="Shto artikull: {q}" onCreate={async (q) => { try { localStorage.setItem('erp_new_product_name', q); } catch(e) {} nav.go('products', 'products'); return false; }} />
            <div className="form-group"><label>Sasia</label><input type="number" min="0" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} /></div>
            <SearchableDropdown label="Njësia" icon="fas fa-scale-balanced" options={unitOpts} value={unitKey} onChange={setUnitKey} placeholder="Zgjidh njësinë..." />
            <div className="form-group"><label>Kosto / njësi</label><input type="number" min="0" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} placeholder="sipas njësisë" /></div>
            <div className="form-group"><label>&nbsp;</label><button type="button" className="btn btn-secondary" onClick={addLine}><i className="fas fa-plus"></i> Shto</button></div>
          </div>
          {selectedProduct && Number(qty) > 0 && <p className="stock-onhand-hint">Konvertim: <strong>{Number(qty)} {selectedUnit.name}</strong> = <strong>{formatQtyWithUnits(baseQtyPreview, selectedProduct)}</strong></p>}
          {lines.length > 0 && (
            <div className="about-table-wrapper" style={{ marginTop: 12 }}>
              <table className="about-roles-table">
                <thead><tr><th>Artikulli</th><th>Sasia</th><th>Njësia</th><th>Në stok</th><th>Kosto/njësi</th><th>Kosto bazë</th><th>Vlera</th><th></th></tr></thead>
                <tbody>
                  {lines.map(l => (
                    <tr key={l.key}>
                      <td>{l.name}<div className="cell-sub">{l.sku}</div></td><td>{l.enteredQty}</td><td>{l.unitName}</td><td>{formatQtyWithUnits(l.qty, byId[l.productId])}</td><td>{money(l.enteredUnitCost)}</td><td>{money(l.unitCost)}</td><td>{money(l.lineTotal)}</td>
                      <td><button type="button" className="action-icon delete-icon" onClick={() => removeLine(l.key)}><i className="fas fa-times"></i></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <p className="stock-onhand-hint" style={{ marginTop: 12 }}>Totali i blerjes: <strong>{money(total)}</strong></p>
          <div className="form-group"><label>Shënime</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)}></textarea></div>
          <div className="form-actions">
            <button type="button" className="btn btn-primary" disabled={saving} onClick={() => submit('ordered')}><i className="fas fa-paper-plane"></i> Ruaj & Porosit</button>
            <button type="button" className="btn btn-secondary" disabled={saving} onClick={() => submit('draft')}><i className="fas fa-floppy-disk"></i> Ruaj Draft</button>
            <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Anulo</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- PO detail + receive ---
function PoDetailModal({ po, onClose, onReceive, supplier }) {
  if (!po) return null;
  const receivable = po.status !== 'received' && po.status !== 'cancelled';
  const stages = [
    { id: 'draft', label: 'Draft' },
    { id: 'ordered', label: 'Ordered' },
    { id: 'received', label: 'Received' },
    { id: 'cancelled', label: 'Cancelled' }
  ];
  const st = po.status || 'draft';
  return (
    <OdooFormOverlay
      breadcrumb="Porosi Blerje"
      title={po.poNumber || 'PO'}
      onClose={onClose}
      buttons={
        <>
          {receivable && <button type="button" className="btn btn-success" onClick={() => onReceive && onReceive(po)}><i className="fas fa-dolly"></i> Kalo në stok</button>}
          <button type="button" className="btn btn-secondary" onClick={() => openPurchaseDocument(po, supplier, false)}><i className="fas fa-eye"></i> Faturë</button>
          <button type="button" className="btn btn-primary" onClick={() => openPurchaseDocument(po, supplier, true)}><i className="fas fa-print"></i> Printo</button>
          <button type="button" className="btn btn-pdf" onClick={() => exportPurchasePdf(po, supplier)}><i className="fas fa-file-pdf"></i> PDF</button>
          <button type="button" className="btn btn-excel" onClick={() => exportPurchaseXlsx(po, supplier)}><i className="fas fa-file-excel"></i> Excel</button>
          <button type="button" className="btn btn-secondary" onClick={onClose}>Mbyll</button>
        </>
      }
    >
      <OdooFormSheet
        title={po.poNumber || 'Porosi'}
        statusbar={<div style={{ maxWidth: 1100, margin: '0 auto 12px' }}><OdooStatusbar stages={stages} value={st} /></div>}
      >
        <div className="o-form-group">
          <div>
            <OdooFormField label="Furnitori" value={po.supplierName || '—'} />
            <OdooFormField label="Statusi" value={statusTextSq(po.status) || po.status || '—'} />
            <OdooFormField label="Pritet" value={po.expectedDate || '—'} />
          </div>
          <div>
            <OdooFormField label="Krijuar" value={formatDateForDisplay(po.createdAt)} />
            <OdooFormField label="Totali" value={money(po.total || 0)} />
            <OdooFormField label="Shënime" value={po.notes || '—'} />
          </div>
        </div>
        <div className="o-form-section-title">Rreshtat e porosisë</div>
        <table className="o-form-table">
          <thead><tr><th>Artikulli</th><th>Sasia</th><th>Njësia</th><th>Në stok</th><th>Kosto/njësi</th><th>Vlera</th></tr></thead>
          <tbody>
            {(po.items || []).map((it, i) => (
              <tr key={(it.sku || '') + i}>
                <td>{it.name}<div className="cell-sub">{it.sku}</div></td>
                <td>{it.enteredQty != null ? it.enteredQty : it.qty}</td>
                <td>{it.unitName || 'copë'}</td>
                <td>{displayBaseQty(it, null)}</td>
                <td>{money(it.enteredUnitCost || it.lineUnitCost || it.unitCost)}</td>
                <td>{money(it.lineTotal != null ? it.lineTotal : (it.enteredQty != null ? it.enteredQty : it.qty) * (it.enteredUnitCost || it.lineUnitCost || it.unitCost || 0))}</td>
              </tr>
            ))}
          </tbody>
          <tfoot><tr><td colSpan="5">TOTAL</td><td>{money(po.total || 0)}</td></tr></tfoot>
        </table>
      </OdooFormSheet>
    </OdooFormOverlay>
  );
}



// --- Purchase Orders View (Odoo list + kanban + facets + form) ---
function PurchaseOrdersView({ user, role, setActiveMenu }) {
  const nav = useAppNav();
  const [qSearch, setQSearch] = useState('');
  const [viewMode, setViewMode] = useState('list');
  const [facetStatus, setFacetStatus] = useState('');
  const [showModal, setShowModal] = useState(false);
  /* open-create:purchase-orders */
  useEffect(() => {
    if (nav && nav.consumeCreate && nav.consumeCreate('purchase-orders')) {
      setShowModal(true);
    }
  }, []);

  const [viewPo, setViewPo] = useState(null);
  const [viewReceipt, setViewReceipt] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [load, setLoad] = useState('');
  const tableRef = useRef(null);
  useDtLiveSearch(tableRef, qSearch);
  useEffect(() => {
    const fn = (e) => { if (!e.detail || e.detail.tableId === 'poTable') setReloadKey(k => k + 1); };
    window.addEventListener('erp-data-changed', fn);
    return () => window.removeEventListener('erp-data-changed', fn);
  }, []);

  const { loading, data, err } = useFetch(() => Promise.all([fbGetPurchaseOrders(), fbGetSuppliers(), fbGetProducts()]), [reloadKey]);
  const pos = useMemo(() => (data && data[0] && data[0].success ? data[0].data : []), [data]);
  const suppliers = useMemo(() => (data && data[1] && data[1].success ? data[1].data : []), [data]);
  const products = useMemo(() => (data && data[2] && data[2].success ? data[2].data : []), [data]);
  const byId = useMemo(() => pos.reduce((m, p) => (m[p.id] = p, m), {}), [pos]);
  const tableData = useMemo(() => pos.map(p => Object.assign({}, p, {
    itemCount: (p.items || []).length,
    unitSummary: (p.items || []).map(it => (it.enteredQty != null ? it.enteredQty : it.qty) + ' ' + (it.unitName || 'copë')).join(', ')
  })), [pos]);
  const reload = () => setReloadKey(k => k + 1);
  const poSummary = useMemo(() => ({
    count: pos.length,
    total: pos.reduce((s, p) => s + Number(p.total || 0), 0),
    open: pos.filter(p => p.status !== 'received' && p.status !== 'cancelled').reduce((s, p) => s + Number(p.total || 0), 0)
  }), [pos]);

  const displayPOs = useMemo(() => (tableData || []).filter(p => {
    if (facetStatus && (p.status || 'draft') !== facetStatus) return false;
    return true;
  }), [tableData, facetStatus]);

  const statusBadge = (s) => {
    const map = { received: 'status-active', ordered: 'type-chip', draft: '', cancelled: 'status-inactive' };
    const cls = map[s] || 'type-chip';
    return `<span class="${cls === 'type-chip' ? 'type-chip' : 'status-badge ' + cls}">${esc(statusTextSq(s) || s || 'draft')}</span>`;
  };

  useEffect(() => {
    if (err || (data && data[0] && !data[0].success)) Swal.fire({ icon: 'error', title: 'Error', text: (data && data[0] && data[0].message) || 'Failed to load POs' });
  }, [err, data]);

  useEffect(() => {
    if (loading) return;
    if (viewMode !== 'list') {
      if (tableRef.current) { try { tableRef.current.destroy(); } catch (e) {} tableRef.current = null; }
      return;
    }
    if (!document.getElementById('poTable')) return;
    if (tableRef.current) {
      try { if (!document.contains(tableRef.current.table().node())) { tableRef.current.destroy(); tableRef.current = null; } } catch (e) { tableRef.current = null; }
    }
    let table = tableRef.current;
    if (table) { table.clear().rows.add(displayPOs).draw(false); }
    else {
      table = $('#poTable').DataTable({
        data: displayPOs,
        columnDefs: [{ targets: '_all', defaultContent: '' }],
        createdRow: (row, d) => { if (d.status === 'received') $(row).addClass('row-ok'); else if (d.status === 'cancelled') $(row).addClass('row-muted'); else $(row).addClass('row-warn'); },
        columns: [
          { data: 'poNumber', title: 'Nr. Porosie', render: (d, t, row) => t === 'display' ? docLinkHtml('view', row.id, d || '') : d },
          { data: 'createdAt', title: 'Data', render: (d, t) => t === 'display' ? formatDateForDisplay(d) : d },
          { data: 'supplierName', title: 'Furnitori', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'itemCount', title: 'Rreshta' },
          { data: 'unitSummary', title: 'Njësitë', defaultContent: '-', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: 'total', title: 'Totali', render: (d, t) => t === 'display' ? money(d) : d },
          { data: 'status', title: 'Statusi', render: (d, t) => t === 'display' ? statusBadge(d) : d },
          { data: 'expectedDate', title: 'Pritet', render: (d, t) => t === 'display' ? esc(d || '-') : d },
          { data: null, title: 'Veprime', orderable: false, render: (d, t, row) => actionBtn('view', 'fa-eye', 'Shiko') + actionBtn('invoice', 'fa-file-invoice', 'Faturë') + actionBtn('invoicepdf', 'fa-file-pdf', 'PDF') + actionBtn('invoicexlsx', 'fa-file-excel', 'Excel') + (row.status !== 'received' && row.status !== 'cancelled' ? actionBtn('receive', 'fa-dolly', 'Kalo në stok', 'qr') : '') + (role === 'Admin' ? actionBtn('delete', 'fa-trash', 'Fshi', 'delete') : '') }
        ],
        pageLength: 80,
        lengthMenu: [[20, 40, 80, 100, -1], [20, 40, 80, 100, 'Të gjitha']],
        responsive: true,
        dom: 'Blfrtip',
        buttons: erpDtButtons('Porositë_Blerjes'),
        order: [[1, 'desc']]
      });
      tableRef.current = table;
    }
    $('#poTable').off('click', '[data-action]').on('click', '[data-action]', function () {
      const rowData = getDtRowData(table, this);
      if (!rowData || !rowData.id) return;
      const action = $(this).data('action');
      if (action === 'view') setViewPo(byId[rowData.id] || rowData);
      else if (action === 'receive') doReceive(byId[rowData.id] || rowData);
      else if (action === 'delete') handleDelete(byId[rowData.id] || rowData);
      else if (action === 'invoice' || action === 'invoicepdf' || action === 'invoicexlsx') {
        const po = byId[rowData.id] || rowData;
        const sup = (suppliers || []).find(s => s.id === po.supplierId);
        if (action === 'invoice') openPurchaseDocument(po, sup, false);
        else if (action === 'invoicepdf') exportPurchasePdf(po, sup);
        else exportPurchaseXlsx(po, sup);
      }
    });
  }, [loading, displayPOs, role, viewMode]);

  useEffect(() => () => {
    if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} }
  }, []);

  const handleSave = async (fd) => {
    setLoad('Duke ruajtur porosinë...');
    const r = await fbCreatePurchaseOrder(fd, user);
    setLoad('');
    if (r.success) {
      setShowModal(false);
      Swal.fire({ icon: 'success', title: 'U ruajt!', text: r.message, timer: 1600, showConfirmButton: false });
      reload();
    } else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
  };

  const doReceive = async (po) => {
    const warehouses = (CFG.warehouses && CFG.warehouses.length) ? CFG.warehouses : ['Magazina Kryesore', 'Depo 2'];
    
    const { value: selectedWarehouse } = await Swal.fire({
      title: 'Zgjidh Magazinën',
      input: 'select',
      inputOptions: warehouses.reduce((o, w) => { o[w] = w; return o; }, {}),
      inputPlaceholder: 'Zgjidh magazinën',
      showCancelButton: true,
      confirmButtonText: 'Vazhdo',
      confirmButtonColor: '#714B67'
    });
    
    if (!selectedWarehouse) return;

    const conf = await Swal.fire({ 
      icon: 'question', 
      title: 'Krijo Fletë Hyrje?', 
      text: `${po.poNumber || ''} → ${selectedWarehouse}`, 
      showCancelButton: true, 
      confirmButtonText: 'Ruaj blerjen & Krijo Fletë Hyrje', 
      cancelButtonText: 'Anulo', 
      confirmButtonColor: '#714B67' 
    });
    if (!conf.isConfirmed) return;

    const autoNo = 'FH-' + String(po.poNumber || Date.now()).replace(/[^0-9A-Z]/gi, '').slice(-6);
    const numRes = await Swal.fire({
      icon: 'question',
      title: 'Numri i Fletës së Hyrjes',
      html: 'Automatik nga porosia e blerjes (<b>' + autoNo + '</b>), ose shkruaje manualisht:',
      input: 'text',
      inputValue: autoNo,
      showCancelButton: true,
      confirmButtonText: 'Vazhdo',
      cancelButtonText: 'Anulo',
      confirmButtonColor: '#714B67'
    });
    if (!numRes.isConfirmed) { setLoad(''); return; }
    const docNo = String(numRes.value || '').trim() || autoNo;

    setLoad('Duke krijuar Fletë Hyrje...');

    // Create receipt record
    const receipt = {
      docNo,
      poId: po.id,
      poNumber: po.poNumber,
      supplierId: po.supplierId,
      supplierName: po.supplierName,
      warehouse: selectedWarehouse,
      items: (po.items || []).map(it => ({
        productId: it.productId,
        name: it.name,
        sku: it.sku,
        qty: Number(it.qty) || 0,
        enteredQty: Number(it.enteredQty != null ? it.enteredQty : it.qty) || 0,
        unitKey: it.unitKey || 'base',
        unitName: it.unitName || 'copë',
        unitMultiplier: Number(it.unitMultiplier) || 1,
        unitCost: Number(it.unitCost) || 0,
        enteredUnitCost: Number(it.enteredUnitCost || it.lineUnitCost || it.unitCost) || 0,
        lineTotal: Number(it.lineTotal) || 0,
        warehouse: selectedWarehouse
      })),
      total: po.total || 0,
      notes: po.notes || '',
      createdAt: nowIso()
    };

    const receiptRes = await fbCreateWarehouseReceiptIn(receipt, user);
    if (!receiptRes.success) {
      setLoad('');
      Swal.fire({ icon: 'error', title: 'Fletë Hyrje nuk u ruajt', text: receiptRes.message || 'Ruajtja e dokumentit dështoi. Stoku nuk u ndryshua.' });
      return;
    }
    
    // Update PO status + stock movements in the same selected warehouse only after the document is saved.
    const r = await fbReceivePurchaseOrder(po, user, false, selectedWarehouse, { id: receiptRes.id, docNo });
    
    setLoad('');
    
    if (r.success) {
      setViewPo(null);
      Swal.fire({ 
        icon: 'success', 
        title: 'Fletë Hyrje u krijua!', 
        text: docNo, 
        timer: 1800, 
        showConfirmButton: false 
      });
      
      // Open the full Fletë Hyrje preview with Print/PDF/Excel actions.
      setViewReceipt(receiptRes.data || { id: receiptRes.id, ...receipt });
      reload();
    } else {
      Swal.fire({ icon: 'error', title: 'Gabim gjatë hyrjes në stok', text: r.message || 'Fletë Hyrje u ruajt, por stoku nuk u përditësua plotësisht. Kontrollo lëvizjet e magazinës.' });
    }
  };

  const handleDelete = (po) => {
    Swal.fire({ icon: 'warning', title: 'Fshi porosinë?', text: po.poNumber || '', showCancelButton: true, confirmButtonColor: '#d9534f', confirmButtonText: 'Confirm', cancelButtonText: 'Cancel' }).then(async (res) => {
      if (!res.isConfirmed) return;
      setLoad('Duke fshirë...');
      const r = await fbDeletePurchaseOrder(po.id, po.poNumber, user);
      setLoad('');
      if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1400, showConfirmButton: false }); reload(); }
      else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
    });
  };

  const poFacets = useMemo(() => {
    const f = [];
    if (facetStatus) f.push({ id: 'status', label: 'Statusi', value: statusTextSq(facetStatus) || facetStatus });
    if (qSearch) f.push({ id: 'q', label: 'Kërkim', value: qSearch });
    return f;
  }, [facetStatus, qSearch]);
  const poChips = [
    { id: 'draft', label: 'Draft', active: facetStatus === 'draft' },
    { id: 'ordered', label: 'Ordered', active: facetStatus === 'ordered' },
    { id: 'received', label: 'Received', active: facetStatus === 'received' },
    { id: 'cancelled', label: 'Cancelled', active: facetStatus === 'cancelled' }
  ];
  
  const onPoKanbanDrop = async (cardId, fromCol, toCol, card) => {
    if (!cardId || fromCol === toCol) return;
    const allowed = ['draft', 'ordered', 'received', 'cancelled'];
    if (allowed.indexOf(toCol) < 0) return;
    // receiving stock should use receive flow
    if (toCol === 'received' && fromCol !== 'received') {
      const po = byId[cardId] || (card && card.record);
      if (po) { doReceive(po); return; }
    }
    const r = await fbUpdatePurchaseOrder(cardId, { status: toCol, poNumber: (card && card.title) || cardId }, user);
    if (r.success) {
      Swal.fire({ icon: 'success', title: 'Statusi u ndryshua', timer: 1200, showConfirmButton: false });
      reload();
    } else Swal.fire({ icon: 'error', title: 'Gabim', text: r.message });
  };

const poKanban = useMemo(() => {
    const stages = ['draft', 'ordered', 'received', 'cancelled'];
    const titles = { draft: 'Draft', ordered: 'Ordered', received: 'Received', cancelled: 'Cancelled' };
    const src = displayPOs.filter(p => {
      if (qSearch) {
        const q = qSearch.toLowerCase();
        const blob = [p.poNumber, p.supplierName, p.status].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });
    return stages.map(st => ({
      id: st,
      title: titles[st],
      cards: src.filter(p => (p.status || 'draft') === st).map(p => ({
        id: p.id,
        title: p.poNumber || String(p.id).slice(-6),
        sub: p.supplierName || '—',
        meta: formatDateForDisplay(p.createdAt),
        amount: money(p.total),
        footer: (p.itemCount != null ? p.itemCount + ' rreshta' : ''),
        tags: [statusTextSq(p.status) || p.status].filter(Boolean),
        record: p,
        onClick: () => setViewPo(byId[p.id] || p)
      }))
    }));
  }, [displayPOs, qSearch, byId]);

  return (
    <div className="data-section">
      {load && <TopLoadingBar />}
      <div className="section-header">
        <h2><i className="fas fa-file-invoice-dollar"></i> Porosi Blerje</h2>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <OdooViewSwitcher mode={viewMode} onChange={setViewMode} />
          <RefreshBtn onClick={reload} />
          <button className="btn btn-success" disabled={loading} onClick={() => setShowModal(true)}><i className="fas fa-plus"></i> I ri</button>
        </div>
      </div>
      <div className="o-cp-tools">
        <OdooSearchFacets
          value={qSearch}
          onChange={setQSearch}
          placeholder="Kërko porosi… nr, furnitor, status…"
          facets={poFacets}
          onRemoveFacet={(f) => { if (f.id === 'status') setFacetStatus(''); if (f.id === 'q') setQSearch(''); }}
          filterChips={poChips}
          onToggleChip={(c) => setFacetStatus(facetStatus === c.id ? '' : c.id)}
        />
      </div>
      {loading && <TableSkeleton rows={8} columns={8} />}
      <div style={{ display: loading ? 'none' : 'block' }}>
        <div style={{ display: viewMode === 'list' ? 'block' : 'none' }}>
            <table id="poTable" className="display" style={{ width: '100%' }}></table>
            <FilteredSummaryBar tableRef={tableRef} deps={[displayPOs, qSearch, facetStatus]} itemsBuilder={(rows) => [
              { label: 'Porosi (filtruar)', value: rows.length },
              { label: 'Totali (filtruar)', value: money(rows.reduce((s, r) => s + Number(r.total || 0), 0)) },
              { label: 'Hapura', value: rows.filter(r => r.status !== 'received' && r.status !== 'cancelled').length }
            ]} />
            {pos.length > 0 && <SummaryBar items={[{ label: 'POs', value: poSummary.count }, { label: 'Total Value', value: money(poSummary.total) }, { label: 'Open (unreceived)', value: money(poSummary.open) }]} />}
          </div>
        {viewMode === 'kanban' && <OdooKanban columns={poKanban} onDropCard={onPoKanbanDrop} />}
      </div>
      {showModal && <PurchaseOrderModal suppliers={suppliers} products={products} onClose={() => setShowModal(false)} onSave={handleSave} />}
      {viewPo && <PoDetailModal po={viewPo} onClose={() => setViewPo(null)} onReceive={doReceive} supplier={(suppliers || []).find(s => s.id === viewPo.supplierId)} />}
      {viewReceipt && <WarehouseReceiptInOverlay receipt={viewReceipt} onClose={() => setViewReceipt(null)} />}
    </div>
  );
}



function WarehouseReceiptsInView({ user, role }) {
  const [reloadKey, setReloadKey] = useState(0);
  const [query, setQuery] = useState('');
  const [selectedReceipt, setSelectedReceipt] = useState(null);
  useEffect(() => {
    const fn = () => setReloadKey(k => k + 1);
    window.addEventListener('erp-data-changed', fn);
    return () => window.removeEventListener('erp-data-changed', fn);
  }, []);
  const { loading, data, err } = useFetch(() => fbGetWarehouseReceiptsIn(), [reloadKey]);
  const receipts = useMemo(() => (data && data.success ? data.data : []), [data]);
  const filtered = useMemo(() => {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return receipts;
    return receipts.filter(r => [r.docNo, r.poNumber, r.supplierName, r.warehouse, r.createdAt].some(v => String(v || '').toLowerCase().includes(q)));
  }, [receipts, query]);

  useEffect(() => {
    if (err || (data && !data.success)) Swal.fire({ icon:'error', title:'Gabim', text:(data && data.message) || String(err || 'Nuk u ngarkuan Fletë Hyrjet') });
  }, [err, data]);

  return (
    <div className="data-section">
      <div className="section-header">
        <h2><i className="fas fa-box-open"></i> Fletë Hyrje</h2>
        <button type="button" className="btn btn-secondary btn-refresh" onClick={() => setReloadKey(k => k + 1)}><i className="fas fa-rotate"></i> Rifresko</button>
      </div>
      <div className="module-toolbar">
        <div className="left"><div className={'google-search-wrap' + (query ? ' has-value' : '')}><i className="fas fa-search gs-icon"></i><input value={query} onChange={e => setQuery(e.target.value)} placeholder="Kërko nr., porosi, furnitor, magazinë…" /><button className="gs-clear" onClick={() => setQuery('')}><i className="fas fa-times"></i></button></div></div>
        <div className="right"><span className="type-chip">{filtered.length} dokumente</span></div>
      </div>
      {loading ? <TableSkeleton rows={8} columns={8} /> : (
        <div className="about-table-wrapper">
          <table className="about-roles-table">
            <thead><tr><th>Nr. Fletë Hyrje</th><th>Data</th><th>Porosia</th><th>Furnitori</th><th>Magazina</th><th>Rreshta</th><th>Totali</th><th>Veprime</th></tr></thead>
            <tbody>
              {filtered.length === 0 ? <tr><td colSpan="8" style={{textAlign:'center', color:'#888', padding:24}}>Nuk ka Fletë Hyrje.</td></tr> : filtered.map(r => (
                <tr key={r.id || r.docNo}>
                  <td><button type="button" className="doc-link" onClick={() => setSelectedReceipt(r)}><i className="fas fa-arrow-right"></i>{warehouseDocNoFromReceipt(r)}</button></td>
                  <td>{formatDateForDisplay(r.createdAt)}</td>
                  <td>{r.poNumber || '—'}</td>
                  <td>{r.supplierName || '—'}</td>
                  <td>{r.warehouse || 'Magazina Kryesore'}</td>
                  <td>{(r.items || []).length}</td>
                  <td>{money(r.total || 0)}</td>
                  <td style={{whiteSpace:'nowrap'}}>
                    <button type="button" className="action-icon qr-icon" title="Shiko" onClick={() => setSelectedReceipt(r)}><i className="fas fa-eye"></i></button>
                    <button type="button" className="action-icon edit-icon" title="Printo" onClick={() => openWarehouseReceiptInDocument(r, true)}><i className="fas fa-print"></i></button>
                    <button type="button" className="action-icon delete-icon" title="PDF" onClick={() => exportWarehouseInPdf(r)}><i className="fas fa-file-pdf"></i></button>
                    <button type="button" className="action-icon qr-icon" title="Excel" onClick={() => exportWarehouseInXlsx(r)}><i className="fas fa-file-excel"></i></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <SummaryBar items={[{ label:'Fletë Hyrje', value:filtered.length }, { label:'Vlera totale', value:money(filtered.reduce((s,r)=>s+Number(r.total||0),0)) }]} />
      {selectedReceipt && <WarehouseReceiptInOverlay receipt={selectedReceipt} onClose={() => setSelectedReceipt(null)} />}
    </div>
  );
}

function UserModal({ editUser, onClose, onSave }) {
  const [formData, setFormData] = useState({
    name: editUser?.name || '',
    email: editUser?.email || '',
    password: '',
    role: editUser?.role || 'User',
    active: editUser?.active !== false
  });
  const [customRights, setCustomRights] = useState(() => {
    const base = getRights(editUser?.role || 'User');
    const over = (editUser && editUser.rights) || {};
    const keys = ['pos','products','stock','sales-history','reports','records','suppliers','purchase-orders','warehouse-receipts-in','expenses','users','settings','logs','import-export','canCreate','canEdit','canDelete','canExport'];
    const o = {};
    keys.forEach(k => { o[k] = over[k] != null ? !!over[k] : !!base[k]; });
    return o;
  });
  const [useCustom, setUseCustom] = useState(!!(editUser && editUser.rights));
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => {
    // when role changes and not custom, refresh rights preview
    if (!useCustom) {
      const base = getRights(formData.role);
      setCustomRights(prev => {
        const n = {};
        Object.keys(prev).forEach(k => { n[k] = !!base[k]; });
        return n;
      });
    }
  }, [formData.role, useCustom]);

  const toggleRight = (key) => {
    setUseCustom(true);
    setCustomRights(p => ({ ...p, [key]: !p[key] }));
  };

  const submit = async (e) => {
    e.preventDefault();
    setErr('');
    const name = formData.name.trim();
    const email = formData.email.trim();
    if (!name) { setErr('Shkruaj emrin e përdoruesit'); return; }
    if (!email || !email.includes('@')) { setErr('Shkruaj një email të vlefshëm'); return; }
    if (!editUser && (!formData.password || formData.password.length < 4)) { setErr('Fjalëkalimi duhet ≥ 4 karaktere'); return; }
    if (!formData.role) { setErr('Zgjidh rolin / të drejtat'); return; }
    setSaving(true);
    try {
      const payload = {
        name,
        email,
        role: formData.role,
        active: formData.active !== false,
        rights: (formData.role === 'Admin') ? null : (useCustom ? customRights : null)
      };
      if (!editUser || formData.password) payload.password = formData.password;
      await onSave(payload);
    } catch (ex) {
      setErr(String(ex && ex.message || ex));
    }
    setSaving(false);
  };

  const moduleKeys = ['pos','products','stock','sales-history','reports','records','suppliers','purchase-orders','warehouse-receipts-in','expenses','users','settings','logs'];
  const actionKeys = ['canCreate','canEdit','canDelete','canExport'];
  const isAdminRole = formData.role === 'Admin';

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 760 }}>
        <div className="modal-header">
          <h3><i className="fas fa-user-gear"></i> {editUser ? 'Ndrysho përdoruesin' : 'Shto përdorues'}</h3>
          <button type="button" className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
        </div>
        <div className="modal-body">
          <form onSubmit={submit}>
            {err && <div style={{ background:'#fdecea', color:'#b02a37', border:'1px solid #f5c2c7', borderRadius:4, padding:'10px 12px', marginBottom:14, fontSize:13 }}><i className="fas fa-circle-exclamation"></i> {err}</div>}
            <div className="form-grid">
              <div className="form-group"><label>Emri *</label><input type="text" value={formData.name} onChange={(e) => setFormData(p => ({ ...p, name: e.target.value }))} placeholder="p.sh. Arben Krasniqi" autoFocus /></div>
              <div className="form-group"><label>Email *</label><input type="email" value={formData.email} onChange={(e) => setFormData(p => ({ ...p, email: e.target.value }))} placeholder="p.sh. arben@firma.al" /></div>
              <div className="form-group"><label>Fjalëkalimi {editUser ? '(bosh = pa ndryshim)' : '*'}</label><input type="password" value={formData.password} onChange={(e) => setFormData(p => ({ ...p, password: e.target.value }))} placeholder={editUser ? '••••••••' : 'min. 4 karaktere'} autoComplete="new-password" /></div>
              <div className="form-group">
                <label>Roli / Niveli i aksesit *</label>
                <select className="filter-input" value={formData.role} onChange={(e) => setFormData(p => ({ ...p, role: e.target.value }))} style={{ width:'100%' }}>
                  {ROLE_OPTS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
            </div>
            <div className="form-group" style={{ marginTop: 8 }}>
              <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
                <input type="checkbox" className="odoo-check" checked={formData.active !== false} onChange={(e) => setFormData(p => ({ ...p, active: e.target.checked }))} />
                Llogaria aktive
              </label>
            </div>

            <div style={{ marginTop: 16, border:'1px solid var(--o-border, #dee2e6)', borderRadius:4, overflow:'hidden' }}>
              <div style={{ padding:'10px 14px', background:'#f8f9fa', borderBottom:'1px solid #dee2e6', display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                <strong style={{ fontWeight:500 }}><i className="fas fa-shield-halved" style={{ color:'#714B67', marginRight:8 }}></i>Të drejtat e aksesit</strong>
                {!isAdminRole && (
                  <label style={{ display:'flex', alignItems:'center', gap:6, fontSize:12.5, color:'#6c757d', cursor:'pointer', margin:0 }}>
                    <input type="checkbox" checked={useCustom} onChange={(e) => setUseCustom(e.target.checked)} />

                )}
              </div>
              <div style={{ padding:14 }}>
                {isAdminRole ? (
                  <div style={{ color:'#1e7e34', fontSize:13.5 }}><i className="fas fa-circle-check"></i> Admin ka akses të plotë në të gjitha modulet dhe veprimet.</div>
                ) : (
                  <>
                    <div style={{ fontSize:12, color:'#6c757d', marginBottom:10 }}>Modulet që mund t’i shohë:</div>
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:8, marginBottom:14 }}>
                      {moduleKeys.map(k => (
                        <label key={k} style={{ display:'flex', alignItems:'center', gap:8, fontSize:13, padding:'6px 8px', background: customRights[k] ? '#eef7f7' : '#fafafa', border:'1px solid #e9ecef', borderRadius:3, cursor: useCustom ? 'pointer' : 'default', opacity: useCustom || customRights[k] ? 1 : 0.7 }}>
                          <input type="checkbox" className="odoo-check" checked={!!customRights[k]} disabled={!useCustom} onChange={() => toggleRight(k)} />
                          {RIGHT_LABELS[k] || k}
                        </label>
                      ))}
                    </div>
                    <div style={{ fontSize:12, color:'#6c757d', marginBottom:10 }}>Veprimet e lejuara:</div>
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))', gap:8 }}>
                      {actionKeys.map(k => (
                        <label key={k} style={{ display:'flex', alignItems:'center', gap:8, fontSize:13, padding:'6px 8px', background: customRights[k] ? '#f3eef2' : '#fafafa', border:'1px solid #e9ecef', borderRadius:3, cursor: useCustom ? 'pointer' : 'default' }}>
                          <input type="checkbox" className="odoo-check" checked={!!customRights[k]} disabled={!useCustom} onChange={() => toggleRight(k)} />
                          {RIGHT_LABELS[k] || k}

                      ))}

                    {!useCustom && <div style={{ marginTop:10, fontSize:12, color:'#6c757d' }}>Të drejtat vijnë nga roli <b>{formData.role}</b>. Aktivizo “Personalizo” për t’i ndryshuar.</div>}

            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Duke ruajtur...</> : <><i className="fas fa-save"></i> Ruaj përdoruesin</>}</button>

          </form>
        </div>
      </div>
    </div>
  );
